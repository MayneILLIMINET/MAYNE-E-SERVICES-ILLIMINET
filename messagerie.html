<!DOCTYPE html>
<html lang="fr"><head><style>

</style><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Messagerie MAYNE WhatsApp Style</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100dvh;overflow:hidden;background:#0b141a}
body{font-family:system-ui,-apple-system,Arial;display:flex;justify-content:center;color:#e9edef}
.app{width:100%;max-width:900px;height:100dvh;background:#0b141a;display:flex;flex-direction:column}
.top{height:62px;background:#202c33;display:flex;align-items:center;gap:12px;padding:0 12px}
.top .av{width:42px;height:42px;border-radius:50%;background:#ff5000;display:flex;align-items:center;justify-content:center;font-weight:900}
.top small{color:#8696a0;font-size:13px}.top .sp{flex:1}.top button{background:none;border:none;color:#aebac1;font-size:22px;cursor:pointer}
.chat{flex:1;overflow-y:auto;padding:16px 6%;display:flex;flex-direction:column;gap:6px}
.date{display:flex;justify-content:center;margin:10px 0}.date span{background:#182229;color:#8696a0;font-size:12.5px;padding:7px 12px;border-radius:8px}
.row{display:flex;width:100%}.row.left{justify-content:flex-start}.row.right{justify-content:flex-end}
.row.selected .bubble{outline:2px solid #00a884;background:#2a3942!important}
.bubble{max-width:88%;min-width:120px;padding:7px 9px 6px;border-radius:8px;font-size:16.5px;line-height:1.45;word-break:break-word;box-shadow:0 1px 1px rgba(0,0,0,.3);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-y;position:relative}
.left .bubble{background:#202c33;border-top-left-radius:0}.right .bubble{background:#005c4b;border-top-right-radius:0}
.time{font-size:11px;color:#8696a0;float:right;margin:10px 0 0 10px;white-space:nowrap}.right .time{color:#a8d5c5}
.check{position:absolute;left:-4px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;background:#00a884;color:#fff;display:none;align-items:center;justify-content:center;font-size:12px}.row.selected .check{display:flex}
.bar{flex-shrink:0;background:#0b141a;padding:6px 8px calc(8px + env(safe-area-inset-bottom));display:flex;align-items:flex-end;gap:8px}
.input{flex:1;background:#202c33;border-radius:24px;padding:8px 10px}
.input input{width:100%;background:transparent;border:none;outline:none;color:#e9edef;font-size:16.5px;padding:7px 4px}
.icons{display:flex;justify-content:space-between;padding:2px 4px 0}.icons button{background:none;border:none;font-size:22px;color:#8696a0;cursor:pointer}
.mic,.send{width:52px;height:52px;border-radius:50%;background:#00a884;color:#fff;border:none;font-size:22px;flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer}.send{display:none;font-size:20px}
.selectbar{display:none;background:#202c33;padding:10px 12px;align-items:center;gap:10px;font-weight:700}.selectbar.show{display:flex}
.selectbar button{border:none;border-radius:999px;padding:9px 12px;font-weight:800;cursor:pointer;background:#2a3942;color:#fff}.selectbar .del{background:#fff;color:#d63e00}
@media(min-width:700px){.bubble{max-width:75%;font-size:17px}.chat{padding:18px 10%}}
</style></head>
<body><div class="app">
<div class="top"><span style="font-size:26px">←</span><div class="av">T</div><div><b>_TOk13</b><br><small>en ligne auj. à 21:05</small></div><div class="sp"></div><button>📷</button><button>📞</button><button>⋮</button></div>
<div class="selectbar" id="selectbar"><span onclick="exitSel()" style="cursor:pointer">✕</span><span id="count">0 sélectionné(s)</span><button onclick="copySel()">📋 Copier</button><button onclick="replySel()">↩️ Répondre</button><button class="del">🗑️ Supprimer</button></div>
<div class="chat" id="chat">
<div class="date"><span>Aujourd'hui</span></div>
<div class="row left"><div class="bubble" data-key="1">client_id: 0147880711<br>operateur: MTN<br>montant: 100<br>statut: en cours<span class="time">21:03</span></div><span class="check">✓</span></div>
<div class="row right"><div class="bubble" data-key="3">✅ *840*123*1*0192316104# ✅<span class="time">21:05 ✓✓</span></div><span class="check">✓</span></div>
</div>
<div class="bar"><div class="input"><input id="inp" placeholder="Message" oninput="onIn(this)"><div class="icons"><span style="color:#8696a0;font-size:13px;border:1px solid #374045;padding:6px 12px;border-radius:999px">Suggestions</span><span><button>😊</button><button>📎</button><button>📷</button></span></div></div><button class="mic" id="mic">🎙️</button><button class="send" id="send" onclick="sendMsg()">➤</button></div>
</div>
<script>
let sel=new Set(), mode=false, timer=null, longFired=false, startX=0, startY=0;
const chat=document.getElementById('chat');
function refresh(){document.getElementById('selectbar').classList.toggle('show',mode);document.getElementById('count').textContent=sel.size+' sélectionné(s)';document.querySelectorAll('.row').forEach(r=>r.classList.toggle('selected',sel.has(r.querySelector('.bubble').dataset.key)))}
function selectKey(k){if(!mode){mode=true;sel=new Set([k])}else{if(sel.has(k))sel.delete(k);else sel.add(k)}if(!sel.size){exitSel();return}if(navigator.vibrate)navigator.vibrate(30);refresh()}
function exitSel(){mode=false;sel.clear();refresh()}
function copySel(){alert('Copié');exitSel()} function replySel(){alert('Réponse');exitSel()}
chat.addEventListener('touchstart',e=>{const b=e.target.closest('.bubble');if(!b)return;const p=e.touches[0];startX=p.clientX;startY=p.clientY;longFired=false;timer=setTimeout(()=>{longFired=true;selectKey(b.dataset.key)},450)},{passive:true});
chat.addEventListener('touchmove',e=>{if(!timer)return;const p=e.touches[0];if(Math.abs(p.clientX-startX)>12||Math.abs(p.clientY-startY)>12){clearTimeout(timer);timer=null}},{passive:true});
chat.addEventListener('touchend',()=>{clearTimeout(timer);timer=null;setTimeout(()=>longFired=false,100)},{passive:true});
chat.addEventListener('mousedown',e=>{const b=e.target.closest('.bubble');if(!b)return;startX=e.clientX;startY=e.clientY;longFired=false;timer=setTimeout(()=>{longFired=true;selectKey(b.dataset.key)},450)});
chat.addEventListener('mouseup',()=>{clearTimeout(timer);timer=null});
chat.addEventListener('click',e=>{if(longFired||mode){e.preventDefault();e.stopPropagation();return}},true);
function onIn(inp){const has=inp.value.trim().length>0;document.getElementById('mic').style.display=has?'none':'flex';document.getElementById('send').style.display=has?'flex':'none'}
function sendMsg(){const i=document.getElementById('inp');if(!i.value.trim())return;const d=document.createElement('div');d.className='row right';d.innerHTML='<div class="bubble" data-key="'+Date.now()+'">'+i.value+'<span class="time">maintenant ✓</span></div><span class="check">✓</span>';chat.appendChild(d);i.value='';onIn(i);chat.scrollTop=chat.scrollHeight}
</script><script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body></html>
