async function pushJS(destId,titre,msg){ if(!destId) return; try{ await fetch(ONESIGNAL_WEBHOOK,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify({destId:destId,titre:titre,message:msg})}); }catch(e){} }

async function uploadAudioToCloudinary(blob, fileName){
  const fd=new FormData();
  fd.append('file', blob, fileName || ('vocal_'+Date.now()+'.m4a'));
  fd.append('upload_preset', CLOUDINARY_PRESET_AUDIO);
  fd.append('folder','audio');
  const res=await fetch('https://api.cloudinary.com/v1_1/'+CLOUDINARY_CLOUD_NAME+'/auto/upload',{method:'POST',body:fd});
  const j=await res.json();
  if(!j.secure_url) throw new Error(j.error?.message||'Upload Cloudinary échoué');
  return j.secure_url;
}
async function uploadImageToCloudinary(blob){
  const fd=new FormData(); fd.append('file',blob,'img_'+Date.now()+'.jpg'); fd.append('upload_preset',CLOUDINARY_PRESET_IMAGE); fd.append('folder','images');

}

let wavCtx=null,wavStream=null,wavProcessor=null,wavSource=null,wavChunks=[],wavSampleRate=44100;
function wavEncode(chunks, sampleRate){
  let total=0; chunks.forEach(c=>total+=c.length);
  const data=new Float32Array(total); let off=0; chunks.forEach(c=>{ data.set(c,off); off+=c.length; });
  const buf=new ArrayBuffer(44+total*2); const view=new DataView(buf);
  function str(o,s){ for(let i=0;i<s.length;i++) view.setUint8(o+i,s.charCodeAt(i)); }
  str(0,'RIFF'); view.setUint32(4,36+total*2,true); str(8,'WAVE'); str(12,'fmt '); view.setUint32(16,16,true); view.setUint16(20,1,true); view.setUint16(22,1,true); view.setUint32(24,sampleRate,true); view.setUint32(28,sampleRate*2,true); view.setUint16(32,2,true); view.setUint16(34,16,true); str(36,'data'); view.setUint32(40,total*2,true);
  for(let i=0;i<total;i++){ let s=Math.max(-1,Math.min(1,data[i])); view.setInt16(44+i*2, s<0? s*0x8000 : s*0x7FFF, true); }
  return new Blob([view],{type:'audio/wav'});
}
const STICKERS={

};
function getThumb(url,w){ if(!url) return ''; if(url.includes('/upload/')) return url.replace('/upload/','/upload/w_'+w+',q_auto,f_auto/'); return url; }

async function onFilePicked(e){
  const f=e.target.files[0]; if(!f||!window.currentConvId) return;
  try{ const url=await uploadImageToCloudinary(f); const otherId=window.currentConvId.split('_').find(id=>id!==currentUserId); database.ref(`conversations/${window.currentConvId}/messages`).push({senderId:currentUserId,senderNom:document.getElementById('user-name').innerText,type:'image',url:url,createdAt:Date.now()}); pushJS(otherId,'📷 Photo - '+document.getElementById('user-name').innerText,'Vous avez reçu une photo'); }catch(err){ alert('Photo échouée : '+err.message); } e.target.value='';
}
async function onAudioPicked(e){
  const f=e.target.files[0]; e.target.value='';
  if(!f||!window.currentConvId) return;
  dbg('Fichier audio reçu: '+f.name+' size='+f.size);
  if(f.size<1000){ alert('Enregistrement trop court'); return; }
  let duree=0;
  try{ const tmpUrl=URL.createObjectURL(f); const tmp=new Audio(tmpUrl); duree=await new Promise(res=>{ tmp.onloadedmetadata=()=>{ res(Math.floor(tmp.duration)||0); }; tmp.onerror=()=>res(0); setTimeout(()=>res(0),1500); }); URL.revokeObjectURL(tmpUrl); }catch(err){}
  const recBox=document.getElementById('rec-box'); if(recBox) recBox.classList.add('show');
  const inputBox=document.getElementById('input-box'); if(inputBox) inputBox.style.display='none';
  const up=document.getElementById('rec-upload'); if(up){ up.textContent='☁️ Envoi sur Cloudinary...'; up.classList.add('show'); }
  try{
    const cloudUrl=await uploadAudioToCloudinary(f, f.name);
    dbg('Cloudinary OK');
    recElapsed = duree || 0;
    await pushAudioMessage(cloudUrl);
    dbg('Push OK - vocal envoyé');
  }catch(err){ dbg('ERREUR Cloudinary: '+err.message); alert('Envoi vocal échoué : '+err.message); }
  if(up) up.classList.remove('show');
  resetRecUI();
}
function fmtTime(s){ const m=Math.floor(s/60); const sec=s%60; return m+':'+String(sec).padStart(2,'0'); }
function waveHtml(n){ let h=''; for(let i=0;i<n;i++){ const ht=5+Math.floor(Math.random()*24); h+='<span style="height:'+ht+'px"></span>'; } return h; }
function updateRecWave(){ const w=document.getElementById('rec-wave'); if(!w) return; w.innerHTML=waveHtml(28); }

}

function stopWav(){ try{ if(wavProcessor) wavProcessor.disconnect(); }catch(e){} try{ if(wavSource) wavSource.disconnect(); }catch(e){} try{ if(wavCtx) wavCtx.close(); }catch(e){} if(wavStream) wavStream.getTracks().forEach(t=>t.stop()); wavCtx=null; wavProcessor=null; wavSource=null; wavStream=null; }
function cancelRecording(){

function initMicSwipe(){
  const mic=document.getElementById('btn-rec'); if(!mic) return;
  // === APP : 1 seul geste = appui OU swipe vers le haut, les 2 ouvrent l'enregistreur ===
  // On n'utilise que touchend pour éviter que click + touchend ouvrent 2 fois le sélecteur
  if(IS_APP){
    mic.addEventListener('touchstart',e=>{ micStartY=e.touches[0].clientY; micSwipeUp=false; const hint=document.getElementById('lock-hint'); if(hint){ hint.textContent='🎙️ Appuie pour enregistrer'; hint.classList.add('show'); } },{passive:true});
    mic.addEventListener('touchmove',e=>{
      const dy=micStartY - e.touches[0].clientY;
      if(dy>50){ micSwipeUp=true; mic.style.transform='translateY(-'+Math.min(dy,50)+'px)'; const hint=document.getElementById('lock-hint'); if(hint) hint.textContent='🎙️ Relâche pour enregistrer'; }
    },{passive:true});
    mic.addEventListener('touchend',e=>{
      e.preventDefault();
      const hint=document.getElementById('lock-hint'); if(hint) hint.classList.remove('show');
      mic.style.transform='translateY(0)';
      // Appui simple OU swipe vers le haut = même action : ouvrir l'enregistreur
      openNativeRecorder();
    },{passive:false});
    // Fallback souris / Chrome desktop dans WebViewer
    mic.addEventListener('click',e=>{ e.preventDefault(); openNativeRecorder(); });
    return;
  }
  // === WEB / Chrome : swipe vers le haut pour verrouiller, comme WhatsApp ===
  mic.addEventListener('touchstart',e=>{ micStartY=e.touches[0].clientY; micSwipeUp=false; const hint=document.getElementById('lock-hint'); if(hint){ hint.textContent='⬆️ Glisse vers le haut pour verrouiller'; hint.classList.add('show'); } },{passive:true});
  mic.addEventListener('touchmove',e=>{
    const dy=micStartY - e.touches[0].clientY;
    if(dy>60){ micSwipeUp=true; mic.style.transform='translateY(-'+Math.min(dy,60)+'px)'; if(!isRecording) startRecording(); }
    if(dy<-40 && isRecording && !micLocked){ cancelRecording(); }
  },{passive:true});
  mic.addEventListener('touchend',e=>{
    const hint=document.getElementById('lock-hint'); if(hint) hint.classList.remove('show');
    mic.style.transform='translateY(0)';
    if(micSwipeUp && isRecording){ micLocked=true; return; }
    if(!isRecording && !micSwipeUp){ startRecording(); }
  },{passive:true});
  mic.addEventListener('mousedown',e=>{ micStartY=e.clientY; });
  mic.addEventListener('mouseup',e=>{ const dy=micStartY-e.clientY; if(dy>40){ startRecording(); } });
}

    const scroll=document.getElementById('chat-scroll'); if(!scroll)return; let html='';
    snap.forEach(m=>{ const v=m.val(); const key=m.key; const isMe=v.senderId===currentUserId; const h=new Date(v.createdAt).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); const tick=isMe?(v.vu?' <span style="color:#53bdeb">✓✓</span>':' <span style="color:#8696a0">✓</span>'):''; const imgUrl = v.url || v.image || v.photo || ''; const safeNom=(v.senderNom||'').replace(/'/g,"").replace(/"/g,''); const safeTxt=(v.texte||'').replace(/'/g,"").replace(/"/g,'').substring(0,120); let quoteHtml=''; if(v.replyTo){ quoteHtml='<div class="quote"><b>'+v.replyTo.nom+'</b><span>'+v.replyTo.texte+'</span></div>'; }
      if(v.type==='text'){ let txt=v.texte||''; let extra=''; const murl=txt.match(/https:\/\/res\.cloudinary\.com\/[^\s]+\.(jpg|png|jpeg)/); if(murl){ extra='<img src="'+getThumb(murl[0],600)+'" onclick="openImage(\''+getThumb(murl[0],1000)+'\')" style="margin-top:6px;max-width:220px;border-radius:8px;display:block;cursor:pointer">'; } html+='<div class="msg-row '+(isMe?'right':'left')+'"><span class="swipe-icon">↩️</span><div class="msg-bubble '+(isMe?'msg-right':'msg-left')+'" data-nom="'+safeNom+'" data-texte="'+safeTxt+'">'+quoteHtml+txt+extra+'<span class="msg-time">'+h+tick+'</span></div></div>'; }
      else if(v.type==='sticker'){ html+='<div class="msg-row '+(isMe?'right':'left')+'"><span class="swipe-icon">↩️</span><div class="msg-bubble sticker-bubble" data-nom="'+safeNom+'" data-texte="'+(v.texte||'🧩')+'">'+(v.texte||'🧩')+'<span class="msg-time">'+h+tick+'</span></div></div>'; }
      else if(v.type==='call'){ html+='<div class="msg-row '+(isMe?'right':'left')+'"><span class="swipe-icon">↩️</span><div class="call-bubble '+(isMe?'':'received')+'"><div class="call-icon">📞</div><div style="flex:1"><b>Appel vocal</b><span>'+(v.statut||'Sans réponse')+'</span></div><span style="font-size:11px;color:#cfd8dc">'+h+tick+'</span></div></div>'; }
      else if(v.type==='image'){ const thumb=getThumb(imgUrl,600); const big=getThumb(imgUrl,1000)||imgUrl; html+='<div class="msg-row '+(isMe?'right':'left')+'"><span class="swipe-icon">↩️</span><div class="msg-bubble '+(isMe?'msg-right':'msg-left')+'" style="padding:3px" data-nom="'+safeNom+'" data-texte="📷 Photo">'+quoteHtml+'<img src="'+thumb+'" loading="lazy" onerror="this.src=\''+imgUrl+'\'" onclick="openImage(\''+big+'\')" style="max-width:220px;border-radius:8px;display:block;cursor:pointer"><span class="msg-time">'+h+tick+'</span></div></div>'; }
      else if(v.type==='audio'){ const init=v.senderNom? v.senderNom.substring(0,2).toUpperCase() : 'MA'; const duree=v.duree?fmtTime(v.duree):'0:10'; html+='<div class="msg-row '+(isMe?'right':'left')+'"><span class="swipe-icon">↩️</span><div class="audio-bubble '+(isMe?'sent':'received')+'"><div class="audio-avatar">'+init+'</div><button class="audio-play" id="play-'+key+'" onclick="togglePlayAudio(\''+key+'\')">▶️</button><div style="flex:1"><div class="audio-wave">'+waveHtml(28)+'</div><div class="audio-meta"><span>'+duree+'</span><span>'+h+tick+'</span></div></div><audio id="aud-'+key+'" src="'+imgUrl+'" preload="auto" style="display:none"></audio></div></div>'; }
      if(v.senderId!==currentUserId&&!v.vu) m.ref.update({vu:true}); });
    const wasBottom = scroll.scrollTop + scroll.clientHeight >= scroll.scrollHeight - 80; scroll.innerHTML=html; if(wasBottom || scroll.scrollTop===0) scroll.scrollTop=scroll.scrollHeight;
  });
}
function lancerAppel(cid){ const otherId=cid.split('_').find(id=>id!==currentUserId); database.ref(`conversations/${cid}/messages`).push({senderId:currentUserId,senderNom:document.getElementById('user-name').innerText,type:'call',statut:'Sans réponse',createdAt:Date.now()}); pushJS(otherId,'📞 Appel vocal - '+document.getElementById('user-name').innerText,'Appel vocal manqué'); }
function onInputChange(inp,cid){ jeTape(cid); const hasText=inp.value.trim().length>0; const mic=document.getElementById('btn-rec'); const send=document.getElementById('btn-send'); if(isRecording) return; if(mic) mic.style.display=hasText?'none':'flex'; if(send) send.style.display=hasText?'flex':'none'; }
function envoyerDirect(cid){ const i=document.getElementById('msg-input');const t=i.value.trim();if(!t)return; const otherId = cid.split('_').find(id=>id!==currentUserId); database.ref(`conversations/${cid}/messages`).push({senderId:currentUserId,senderNom:document.getElementById('user-name').innerText,type:'text',vu:false,texte:t,replyTo:replyTo||null,createdAt:Date.now()}); pushJS(otherId, '💬 '+document.getElementById('user-name').innerText, t.substring(0,90)); i.value=''; clearReply(); onInputChange(i,cid); }
function jeTape(cid){database.ref(`conversations/${cid}/typing/${currentUserId}`).set(true);clearTimeout(window.typTO);window.typTO=setTimeout(()=>{database.ref(`conversations/${cid}/typing/${currentUserId}`).set(false);},1500);}
function init(){let s=JSON.parse(localStorage.getItem('mayne_current_user')||'null');if(!s){location.href='index.html';return;}currentUserId=s.phone.replace(/[^0-9]/g,'');database.ref('clients/'+currentUserId).once('value').then(v=>{const nom=v.val()?.nom||currentUserId;document.getElementById('user-name').innerText=nom;document.getElementById('my-avatar').innerText=nom.substring(0,1).toUpperCase();});chargerMessagerie();}
firebase.auth().onAuthStateChanged(function(user){ if(user){ init(); } else { firebase.auth().signInAnonymously(); } });
</script>
