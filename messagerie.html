.profile-row{display:flex;justify-content:space-between;padding:13px 14px;border-bottom:1px solid var(--border);font-size:14px}

.viewer-head{display:flex;align-items:center;gap:10px;padding:10px}

.viewer-caption{padding:0 14px 8px;font-size:14px;color:#ddd}
.viewer-nav{position:absolute;inset:0;display:flex}
.viewer-nav div{flex:1}
.viewer-bottom{display:flex;gap:10px;padding:10px 12px calc(12px + env(safe-area-inset-bottom));align-items:center}
.viewer-input{flex:1;background:rgba(255,255,255,.15);border:none;border-radius:999px;padding:11px 14px;color:#fff;outline:none;font-size:14px}

.viewer-send{width:44px;height:44px;border-radius:50%;background:var(--orange-dark);color:#fff;border:none;font-size:18px;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:99998}
.modal.show{display:flex}
.sheet{width:100%;max-width:480px;background:var(--bg2);border-radius:20px 20px 0 0;padding:14px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 12px;font-size:18px}

.colors{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.color{width:36px;height:36px;border-radius:50%;cursor:pointer;border:3px solid transparent}
.color.active{border-color:var(--orange)}
.sheet input[type=text], .sheet input[type=tel]{width:100%;padding:12px;border:1px solid var(--border);border-radius:999px;background:var(--bg);color:var(--text);outline:none;font-size:14px;margin-top:8px}

.btn-orange{background:var(--orange-dark);color:#fff}
.btn-grey{background:var(--bg3);color:var(--text)}
.btn-green{background:#25D366;color:#fff}
.btn-row{display:flex;gap:10px}

.preview-text{width:100%;height:180px;border-radius:14px;display:flex;align-items:center;justify-content:center;text-align:center;padding:18px;font-size:22px;font-weight:900;color:#fff;white-space:pre-wrap;word-break:break-word;margin-top:12px}
.invite-link-box{background:var(--bg);border:1px dashed var(--border);border-radius:12px;padding:10px 12px;font-size:13px;word-break:break-all;color:var(--text2);margin-top:10px}

<script>
let currentUserId=null,isRecording=false,replyTo=null,recStartTime=0,recElapsed=0,recTimer=null,previewAudio=null,previewPlaying=false,waitingAudio=false;
let pendingAudioUrl=null, pendingAudioDuree=0, pendingBlob=null;
window.currentConvId=null; window.currentOtherId=null; window.currentOtherName=''; window._profileId=null; window._profilePhoto='';
window.myPhoto=''; window.viewedPhoto=''; window.currentOtherPhoto='';
let swipeStartX=0,swipeStartY=0,swipeEl=null,swipeData=null,swipeActive=false;
let micStartX=0,micStartY=0,micLocked=false,micCancelled=false,micStarted=false;
let mediaRecorder=null, mediaStream=null, mediaChunks=[];
let currentTab='discussions';
let allGroups=[], curGroupIndex=0, curItemIndex=0, viewerProgress=null;
let pendingPhotoBlob=null, pendingPhotoUrl=null, selectedColor='#D63E00';
let selectedMsgs=new Set(), selectionMode=false, longPressTimer=null, lastTouchTime=0;
const COLORS=['#D63E00','#FF5000','#111111','#1E88E5','#00897B','#6A1B9A','#E91E63','#F9A825'];
function applyTheme(t){ document.body.setAttribute('data-theme',t); localStorage.setItem('mayne_theme',t); const b=document.getElementById('theme-btn'); if(b) b.textContent=t==='dark'?'☀️':'🌙'; }
function toggleTheme(){ applyTheme((document.body.getAttribute('data-theme')||'light')==='light'?'dark':'light'); }
(function(){ const s=localStorage.getItem('mayne_theme'); if(s) applyTheme(s); else if(window.matchMedia('(prefers-color-scheme: dark)').matches) applyTheme('dark'); else applyTheme('light'); })();
function isSameDay(a,b){ const x=new Date(a), y=new Date(b); return x.getFullYear()===y.getFullYear() && x.getMonth()===y.getMonth() && x.getDate()===y.getDate(); }
function dateLabel(ts){
  const now=new Date(), d=new Date(ts);
  const yesterday=new Date(now); yesterday.setDate(now.getDate()-1);
  if(isSameDay(ts, now)) return "Aujourd'hui";
  if(isSameDay(ts, yesterday)) return "Hier";
  const s=new Intl.DateTimeFormat('fr-FR',{weekday:'long', day:'2-digit', month:'long', year:'numeric'}).format(d);
  return s.charAt(0).toUpperCase()+s.slice(1);
}
function dayKey(ts){ const d=new Date(ts); return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate(); }
function updateSelectBar(){
  const bar=document.getElementById('select-bar'); if(!bar) return;
  if(!selectionMode || selectedMsgs.size===0){ bar.classList.remove('show'); return; }
  bar.classList.add('show');
  document.getElementById('select-count').textContent=selectedMsgs.size+' sélectionné(s)';
}
function toggleSelect(key){
  if(selectedMsgs.has(key)) selectedMsgs.delete(key); else selectedMsgs.add(key);
  document.querySelectorAll('.msg-row[data-key="'+key+'"]').forEach(r=>r.classList.toggle('selected', selectedMsgs.has(key)));
  if(selectedMsgs.size===0){ exitSelection(); } else updateSelectBar();
}
function enterSelection(key){
  selectionMode=true; selectedMsgs=new Set([key]);
  document.querySelectorAll('.msg-row[data-key="'+key+'"]').forEach(r=>r.classList.add('selected'));
  updateSelectBar();
  if(navigator.vibrate) navigator.vibrate(30);
}
function exitSelection(){
  selectionMode=false; selectedMsgs.clear();
  document.querySelectorAll('.msg-row.selected').forEach(r=>r.classList.remove('selected'));
  updateSelectBar();
}
async function deleteSelected(){
  if(!selectedMsgs.size || !window.currentConvId) return;
  const n=selectedMsgs.size;
  if(!confirm('Supprimer '+n+' message(s) pour toi seul ?\nL\'autre personne les gardera.')) return;
  const updates={};
  selectedMsgs.forEach(k=>{ updates['conversations/'+window.currentConvId+'/messages/'+k+'/deletedFor/'+currentUserId]=true; });
  await database.ref().update(updates);
  exitSelection();
}
async function deleteConversation(){
  if(!window.currentConvId) return;
  const name=window.currentOtherName||'cette conversation';
  if(!confirm('Supprimer toute la conversation avec '+name+' ?\nPour toi seul, l\'autre la gardera.')) return;
  const snap=await database.ref('conversations/'+window.currentConvId+'/messages').once('value');
  const updates={};
  snap.forEach(m=>{ updates['conversations/'+window.currentConvId+'/messages/'+m.key+'/deletedFor/'+currentUserId]=true; });
  updates['conversations/'+window.currentConvId+'/deletedFor/'+currentUserId]=true;
  await database.ref().update(updates);
  retourListe();
}
function openChatMenu(){ document.getElementById('chat-menu').classList.add('show'); }
function closeChatMenu(){ document.getElementById('chat-menu').classList.remove('show'); }
function getInviteLink(){ return APP_URL+'?invite='+encodeURIComponent(currentUserId||''); }
function getInviteText(){ const nom=document.getElementById('user-name').innerText||'Un ami'; return 'Salut 👋 '+nom+' t\'invite sur MAYNE ! Discute, poste des statuts 24h, envoie des vocaux et des photos. Rejoins-moi ici : '+getInviteLink(); }
function openInviteModal(){ if(!currentUserId) return alert('Connecte-toi d\'abord'); document.getElementById('invite-link').textContent=getInviteLink(); document.getElementById('invite-modal').classList.add('show'); try{ database.ref('invitations/'+currentUserId).update({lastInvite:Date.now(), link:getInviteLink()}); }catch(e){} }
function closeInviteModal(){ document.getElementById('invite-modal').classList.remove('show'); }
function copyInviteLink(){ const link=getInviteLink(); if(navigator.clipboard) navigator.clipboard.writeText(link).then(()=>alert('Lien copié ✅\n'+link)).catch(()=>{ prompt('Copie ce lien :',link); }); else prompt('Copie ce lien :',link); }
function inviteWhatsApp(){ window.open('https://wa.me/?text='+encodeURIComponent(getInviteText()),'_blank'); }
function inviteSMS(){ window.location.href='sms:?body='+encodeURIComponent(getInviteText()); }
async function shareInvite(){ const text=getInviteText(); if(navigator.share){ try{ await navigator.share({title:'MAYNE - Rejoins-moi', text:text, url:getInviteLink()}); }catch(e){ copyInviteLink(); } } else copyInviteLink(); }
function inviteByPhone(){ const raw=document.getElementById('invite-phone').value.trim().replace(/[^0-9+]/g,''); if(raw.length<8) return alert('Entre un numéro valide'); let num=raw; if(num.startsWith('0')) num='229'+num.substring(1); if(!num.startsWith('229') && num.length===8) num='229'+num; num=num.replace('+',''); const msg=getInviteText(); database.ref('invitations/'+currentUserId+'/byPhone/'+num).set({phone:num, at:Date.now()}); window.open('https://wa.me/'+num+'?text='+encodeURIComponent(msg),'_blank'); }
function switchTab(tab){
  if(window.currentConvId){ const target=tab; retourListe(); setTimeout(()=>switchTab(target), 80); return; }
  currentTab=tab;
  document.getElementById('tab-discussions').classList.toggle('active', tab==='discussions');
  document.getElementById('tab-actus').classList.toggle('active', tab==='actus');
  document.getElementById('nav-msg').classList.toggle('active', tab==='discussions');
  document.getElementById('nav-actus').classList.toggle('active', tab==='actus');
  const search=document.getElementById('search-zone'); const feed=document.getElementById('messagerie-feed'); const actus=document.getElementById('actus-feed'); const fabs=document.getElementById('actus-fabs'); const tabs=document.getElementById('main-tabs');
  if(tab==='discussions'){ search.style.display='block'; feed.style.display='flex'; actus.classList.remove('show'); fabs.classList.remove('show'); tabs.style.display='flex'; if(!window.currentConvId) chargerMessagerie(); }
  else { search.style.display='none'; feed.style.display='none'; actus.classList.add('show'); fabs.classList.add('show'); loadStatus(); }
}
function getThumb(u,w){ if(!u) return ''; if(u.includes('/upload/')) return u.replace('/upload/','/upload/w_'+w+',q_auto,f_auto/'); return u; }
function getUserPhoto(c){ return c?.photo || c?.photoUrl || c?.avatar || c?.image || ''; }
function avatarHtml(nom, photo){ const init=(nom||'?').substring(0,2).toUpperCase(); if(photo) return '<img src="'+getThumb(photo,200)+'">'; return init; }
function openImage(url, isProfilePhoto){
  if(!url) return;
  const v=document.getElementById('img-viewer');
  document.getElementById('img-viewer-pic').src=url;
  const changeBtn=document.getElementById('img-viewer-change-btn');
  if(changeBtn) changeBtn.style.display=(isProfilePhoto && window._profileId===currentUserId)?'block':'none';
  v.style.display='flex';

function closeImageViewer(){ document.getElementById('img-viewer').style.display='none'; }
function fmtTime(s){ const m=Math.floor(s/60); const sec=s%60; return m+':'+String(sec).padStart(2,'0'); }
function waveHtml(n){ let h=''; for(let i=0;i<n;i++){ const ht=5+Math.floor(Math.random()*24); h+='<span style="height:'+ht+'px"></span>'; } return h; }
function updateRecWave(){ const w=document.getElementById('rec-wave'); if(!w) return; w.innerHTML=waveHtml(28); }
function timeAgo(ts){ const d=Math.floor((Date.now()-ts)/1000); if(d<60) return "à l'instant"; if(d<3600) return 'il y a '+Math.floor(d/60)+' min'; if(d<86400) return 'il y a '+Math.floor(d/3600)+' h'; return new Date(ts).toLocaleDateString('fr-FR',{day:'numeric',month:'short'}); }
function openMyProfile(){ if(!currentUserId) return; openProfile(currentUserId, document.getElementById('user-name').innerText); }
function openProfile(userId, fallbackName){
  if(!userId) return; window._profileId=userId;
  database.ref('clients/'+userId).once('value').then(snap=>{
    const c=snap.val()||{}; const nom=c.nom||fallbackName||userId; const num=c.phone||c.telephone||c.numero||userId; const photo=getUserPhoto(c); const online=c.status&&c.status.online;
    window.viewedPhoto=photo||'';
    if(userId===currentUserId) window.myPhoto=photo||'';
    const isMe=userId===currentUserId;

async function onStatusPicked(e){ const f=e.target.files[0]; e.target.value=''; if(!f) return; pendingPhotoBlob=f; const url=URL.createObjectURL(f); const img=document.getElementById('photo-preview'); img.src=url; img.style.display='block'; document.getElementById('photo-modal').classList.add('show'); }
function closePhotoModal(){ document.getElementById('photo-modal').classList.remove('show'); pendingPhotoBlob=null; pendingPhotoUrl=null; }
async function publishPhotoStatus(){ const cap=document.getElementById('photo-caption').value.trim(); try{ let url=pendingPhotoUrl; if(pendingPhotoBlob && !url) url=await uploadImageToCloudinary(pendingPhotoBlob); if(!url) return alert('Choisis une photo'); await database.ref('statuts/'+currentUserId).push({senderId:currentUserId,senderNom:document.getElementById('user-name').innerText,senderPhoto:window.myPhoto||'',type:'image',url:url,caption:cap,createdAt:Date.now()}); closePhotoModal(); document.getElementById('photo-caption').value=''; }catch(err){ alert('Publication échouée : '+err.message); } }
setInterval(async ()=>{
  if(!window.AppInventor) return; let d=null; try{ d=window.AppInventor.getWebViewString(); }catch(e){ return; } if(!d) return; if(d===lastSentToApp) return;
  if(!(d.startsWith('AUDIO_URL_')||d.startsWith('CHAT_')||d.startsWith('PROFILE_URL_')||d.startsWith('STATUS_URL_'))) return;
  const otherId = window.currentConvId? window.currentConvId.split('_').find(id=>id!==currentUserId) : null;
  if(d.startsWith('CHAT_')){ let u=d.replace('CHAT_',''); window.AppInventor.setWebViewString(''); lastSentToApp=''; database.ref(`conversations/${window.currentConvId}/messages`).push({senderId:currentUserId,senderNom:document.getElementById('user-name').innerText,type:'image',url:u,createdAt:Date.now()}); pushJS(otherId,'📷 Photo - '+document.getElementById('user-name').innerText,'Vous avez reçu une photo'); }
  else if(d.startsWith('PROFILE_URL_')){ let u=d.replace('PROFILE_URL_',''); window.AppInventor.setWebViewString(''); lastSentToApp=''; await saveProfilePhoto(u); }
  else if(d.startsWith('STATUS_URL_')){ let u=d.replace('STATUS_URL_',''); window.AppInventor.setWebViewString(''); lastSentToApp=''; pendingPhotoUrl=u; const img=document.getElementById('photo-preview'); img.src=u; img.style.display='block'; document.getElementById('photo-modal').classList.add('show'); }
  else if(d.startsWith('AUDIO_URL_')){ let u=d.replace('AUDIO_URL_',''); window.AppInventor.setWebViewString(''); lastSentToApp=''; waitingAudio=false; pendingAudioUrl=u; pendingAudioDuree=recElapsed; showAudioPreview(); }
},400);
function rechercherUtilisateur(){
  const q=document.getElementById('recherche-user-input').value.trim().toLowerCase();
  const zone=document.getElementById('resultats-recherche');
  if(!q){zone.style.display='none';return;}
  database.ref('clients').once('value').then(s=>{
    let h='',c=0;
    s.forEach(ch=>{const cid=ch.key;const nom=ch.val().nom||'';const photo=getUserPhoto(ch.val()||{});if(cid===currentUserId)return;if(nom.toLowerCase().includes(q)||cid.includes(q)){c++;h+='<div class="search-item" onclick="selectionnerUserPourChat(\''+cid+'\',\''+nom.replace(/'/g,"\\'")+'\')"><div class="msg-avatar" style="width:36px;height:36px;font-size:13px">'+avatarHtml(nom,photo)+'</div><div>'+nom+'<br><small style="color:#8696a0">'+formatPhone(cid)+'</small></div></div>';}});
    if(c===0){ h='<div style="padding:12px"><b>Aucun utilisateur “'+q+'”</b><br><span style="color:#8696a0;font-size:13px">Il n\'est pas encore sur MAYNE.</span><br><button onclick="openInviteModal()" style="margin-top:10px;background:#D63E00;color:#fff;border:none;border-radius:999px;padding:10px 14px;font-weight:900;cursor:pointer;width:100%">➕ L\'inviter sur MAYNE</button></div>'; }
    zone.innerHTML=h; zone.style.display='block';
  });
}
function selectionnerUserPourChat(cid,nom){document.getElementById('recherche-user-input').value='';document.getElementById('resultats-recherche').style.display='none';ouvrirConversation([currentUserId,cid].sort().join('_'),nom);}
function chargerMessagerie(){ if(window.currentConvId) return; database.ref('conversations').once('value').then(snapConv=>{ database.ref('clients').once('value').then(snapClients=>{ if(window.currentConvId) return; const clients=snapClients.val()||{}; const feed=document.getElementById('messagerie-feed'); let convs=[]; snapConv.forEach(ch=>{ const convId=ch.key; if(!convId.includes(currentUserId)) return; if(ch.child('deletedFor/'+currentUserId).val()) return; const msgs=ch.child('messages').val()||{}; const visibles=Object.values(msgs).filter(m=>!(m.deletedFor && m.deletedFor[currentUserId])); if(!visibles.length) return; const arr=visibles.sort((a,b)=>b.createdAt-a.createdAt); const unread=visibles.filter(m=>m.senderId!==currentUserId && !m.vu).length; convs.push({id:convId,last:arr[0],unread}); }); convs.sort((a,b)=>b.last.createdAt-a.last.createdAt); let html=''; if(convs.length===0) html+='<div class="invite-card" onclick="openInviteModal()"><div class="invite-ico">➕</div><div><b>Inviter des amis</b><span>Aucune discussion — invite tes amis, ils apparaissent ici</span></div><div style="font-size:20px">›</div></div>'; convs.forEach(c=>{ const otherId=c.id.split('_').find(id=>id!==currentUserId); const amiNom = clients[otherId]?.nom || c.last.senderNom || otherId; const amiPhoto=getUserPhoto(clients[otherId]||{}); const prev=c.last.type==='image'?'📷 Photo':c.last.type==='audio'?'🎙️ Vocal':c.last.type==='sticker'?'🧩 Sticker':c.last.type==='call'?'📞 Appel vocal':(c.last.texte||'').substring(0,40); const h=new Date(c.last.createdAt).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); const dateTxt=dateLabel(c.last.createdAt)==='Aujourd\'hui'?h:dateLabel(c.last.createdAt); html+='<div class="chat-card"><div class="msg-avatar" onclick="event.stopPropagation();openProfile(\''+otherId+'\',\''+amiNom.replace(/'/g,"\\'")+'\')">'+avatarHtml(amiNom,amiPhoto)+'</div><div class="chat-main" onclick="ouvrirConversation(\''+c.id+'\',\''+amiNom.replace(/'/g,"\\'")+'\')"><div class="chat-name">'+amiNom+'</div><div class="chat-preview">'+(c.last.senderId===currentUserId?'<b style="color:#FF5000">Vous : </b>':'')+prev+'</div></div><div class="chat-meta" onclick="ouvrirConversation(\''+c.id+'\',\''+amiNom.replace(/'/g,"\\'")+'\')"><div class="chat-time '+(c.unread?'unread':'')+'">'+dateTxt+'</div>'+(c.unread?'<div class="unread-badge">'+c.unread+'</div>':'')+'</div></div>'; }); feed.classList.remove('chat-mode'); feed.innerHTML=html; database.ref('conversations').on('value',()=>{ if(!window.currentConvId && currentTab==='discussions') chargerMessagerie(); }); }); }); }
function retourListe(){ if(window.currentConvId){ database.ref(`conversations/${window.currentConvId}/messages`).off(); database.ref(`conversations/${window.currentConvId}/typing`).off(); database.ref(`conversations/${window.currentConvId}/recording`).off(); } database.ref('conversations').off(); window.currentConvId=null; window.currentOtherId=null; replyTo=null; exitSelection(); if(isRecording) cancelRecording(); if(pendingAudioUrl) discardPendingAudio(); document.getElementById('search-zone').style.display='block'; document.getElementById('main-tabs').style.display='flex'; const f=document.getElementById('messagerie-feed'); f.classList.remove('chat-mode'); f.innerHTML=''; chargerMessagerie(); }
function ouvrirConversation(convId,nom){
  database.ref('conversations').off(); window.currentConvId=convId; replyTo=null; exitSelection();
  const feed=document.getElementById('messagerie-feed'); document.getElementById('search-zone').style.display='none'; document.getElementById('main-tabs').style.display='none'; feed.classList.add('chat-mode');
  const otherId=convId.split('_').find(id=>id!==currentUserId); window.currentOtherId=otherId; window.currentOtherName=nom;
  feed.innerHTML='<div class="chat-wrapper"><div class="chat-top"><span onclick="retourListe()" style="font-size:24px;cursor:pointer">←</span><div class="chat-top-avatar" id="chat-top-avatar" onclick="if(window.currentOtherPhoto) openImage(window.currentOtherPhoto); else openProfile(window.currentOtherId, window.currentOtherName)">'+nom.substring(0,2).toUpperCase()+'</div><div class="chat-top-info" onclick="openProfile(\''+otherId+'\',\''+nom.replace(/'/g,"\\'")+'\')"><b>'+nom+'</b><div id="typing-indicator" style="font-size:11px;display:none;color:#FF5000">en train d\'écrire...</div><div id="online-text" style="font-size:11px;opacity:.7">hors ligne</div><div id="rec-indicator" style="font-size:11px;display:none;color:#FF3B30">● enregistrement...</div></div><span style="font-size:20px" onclick="lancerAppel(\''+convId+'\')">📞</span><span style="font-size:20px" onclick="openChatMenu()">⋮</span></div><div class="select-bar" id="select-bar"><span id="select-count">0 sélectionné(s)</span><div style="flex:1"></div><button class="cancel" onclick="exitSelection()">Annuler</button><button class="del" onclick="deleteSelected()">🗑️ Supprimer</button></div><div class="chat-container" id="chat-scroll"></div><div class="chat-input-bar"><div class="lock-hint" id="lock-hint">Glisse vers le haut pour verrouiller</div><div class="input-box" id="input-box"><div class="reply-preview" id="reply-preview"></div><input id="msg-input" placeholder="Message" oninput="onInputChange(this,\''+convId+'\')" onkeypress="if(event.key===\'Enter\')envoyerDirect(\''+convId+'\')"><div class="input-bottom"><div class="spacer"></div><button class="mini-icon" onclick="toggleStickers()">😊</button><button class="mini-icon" onclick="pickImageChat()">📎</button><button class="mini-icon" onclick="pickImageChat()">📷</button></div></div><div class="rec-box" id="rec-box"><div id="rec-main" class="rec-main"><span class="rec-time"><span class="rec-dot"></span><span id="rec-time">0:00</span></span><div class="rec-wave" id="rec-wave"></div></div><div class="rec-preview" id="rec-preview"><button class="rec-preview-play" id="preview-play" onclick="togglePreview()">▶️</button><div class="rec-preview-wave" id="preview-wave"></div><span class="rec-preview-time" id="preview-time">0:00 / 0:00</span></div><div class="rec-upload" id="rec-upload">Préparation...</div><button class="rec-trash" onclick="discardPendingAudio()">🗑️</button><button class="rec-send" id="rec-send-btn" onclick="stopAndSendRecording()">➤</button></div><button class="mic-btn" id="btn-rec">🎙️</button><button class="send-btn" id="btn-send" onclick="envoyerDirect(\''+convId+'\')">➤</button></div><div class="sticker-panel" id="sticker-panel"><div class="sticker-tabs" id="sticker-tabs"></div><div class="sticker-grid" id="sticker-grid"></div></div></div>';
  const tabs=document.getElementById('sticker-tabs'); if(tabs) tabs.innerHTML=Object.keys(STICKERS).map(k=>'<button class="sticker-tab" data-cat="'+k+'" onclick="renderStickers(\''+k+'\')">'+k+'</button>').join('');
  initMicSwipe(); initSwipe();
  database.ref('clients/'+otherId).once('value').then(s=>{ const photo=getUserPhoto(s.val()||{}); window.currentOtherPhoto=photo?getThumb(photo,1000):''; const av=document.getElementById('chat-top-avatar'); if(av && photo) av.innerHTML='<img src="'+getThumb(photo,200)+'">'; });
  database.ref('clients/'+otherId+'/status').on('value',s=>{ const el=document.getElementById('online-text'); if(!el) return; const on=s.val()&&s.val().online; el.innerText=on?'en ligne':'hors ligne'; });
  database.ref(`conversations/${convId}/typing`).on('value',s=>{let e=false;s.forEach(ch=>{if(ch.key!==currentUserId&&ch.val())e=true;});const el=document.getElementById('typing-indicator'); if(el) el.style.display=e?'block':'none'; });
  database.ref(`conversations/${convId}/recording`).on('value',s=>{let e=false;s.forEach(ch=>{if(ch.key!==currentUserId&&ch.val())e=true;});const el=document.getElementById('rec-indicator'); if(el) el.style.display=e?'flex':'none'; });
  database.ref(`conversations/${convId}/messages`).orderByChild('createdAt').on('value',snap=>{
    const scroll=document.getElementById('chat-scroll'); if(!scroll)return; let html=''; let lastDay='';
    snap.forEach(m=>{
      const v=m.val(); const key=m.key;
      if(v.deletedFor && v.deletedFor[currentUserId]) return;
      if(dayKey(v.createdAt)!==lastDay){ lastDay=dayKey(v.createdAt); html+='<div class="date-sep"><span>'+dateLabel(v.createdAt)+'</span></div>'; }
      const isMe=v.senderId===currentUserId; const h=new Date(v.createdAt).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); const tick=isMe?(v.vu?' <span style="color:#53bdeb">✓✓</span>':' <span style="color:#8696a0">✓</span>'):''; const imgUrl = v.url || v.image || v.photo || ''; const safeNom=(v.senderNom||'').replace(/'/g,"").replace(/"/g,''); const safeTxt=(v.texte||'').replace(/'/g,"").replace(/"/g,'').substring(0,120); let quoteHtml=''; if(v.replyTo){ quoteHtml='<div class="quote"><b>'+v.replyTo.nom+'</b><span>'+v.replyTo.texte+'</span></div>'; }
      const selClass = selectedMsgs.has(key) ? ' selected' : '';
      if(v.type==='text'){ let txt=v.texte||''; let extra=''; const murl=txt.match(/https:\/\/res\.cloudinary\.com\/[^\s]+\.(jpg|png|jpeg)/); if(murl){ extra='<img src="'+getThumb(murl[0],600)+'" onclick="if(!selectionMode) openImage(\''+getThumb(murl[0],1000)+'\')" style="margin-top:6px;max-width:220px;border-radius:8px;display:block;cursor:pointer">'; } html+='<div class="msg-row '+(isMe?'right':'left')+selClass+'" data-key="'+key+'"><span class="check">✓</span><span class="swipe-icon">↩️</span><div class="msg-bubble '+(isMe?'msg-right':'msg-left')+'" data-nom="'+safeNom+'" data-texte="'+safeTxt+'">'+quoteHtml+txt+extra+'<span class="msg-time">'+h+tick+'</span></div></div>'; }
      else if(v.type==='sticker'){ html+='<div class="msg-row '+(isMe?'right':'left')+selClass+'" data-key="'+key+'"><span class="check">✓</span><span class="swipe-icon">↩️</span><div class="msg-bubble sticker-bubble" data-nom="'+safeNom+'" data-texte="'+(v.texte||'🧩')+'">'+(v.texte||'🧩')+'<span class="msg-time">'+h+tick+'</span></div></div>'; }
      else if(v.type==='call'){ html+='<div class="msg-row '+(isMe?'right':'left')+selClass+'" data-key="'+key+'"><span class="check">✓</span><span class="swipe-icon">↩️</span><div class="call-bubble '+(isMe?'':'received')+'" data-nom="'+safeNom+'" data-texte="📞 Appel"><div class="call-icon">📞</div><div style="flex:1"><b>Appel vocal</b><span>'+(v.statut||'Sans réponse')+'</span></div><span style="font-size:11px;color:#cfd8dc">'+h+tick+'</span></div></div>'; }
      else if(v.type==='image'){ const thumb=getThumb(imgUrl,600); const big=getThumb(imgUrl,1000)||imgUrl; html+='<div class="msg-row '+(isMe?'right':'left')+selClass+'" data-key="'+key+'"><span class="check">✓</span><span class="swipe-icon">↩️</span><div class="msg-bubble '+(isMe?'msg-right':'msg-left')+'" style="padding:3px" data-nom="'+safeNom+'" data-texte="📷 Photo">'+quoteHtml+'<img src="'+thumb+'" loading="lazy" onerror="this.src=\''+imgUrl+'\'" onclick="if(!selectionMode) openImage(\''+big+'\')" style="max-width:220px;border-radius:8px;display:block;cursor:pointer"><span class="msg-time">'+h+tick+'</span></div></div>'; }
      else if(v.type==='audio'){ const init=v.senderNom? v.senderNom.substring(0,2).toUpperCase() : 'MA'; const duree=v.duree?fmtTime(v.duree):'0:10'; const senderIdForProfile=isMe?currentUserId:otherId; html+='<div class="msg-row '+(isMe?'right':'left')+selClass+'" data-key="'+key+'"><span class="check">✓</span><span class="swipe-icon">↩️</span><div class="audio-bubble '+(isMe?'sent':'received')+'" data-nom="'+safeNom+'" data-texte="🎙️ Vocal"><div class="audio-avatar" onclick="if(!selectionMode) openProfile(\''+senderIdForProfile+'\',\''+safeNom+'\')">'+init+'</div><button class="audio-play" id="play-'+key+'" onclick="togglePlayAudio(\''+key+'\')">▶️</button><div style="flex:1"><div class="audio-wave">'+waveHtml(28)+'</div><div class="audio-meta"><span>'+duree+'</span><span>'+h+tick+'</span></div></div><audio id="aud-'+key+'" src="'+imgUrl+'" preload="auto" style="display:none"></audio></div></div>'; }
      if(v.senderId!==currentUserId&&!v.vu && !(v.deletedFor && v.deletedFor[currentUserId])) m.ref.update({vu:true});
    });
    const wasBottom = scroll.scrollTop + scroll.clientHeight >= scroll.scrollHeight - 80; scroll.innerHTML=html; if(wasBottom || scroll.scrollTop===0) scroll.scrollTop=scroll.scrollHeight;
    updateSelectBar();
  });
}
function lancerAppel(cid){ const otherId=cid.split('_').find(id=>id!==currentUserId); database.ref(`conversations/${cid}/messages`).push({senderId:currentUserId,senderNom:document.getElementById('user-name').innerText,type:'call',statut:'Sans réponse',createdAt:Date.now()}); pushJS(otherId,'📞 Appel vocal - '+document.getElementById('user-name').innerText,'Appel vocal manqué'); }
function onInputChange(inp,cid){ jeTape(cid); const hasText=inp.value.trim().length>0; const mic=document.getElementById('btn-rec'); const send=document.getElementById('btn-send'); if(isRecording) return; if(mic) mic.style.display=hasText?'none':'flex'; if(send) send.style.display=hasText?'flex':'none'; }
function envoyerDirect(cid){ const i=document.getElementById('msg-input');const t=i.value.trim();if(!t)return; const otherId = cid.split('_').find(id=>id!==currentUserId); database.ref(`conversations/${cid}/messages`).push({senderId:currentUserId,senderNom:document.getElementById('user-name').innerText,type:'text',vu:false,texte:t,replyTo:replyTo||null,createdAt:Date.now()}); pushJS(otherId, '💬 '+document.getElementById('user-name').innerText, t.substring(0,90)); i.value=''; clearReply(); onInputChange(i,cid); }
function jeTape(cid){database.ref(`conversations/${cid}/typing/${currentUserId}`).set(true);clearTimeout(window.typTO);window.typTO=setTimeout(()=>{database.ref(`conversations/${cid}/typing/${currentUserId}`).set(false);},1500);}
function init(){let s=JSON.parse(localStorage.getItem('mayne_current_user')||'null');if(!s){location.href='index.html';return;}currentUserId=s.phone.replace(/[^0-9]/g,'');database.ref('clients/'+currentUserId).once('value').then(v=>{const c=v.val()||{};const nom=c.nom||currentUserId;window.myPhoto=getUserPhoto(c);document.getElementById('user-name').innerText=nom;const photo=getUserPhoto(c);const av=document.getElementById('my-avatar'); if(av) av.innerHTML=photo? '<img src="'+getThumb(photo,200)+'">' : nom.substring(0,1).toUpperCase();});chargerMessagerie();}
firebase.auth().onAuthStateChanged(function(user){ if(user){ init(); } else { firebase.auth().signInAnonymously(); } });
</script>
