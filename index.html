<script>
window.OneSignalDeferred=window.OneSignalDeferred||[];
OneSignalDeferred.push(async function(OneSignal){
  await OneSignal.init({appId:"9fe0a621-5b0e-45dd-9daf-8cdc6b29b6b1",serviceWorkerParam:{scope:'/MAYNE-E-SERVICES-ILLIMINET/'},serviceWorkerPath:'/MAYNE-E-SERVICES-ILLIMINET/OneSignalSDKWorker.js'});
  const u=JSON.parse(localStorage.getItem('mayne_current_user')||'null');
  if(u&&u.phone){
    try{
      const phone=String(u.phone).replace(/\D/g,'');
      await OneSignal.login(phone);
      await OneSignal.User.addTags({phone:phone});
      const subId=await OneSignal.User.pushSubscription.id;
      if(subId && typeof database!=='undefined'){
        database.ref('clients/'+phone+'/onesignal_id').set(subId);
        database.ref('clients/'+phone+'/phone').set(phone);
      }
    }catch(e){}
  }
});
async function activerNotifications(){
  if(window.AppInventor){alert('✅ Notifications APK actives');return;}
  const OS=window.OneSignal; if(!OS)return alert('OneSignal charge...');
  const p=await OS.Notifications.requestPermission();
  if(p){
    const u=JSON.parse(localStorage.getItem('mayne_current_user')||'null');
    if(u&&u.phone){
      const phone=String(u.phone).replace(/\D/g,'');
      await OS.login(phone);
      await OS.User.addTags({phone:phone});
      const subId=await OS.User.pushSubscription.id;
      if(subId){
        database.ref('clients/'+phone+'/onesignal_id').set(subId);
        database.ref('clients/'+phone+'/phone').set(phone);
      }
    }
    alert('✅ Notifications activées!');
  }else alert('❌ Permission refusée');
}
</script>

<script>

<style>
footer{display:none}
body{margin:0;padding:5px;font-family:Arial,sans-serif;background:#aaaa;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;box-sizing:border-box}

<body>
<div class="app-container">
<div id="splash-zone" style="display:flex;min-height:60vh;align-items:center;justify-content:center;flex-direction:column;color:#ffeb3b;font-weight:bold;font-size:14px"><div style="font-size:40px">⏳</div><div>Chargement...</div></div>
<div id="logged-out-zone" style="display:none">
  <div id="login-interface" style="display:none">
    <h3 style="margin-top:0;margin-bottom:30px;color:#ffeb3b">BIENVENUE SUR ACTIFER</h3>
    <div class="input-group"><label class="input-label">Numéro de téléphone :</label><input type="text" id="login-id" class="input-field"></div>
    <div class="input-group"><label class="input-label">Mot de passe :</label><input type="password" id="login-pin" class="input-field" placeholder="••••••" maxlength="6"></div>
    <button type="button" class="btn-submit" style="background:#ff5000" onclick="executerConnexion()">Se connecter</button>
    <button type="button" class="btn-link" onclick="afficherFormulaireInscription()">Créer un compte</button>
  </div>
  <div id="register-interface" style="display:none;">
    <h3>BIENVENUE SUR ACTIFER</h3>
    <div class="input-group"><label class="input-label">Nom et Prénom :</label><input type="text" id="reg-name" class="input-field"></div>
    <div class="input-group"><label class="input-label">Numéro :</label><input type="text" id="reg-id" class="input-field"></div>
    <div class="input-group"><label class="input-label">Email :</label><input type="email" id="reg-email" class="input-field"></div>
    <div class="input-group"><label class="input-label">Mot de passe (6 chiffres) :</label><input type="password" id="reg-pin" class="input-field" maxlength="6"></div>
    <div class="input-group" style="border:2px dashed #ffeb3b;border-radius:6px;padding:6px;background:rgba(255,80,0,.15)"><label class="input-label" style="color:#ffeb3b">Code Parrain :</label><input type="text" id="reg-parrain" class="input-field"></div>
    <button type="button" class="btn-submit" style="background-color:#ff5000!important;" onclick="executerInscription()">Valider</button>
    <button type="button" class="btn-link" onclick="afficherFormulaireConnexion()">Déjà inscrit? Connexion</button>
  </div>
  <div id="verify-interface" style="display:none;"><h3 style="color:#ffeb3b">VÉRIFIE TON EMAIL</h3><div style="color:#fff;font-size:13px;margin-bottom:10px;">Code envoyé à <b id="verify-email-affiche"></b></div><div class="input-group"><input type="text" id="verify-code" class="input-field" placeholder="Code à 6 chiffres"></div><button type="button" class="btn-submit" onclick="verifierCodeEmail()">Vérifier</button><button type="button" class="btn-link" onclick="envoyerCodeEmail(null,true)">Renvoyer le code</button></div>
</div>
<div id="logged-in-zone" style="display:none;">
  <div class="header-actions">
    <div class="notif-bell" onclick="location.href='notifications.html'">🔔<span id="notif-count" class="notif-count">0</span></div>
    <button class="btn-action-top" onclick="location.href='compte.html'">Profil👤</button>
    <button class="btn-action-top" onclick="location.href='depot.html'">📥Recharger</button>
    <button class="btn-action-top retrait" onclick="location.href='retrait.html'">📤RETIRER</button>

  <div class="user-header">
    <button type="button" class="btn-logout" onclick="executerDeconnexion()">DÉCONNEXION</button>

    <div style="font-size:10px;color:#e0e0e0;margin-top:4px;"><b>BONUS :</div><div class="solde-val" style="color:#ffeb3b"><span id="user-commission"><b>0</span> F</div><div style="font-size:10px;color:#fff;"><b>SOLDE EPARGNE :</div><div class="solde-val" style="color:#FF5000;font-size:15px"><span id="user-recompense"><b>0</span> F</div>

  <div class="services-grid">
    <button class="tab-btn btn-home" onclick="location.href='index.html'">🏠 ACCUEIL</button>

    <button id="btn-1xbet" class="tab-btn service-btn-new" onclick="location.href='1xbet.html'">1XBET</button>

    <button id="btn-p2p" class="tab-btn service-btn-new" onclick="location.href='p2p.html'">🚀 P2P/P2M</button>

  </div>
</div>
</div>
<div id="custom-alert" class="modal-overlay"><div class="modal-box"><div id="custom-alert-msg" class="modal-msg"></div><button class="modal-btn btn-yes" onclick="hideAlert()">OK</button></div></div>
<div id="custom-confirm" class="modal-overlay"><div class="modal-box"><div id="custom-confirm-msg" class="modal-msg"></div><div class="modal-btns"><button class="modal-btn btn-no" onclick="doConfirm(false)">Pas besoin</button><button class="modal-btn btn-yes" onclick="doConfirm(true)">Oui bien sûr</button></div></div></div>
<script>
const WEBHOOK_URL='https://script.google.com/macros/s/AKfycbwasVyjf7iuYpMoonjNy-byi-_DKBeg9VRUfrWsnXQSPJNDElCVgV67ZFiZjY-eckpH/exec';
const OTP_URL='https://script.google.com/macros/s/AKfycbzfUdZWQ4zp8hmo9Pwq3w-V4iwY729lIL47iXEiUBl0MuWOiXUjeJteqNNmgiP_t2Uh6w/exec';
let tempPhone='',tempEmail='';
const TinyDB={put:(k,v)=>localStorage.setItem('mayne_'+k,JSON.stringify(v)),get:(k,d=null)=>{try{const v=localStorage.getItem('mayne_'+k);return v?JSON.parse(v):d;}catch{return d;}}};
let sessionTimer=null,currentUserId=null,soldeMasque=false;
function demarrerTimerSession(){clearInterval(sessionTimer);sessionTimer=setInterval(()=>{TinyDB.put('current_user_last',Date.now());},60000);}
function tryAutoLogin(){
  const splash=document.getElementById('splash-zone'),out=document.getElementById('logged-out-zone'),inZ=document.getElementById('logged-in-zone'),login=document.getElementById('login-interface'),reg=document.getElementById('register-interface'),verif=document.getElementById('verify-interface');
  const saved=TinyDB.get('current_user')||JSON.parse(localStorage.getItem('mayne_current_user')||'null');
  if(!saved||!saved.phone){splash.style.display='none';inZ.style.display='none';out.style.display='block';login.style.display='block';reg.style.display='none';verif.style.display='none';return;}
  currentUserId=saved.phone; splash.style.display='none';out.style.display='none';login.style.display='none';reg.style.display='none';verif.style.display='none';
  chargerSessionDepuisFirebase(saved.phone);
}
function chargerSessionDepuisFirebase(phone){
  database.ref('clients/'+phone).on('value',v=>{
    const data=v.val()||{};document.getElementById('logged-out-zone').style.display='none';document.getElementById('logged-in-zone').style.display='block';
    document.getElementById('user-name').innerText=data.nom||phone;
    document.getElementById('user-balance').innerText=(data.solde||0).toLocaleString('fr-FR');
    document.getElementById('user-commission').innerText=(data.commission||0).toLocaleString('fr-FR');
    document.getElementById('user-recompense').innerText=(data.recompense||0).toLocaleString('fr-FR');
  });
  ecouterClocheEtBordures(); demarrerTimerSession();
}
function ecouterClocheEtBordures(){
  if(!currentUserId)return;
  db.ref('notifications/'+currentUserId).on('value',snap=>{
    let c=snap.numChildren(),badge=document.getElementById('notif-count');
    if(badge){badge.style.display=c>0?'block':'none';badge.innerText=c>99?'99+':c;}
  });
}
window.addEventListener('DOMContentLoaded',()=>{tryAutoLogin();});
function showAlert(m){document.getElementById('custom-alert-msg').innerText=m;document.getElementById('custom-alert').style.display='flex';}
function hideAlert(){document.getElementById('custom-alert').style.display='none';}
function showConfirm(m,cb){window.confirmCallback=cb;document.getElementById('custom-confirm-msg').innerText=m;document.getElementById('custom-confirm').style.display='flex';}
function doConfirm(y){document.getElementById('custom-confirm').style.display='none';if(window.confirmCallback)window.confirmCallback(y);}
function toggleTheme(){}
function afficherFormulaireInscription(){document.getElementById('login-interface').style.display='none';document.getElementById('verify-interface').style.display='none';document.getElementById('register-interface').style.display='block';}
function afficherFormulaireConnexion(){document.getElementById('register-interface').style.display='none';document.getElementById('verify-interface').style.display='none';document.getElementById('login-interface').style.display='block';}
function executerConnexion(){
  const i=document.getElementById('login-id').value.trim(),p=document.getElementById('login-pin').value.trim();if(!i||!p)return;
  const pinHache=CryptoJS.MD5(p).toString();
  database.ref('clients/'+i).once('value').then(s=>{
    if(!s.exists())return showAlert('Numéro ou mot de passe incorrect');
    const dbPin=String(s.val().pin); if(dbPin!==pinHache&&dbPin!==p)return showAlert('Numéro ou mot de passe incorrect');
    const data=s.val(); if(data.email_verified===false){tempPhone=i;tempEmail=data.email;document.getElementById('verify-email-affiche').innerText=data.email;envoyerCodeEmail(data.email);return showAlert('Vérifie ton email');}
    currentUserId=i;
    TinyDB.put('current_user',{phone:i}); TinyDB.put('current_user_last',Date.now());
    localStorage.setItem('mayne_current_user',JSON.stringify({phone:i}));
    if(!window.AppInventor){
      window.OneSignalDeferred.push(async function(OneSignal){
        const phone = String(i).replace(/\D/g,'');
        await OneSignal.login(phone);
        await OneSignal.User.addTags({phone:phone});
        const subId = await OneSignal.User.pushSubscription.id;
        if(subId){
          database.ref('clients/'+i+'/onesignal_id').set(subId);
          database.ref('clients/'+i+'/phone').set(phone);
        }
      });
    }
    if(window.AppInventor)window.AppInventor.setWebViewString('USER_'+currentUserId);
    if(dbPin===p)database.ref('clients/'+i).update({pin:pinHache});
    chargerSessionDepuisFirebase(i);
  });
}
function executerInscription(){
  const n=document.getElementById('reg-name').value.trim(),i=document.getElementById('reg-id').value.trim(),e=document.getElementById('reg-email').value.trim().toLowerCase(),p=document.getElementById('reg-pin').value.trim();
  if(!n||!i||!e||!p)return showAlert('Remplis tout');
  const phone=i.replace(/\D/g,''),emailKey=e.replace(/\./g,','),pinHache=CryptoJS.MD5(p).toString();
  let parrain=new URLSearchParams(window.location.search).get('ref'); parrain=parrain?parrain.replace(/\D/g,''):''; if(parrain===phone)parrain='';
  const regParrainInput=document.getElementById('reg-parrain').value.trim().replace(/\D/g,''); if(regParrainInput)parrain=regParrainInput;
  database.ref('clients/'+phone).once('value').then(s=>{if(s.exists())return showAlert('Numéro déjà utilisé');
    database.ref('emails_index/'+emailKey).once('value').then(se=>{if(se.exists())return showAlert('Email déjà utilisé');
      database.ref('clients/'+phone).set({nom:n,email:e,pin:pinHache,solde:0,commission:0,recompense:0,email_verified:false,parrain:parrain||'',date_inscription:new Date().toLocaleString('fr-FR')}).then(()=>{
        database.ref('emails_index/'+emailKey).set(phone).then(()=>{
          tempPhone=phone;tempEmail=e;document.getElementById('verify-email-affiche').innerText=e;envoyerCodeEmail(e);
        });
      });
    });
  });
}
function envoyerCodeEmail(email,isResend=false){const mail=email||tempEmail;fetch(OTP_URL,{method:'POST',body:'action=send&email='+encodeURIComponent(mail),headers:{'Content-Type':'application/x-www-form-urlencoded'}}).then(r=>r.text()).then(t=>{if(t.includes('sent')){document.getElementById('login-interface').style.display='none';document.getElementById('register-interface').style.display='none';document.getElementById('verify-interface').style.display='block';showAlert(isResend?'Code renvoyé!':'Code envoyé à '+mail);}});}
function verifierCodeEmail(){const code=document.getElementById('verify-code').value.trim();if(!code)return;fetch(OTP_URL,{method:'POST',body:'action=verify&email='+encodeURIComponent(tempEmail)+'&code='+code,headers:{'Content-Type':'application/x-www-form-urlencoded'}}).then(r=>r.text()).then(t=>{if(t.includes('ok')){database.ref('clients/'+tempPhone).update({email_verified:true}).then(()=>{showAlert('Email vérifié!');document.getElementById('verify-interface').style.display='none';document.getElementById('login-interface').style.display='block';document.getElementById('login-id').value=tempPhone;});}else showAlert('Code incorrect');});}
function executerDeconnexion(){TinyDB.put('current_user',null);localStorage.removeItem('mayne_current_user');clearInterval(sessionTimer);if(currentUserId){database.ref('clients/'+currentUserId).off();}currentUserId=null;document.getElementById('logged-in-zone').style.display='none';document.getElementById('logged-out-zone').style.display='block';}
</script>
</body>
