<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Foot - ACTIFER</title>
<style>
body{margin:0; font-family:Arial; background:#1f1f1f;border:10px solid #ffc}
.header{background:#010; color:white; padding:12px; text-align:center; position:sticky; top:0; z-index:10;}
.header a{color:white; text-decoration:none; background:rgba(255,255,255,0.2); padding:7px 12px; border-radius:20px; margin:3px; display:inline-block; font-size:12px;}
.tabs{display:flex; gap:6px; overflow-x:auto; padding:10px; background:#010; position:sticky; top:52px; z-index:9;}
.tab{padding:8px 14px; border-radius:20px; border:1px solid #fff; background:green; color:white; font-weight:bold; white-space:nowrap; cursor:pointer; font-size:13px;}
.tab.active{background:red;}
.container{max-width:850px; margin:auto; padding:10px;}
.league-title{background:#ffc; padding:8px 12px; border-radius:8px; margin:15px 0 8px 0; font-weight:bold; color:#000; font-size:13px;}
.card{background:#ffc; border-radius:12px; padding:12px; margin-bottom:8px; display:flex; flex-direction:column; cursor:pointer;}
.card-top{display:flex; justify-content:space-between; align-items:center; width:100%;}
.team{width:50px; text-align:center;}.team img{width:32px; height:32px; object-fit:contain;}
.badge{padding:5px 10px; border-radius:12px; color:white; font-size:11px; font-weight:bold; min-width:80px; text-align:center;}
.badge.live{background:red; animation:blink 0.8s infinite;}
.badge.ht{background:orange; color:#000;}
.badge.fini{background:#666;}
.badge.sched{background:#0a3d8f;}
@keyframes blink{0%{opacity:1}50%{opacity:0.7}100%{opacity:1}}
.progress{height:4px; background:#ddd; border-radius:2px; margin-top:8px; width:100%; overflow:hidden;}
.progress-fill{height:100%;}
#modal{display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.92); z-index:100; overflow-y:auto; padding:10px; box-sizing:border-box;}
.modal-box{background:#fff; color:#000; max-width:520px; margin:20px auto; border-radius:12px; overflow:hidden;}
.modal-head{background:#010; color:#fff; padding:12px; display:flex; justify-content:space-between; align-items:center;}
.modal-body{padding:12px; max-height:85vh; overflow-y:auto;}
.tab-detail{display:flex; gap:4px; margin-bottom:10px; position:sticky; top:0; background:#fff; padding:5px 0; z-index:2;}
.tab-detail button{flex:1; padding:8px 4px; border:none; background:#eee; border-radius:8px; font-weight:bold; cursor:pointer; font-size:11px;}
.tab-detail button.active{background:red; color:#fff;}
.buteur{border-left:5px solid #0a0; padding:10px; margin:8px 0; border-radius:8px; background:#f0fff0;}
.stat-row{display:flex; justify-content:space-between; align-items:center; padding:9px 6px; border-bottom:1px solid #eee; font-size:12px;}
.stat-bar-bg{height:6px; background:#eee; border-radius:3px; flex:1; margin:0 8px; overflow:hidden; display:flex;}
.stat-bar{height:100%;}
</style>
</head>
<body>
<div class="header">
  <h2 style="margin:5px;">ACTIFER - LIVE FOOT</h2>
  <a href="index.html">← Accueil</a> <span id="clock" style="font-size:11px;color:#ff0"></span>
  <div id="live-info" style="font-size:11px; margin-top:6px; color:#0f0;"></div>
</div>
<div class="tabs">
  <button class="tab active" id="tab-all" onclick="loadAll(this)">Tous (J-3 à J+1)</button>
  <button class="tab" id="tab-live" onclick="loadLiveOnly(this)" style="background:#900; border-color:#ff0;">🔴 LIVE</button>
  <button class="tab" onclick="loadLeague('fifa.friendly',this)">Amicaux</button>
  <button class="tab" onclick="loadLeague('eng.1',this)">Premier League</button>
  <button class="tab" onclick="loadLeague('esp.1',this)">LaLiga</button>
  <button class="tab" onclick="loadLeague('fra.1',this)">Ligue 1</button>
  <button class="tab" onclick="loadLeague('ita.1',this)">Serie A</button>
  <button class="tab" onclick="loadLeague('ger.1',this)">Bundesliga</button>
  <button class="tab" onclick="loadLeague('usa.1',this)">MLS</button>
</div>
<div class="container"><div id="box">Chargement...</div></div>

<div id="modal" onclick="if(event.target==this) closeModal()">
  <div class="modal-box">
    <div class="modal-head"><b id="modal-title">Détails</b><button onclick="closeModal()" style="background:#fff;color:#000;border:none;padding:5px 12px;border-radius:15px;font-weight:bold">X</button></div>
    <div class="modal-body">
      <div class="tab-detail">
        <button id="btn-detail" class="active" onclick="showTab('detail')">⚽ Buteurs</button>
        <button id="btn-stats" onclick="showTab('stats')">📊 Stats</button>
        <button id="btn-effectif" onclick="showTab('effectif')">👥 Effectif</button>
      </div>
      <div id="tab-detail">Chargement...</div>
      <div id="tab-stats" style="display:none"></div>
      <div id="tab-effectif" style="display:none"></div>
    </div>
  </div>
</div>

<script>
const LEAGUES={'fifa.friendly':'Amicaux','eng.1':'Premier League','esp.1':'LaLiga','fra.1':'Ligue 1','ita.1':'Serie A','ger.1':'Bundesliga','usa.1':'MLS'};
let allMatchesCache=[]; let currentEventId=null; let currentLeague=null; let detailInterval=null;

function heureCotonou(d){ try{return new Date(d).toLocaleString('fr-FR',{timeZone:'Africa/Porto-Novo', hour:'2-digit', minute:'2-digit', day:'2-digit', month:'2-digit'})+' Cotonou';}catch(e){return d;} }
function traduire(t){ if(!t) return ''; const d={'Goal!':'BUT!','Assist by':'Passe décisive de','Penalty - Scored':'Penalty marqué','Own Goal':'CSC de','Yellow Card':'Jaune 🟨','Red Card':'Rouge 🟥'}; for(let k in d) t=t.split(k).join(d[k]); return t; }

function getMatchState(status){
  let raw = ((status.displayClock||'') + ' ' + (status.type.shortDetail||'') + ' ' + (status.type.detail||'') + ' ' + (status.type.name||'')).toLowerCase();
  let minute=null; let m=raw.match(/(\d+)'/); if(m) minute=parseInt(m[1]);
  if(raw.includes('ht')||raw.includes('half time')) return {state:'HT', minute:45, label:'Mi-temps', isLive:true};
  if(status.type.state==='post'||raw.includes('ft')||raw.includes('full time')) return {state:'FT', minute:90, label:'Terminé', isLive:false};
  if(status.type.state==='in') return {state:'LIVE', minute:minute, label: minute?`LIVE ${minute}'`:'LIVE', isLive:true};
  return {state:'PRE', minute:null, label:'Prévu', isLive:false};
}

async function fetchLeague(lg){
  const days = [];
  const today = new Date();
  for(let i=-3; i<=1; i++){
    const d = new Date(today); d.setDate(today.getDate()+i);
    const yyyy = d.getFullYear();
    const mm = String(d.getMonth()+1).padStart(2,'0');
    const dd = String(d.getDate()).padStart(2,'0');
    days.push(`${yyyy}${mm}${dd}`);
  }
  let allEvents = [];
  for(let dateStr of days){
    const url=`https://site.api.espn.com/apis/site/v2/sports/soccer/${lg}/scoreboard?dates=${dateStr}`;
    try{
      const r = await fetch(url);
      const data = await r.json();
      if(data.events && data.events.length>0){
        allEvents = allEvents.concat(data.events.map(e=>({...e,_lg:lg})));
      }
    }catch(e){}
  }
  return allEvents;
}

async function loadAll(btn){
  if(btn){ document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); }
  const box=document.getElementById('box');
  box.innerHTML='⏳ Chargement J-3 à J+1... 5 secondes';
  const results=[];
  for(let lg of Object.keys(LEAGUES)){
    const ev = await fetchLeague(lg);
    results.push(...ev);
    await new Promise(r=>setTimeout(r, 150));
  }
  allMatchesCache = results.sort((a,b)=> new Date(a.date) - new Date(b.date));
  afficherTous(allMatchesCache);
}

async function loadLiveOnly(btn){
  if(btn){ document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); }
  const box=document.getElementById('box'); box.innerHTML='⏳ LIVE...';
  if(allMatchesCache.length===0){ await loadAll(null); }
  const liveOnly=allMatchesCache.filter(m=>getMatchState(m.competitions[0].status).isLive);
  afficherLiveSeulement(liveOnly);
}

function afficherTous(all){
  const box=document.getElementById('box');
  document.getElementById('clock').innerText=' - '+new Date().toLocaleTimeString('fr-FR',{timeZone:'Africa/Porto-Novo', hour:'2-digit', minute:'2-digit'})+' Cotonou';
  const liveCount=all.filter(m=>getMatchState(m.competitions[0].status).isLive).length;
  document.getElementById('live-info').innerText=`${all.length} matchs (J-3 à J+1) - 🔴 ${liveCount} LIVE`;
  all.sort((a,b)=>{
    const ma=getMatchState(a.competitions[0].status); const mb=getMatchState(b.competitions[0].status);
    const order={LIVE:0, HT:1, PRE:2, FT:3};
    if(order[ma.state]!==order[mb.state]) return order[ma.state]-order[mb.state];
    return new Date(a.date)-new Date(b.date);
  });
  let html=''; let grouped={};
  all.forEach(m=>{ if(!grouped[m._lg]) grouped[m._lg]=[]; grouped[m._lg].push(m); });
  for(let lg of Object.keys(LEAGUES)){
    if(!grouped[lg]) continue;
    const gcount=grouped[lg];
    const lc=gcount.filter(m=>getMatchState(m.competitions[0].status).isLive).length;
    html+=`<div class="league-title">⚽ ${LEAGUES[lg]} ${lc>0?`🔴 ${lc} LIVE`:''} - ${gcount.length} matchs</div>`+gcount.map(x=>renderCard(x)).join('');
  }
  box.innerHTML=html || '<div style="background:#ffc;padding:20px;border-radius:12px;text-align:center">Aucun match</div>';
}

function afficherLiveSeulement(liveMatches){
  const box=document.getElementById('box');
  if(liveMatches.length===0){
    box.innerHTML=`<div style="background:#ffc;padding:20px;border-radius:12px;text-align:center"><h3>😴 Aucun LIVE</h3><button onclick="loadAll(document.getElementById('tab-all'))" style="padding:10px 20px;border-radius:20px;border:none;background:#010;color:#fff">Voir tous</button></div>`;
    return;
  }
  let html=''; let grouped={};
  liveMatches.forEach(m=>{ if(!grouped[m._lg]) grouped[m._lg]=[]; grouped[m._lg].push(m); });
  for(let lg of Object.keys(grouped)){ html+=`<div class="league-title">⚽ ${LEAGUES[lg]} 🔴 ${grouped[lg].length} LIVE</div>`+grouped[lg].map(x=>renderCard(x)).join(''); }
  box.innerHTML=html;
}

function renderCard(g){
  const c=g.competitions[0]; const st=c.status; const h=c.competitors.find(x=>x.homeAway==='home'); const a=c.competitors.find(x=>x.homeAway==='away'); const ms=getMatchState(st);
  const isLive=ms.state==='LIVE'; const isHT=ms.state==='HT'; const isFini=ms.state==='FT';
  let badgeClass=isLive?'live':isHT?'ht':isFini?'fini':'sched';
  let timerText=isLive?`⏱️ ${ms.minute?ms.minute+"'":'LIVE'}`: isHT?`Mi-temps`: isFini?`Terminé`: heureCotonou(g.date);
  let progressW=isLive? (ms.minute? (ms.minute/90)*100 : 15) : isHT?50: isFini?100:0;
  return `<div class="card" onclick="openDetail('${g.id}','${g._lg}')" style="border-left:6px solid ${isLive?'red':isHT?'orange':isFini?'#999':'#0a3d8f'}">
    <div class="card-top"><div style="display:flex; align-items:center; gap:8px; flex:1;"><div class="team"><img src="${a.team.logo}" onerror="this.style.display='none'"><br><small style="font-size:10px">${a.team.abbreviation||''}</small></div><div style="flex:1; font-size:13px;"><div style="display:flex; justify-content:space-between;"><span>${a.team.shortDisplayName}</span><b>${a.score||0}</b></div><div style="display:flex; justify-content:space-between;"><span>${h.team.shortDisplayName}</span><b>${h.score||0}</b></div><small style="color:${isLive?'red':isHT?'#d35400':'#555'}; font-weight:bold;">${timerText}</small></div><div class="team"><img src="${h.team.logo}" onerror="this.style.display='none'"><br><small style="font-size:10px">${h.team.abbreviation||''}</small></div></div><div style="text-align:right; min-width:95px; margin-left:8px;"><span class="badge ${badgeClass}">${ms.label}</span></div></div>${(isLive||isHT)?`<div class="progress"><div class="progress-fill" style="width:${progressW}%; background:${isHT?'orange':'red'}"></div></div>`:''}
  </div>`;
}

async function loadLeague(league,btn){
  if(btn){ document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); }
  const box=document.getElementById('box'); box.innerHTML='Chargement...';
  const events=await fetchLeague(league);
  box.innerHTML=`<div class="league-title">⚽ ${LEAGUES[league]} - ${events.length} matchs</div>`+events.map(g=>renderCard(g)).join('') || '<div style="background:#ffc;padding:15px;text-align:center">Aucun match J-3 à J+1</div>';
}

function showTab(n){ ['detail','stats','effectif'].forEach(x=>{ document.getElementById('tab-'+x).style.display=x===n?'block':'none'; document.getElementById('btn-'+x).classList.toggle('active', x===n); }); }

async function openDetail(eventId,league){
  currentEventId=eventId; currentLeague=league;
  document.getElementById('modal').style.display='block';
  document.getElementById('modal-title').innerText='Chargement...';
  document.getElementById('tab-detail').innerHTML='⏳...'; document.getElementById('tab-stats').innerHTML='⏳...'; document.getElementById('tab-effectif').innerHTML='⏳...';
  showTab('detail');
  await fetchDetail(eventId,league);
  clearInterval(detailInterval);
  detailInterval=setInterval(()=>{ if(document.getElementById('modal').style.display==='block' && currentEventId) fetchDetail(currentEventId,currentLeague); },15000);
}

async function fetchDetail(eventId,league){
  try{
    const url=`https://site.api.espn.com/apis/site/v2/sports/soccer/${league}/summary?event=${eventId}`;
    const r=await fetch(url+'?t='+Date.now()); const data=await r.json();
    const comp=data.header?.competitions?.[0]; if(!comp) return;
    const home=comp.competitors?.find(c=>c.homeAway==='home'); const away=comp.competitors?.find(c=>c.homeAway==='away');
    const ms=getMatchState(comp.status);
    document.getElementById('modal-title').innerText=`${away.team.displayName} ${away.score} - ${home.score} ${home.team.displayName} ${ms.label}`;
    let scorers = comp.details? comp.details.filter(d=>d.scoringPlay) : [];
    let detailHtml=`<div style="text-align:center; padding:10px; background:#ffc; border-radius:8px; margin-bottom:12px;"><div style="display:flex; justify-content:space-around; align-items:center;"><div><img src="${away.team.logo}" width="48"><br><b style="font-size:12px">${away.team.displayName}</b></div><div style="font-size:26px; font-weight:bold;">${away.score||0} - ${home.score||0}<br><small style="font-size:13px;">${ms.label}</small></div><div><img src="${home.team.logo}" width="48"><br><b style="font-size:12px">${home.team.displayName}</b></div></div></div>`;
    detailHtml+=`<div style="font-weight:bold; margin:10px 0;">⚽ Buteurs</div>`;
    if(scorers.length>0){
      scorers.forEach(s=>{
        let buteur = s.athletesInvolved?.[0]?.displayName || 'Buteur';
        let passeur = s.athletesInvolved?.[1]?.displayName || null;
        detailHtml+=`<div class="buteur"><b>${buteur}</b> ${s.clock?.displayValue||''}' ${passeur?`<br><small>🎯 ${passeur}</small>`:''}<br><small>${traduire(s.text||'')}</small></div>`;
      });
    }else{ detailHtml+=`<div style="text-align:center;padding:12px;background:#f9f9f9;border-radius:8px">${away.score==0&&home.score==0?'0-0 • Pas encore de but':'Buts non détaillés'}</div>`; }
    document.getElementById('tab-detail').innerHTML=detailHtml;
    document.getElementById('tab-stats').innerHTML='<div style="padding:15px;text-align:center">Stats dispos en LIVE</div>';
    document.getElementById('tab-effectif').innerHTML='<div style="padding:15px;text-align:center">Compo 1h avant match</div>';
  }catch(e){ document.getElementById('tab-detail').innerHTML='Erreur: '+e; }
}
function closeModal(){ document.getElementById('modal').style.display='none'; clearInterval(detailInterval); }
setInterval(()=>{ const t=document.querySelector('.tab.active'); if(t&&t.id==='tab-all') loadAll(null); },30000);
loadAll();
</script>
</body>
</html>
