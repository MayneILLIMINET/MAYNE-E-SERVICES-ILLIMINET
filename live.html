<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACTIFER LIVE</title>
<style>
*{box-sizing:border-box}
body{margin:0; font-family:Arial, sans-serif; background:#ff5000; border:8px solid #ffc}
.header{background:#010; color:white; padding:10px; text-align:center; position:sticky; top:0; z-index:20}
.header a{color:#000; text-decoration:none; background:#ffc; padding:6px 14px; border-radius:20px; font-weight:bold; font-size:12px}
.tabs{display:flex; gap:6px; overflow-x:auto; padding:10px; background:#000; position:sticky; top:56px; z-index:19}
.tab{padding:9px 14px; border-radius:20px; border:1px solid #333; background:#222; color:#fff; font-weight:bold; white-space:nowrap; cursor:pointer; font-size:12px}
.tab.active{background:red}
.container{max-width:860px; margin:auto; padding:10px}
.league-title{background:#ffc; padding:8px 12px; border-radius:8px; margin:16px 0 8px 0; font-weight:bold; color:#000; font-size:12px; display:flex; justify-content:space-between}
.card{background:#ffc; border-radius:12px; padding:12px; margin-bottom:9px; cursor:pointer}
.card-top{display:flex; justify-content:space-between; align-items:center}
.team{width:52px; text-align:center; font-size:10px; font-weight:bold}
.team img{width:36px; height:36px; object-fit:contain; background:#fff; border-radius:50%; padding:3px}
.badge{padding:6px 10px; border-radius:12px; color:white; font-size:11px; font-weight:bold; min-width:85px; text-align:center}
.badge.live{background:red; animation:blink 0.8s infinite} .badge.ht{background:orange;color:#000} .badge.fini{background:#555} .badge.sched{background:#0a3d8f}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.6}}
.progress{height:5px; background:#ddd; border-radius:3px; margin-top:10px; overflow:hidden} .progress-fill{height:100%; transition:width 1s linear}
#modal{display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.94); z-index:100; overflow-y:auto; padding:10px}
.modal-box{background:#fff; color:#000; max-width:560px; margin:15px auto; border-radius:14px; overflow:hidden}
.modal-head{background:#000; color:#ffc; padding:12px; display:flex; justify-content:space-between; align-items:center}
.modal-body{padding:0; max-height:86vh; overflow-y:auto}
.tab-detail{display:flex; gap:5px; padding:10px; position:sticky; top:0; background:#fff; z-index:2; border-bottom:1px solid #eee}
.tab-detail button{flex:1; padding:10px 4px; border:none; background:#eee; border-radius:10px; font-weight:bold; cursor:pointer; font-size:12px}
.tab-detail button.active{background:red; color:#fff}
.buteur{border-left:5px solid #0a0; padding:10px; margin:10px; border-radius:10px; background:#f0fff0; font-size:13px}
.player-row{display:flex; align-items:center; gap:10px; padding:9px 12px; border-bottom:1px solid #f0f0f0; font-size:12px}
.player-row.titulaire{background:#f9fff0; font-weight:bold}
.avatar{width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:11px; flex-shrink:0; background:#0a3d8f; color:#fff; border:2px solid #fff; box-shadow:0 0 0 1px #ddd; overflow:hidden}
.avatar img{width:100%; height:100%; object-fit:cover; display:block}
.avatar.bench{background:#555}
</style>
</head>
<body>
<div class="header">
  <div style="display:flex; justify-content:space-between; align-items:center"><a href="index.html">← Accueil</a><b>ACTIFER MGAP</b><span id="clock" style="font-size:11px; color:#ff0"></span></div>
  <div id="live-info" style="font-size:11px; margin-top:6px; color:#0f0; font-weight:bold"></div>
</div>
<div class="tabs">
  <button class="tab active" id="tab-all" onclick="loadAll(this)">Tous J-3 à J+1</button>
  <button class="tab" id="tab-live" onclick="loadLiveOnly(this)" style="background:#900">🔴 LIVE</button>
  <button class="tab" onclick="loadLeague('eng.1',this)">Premier League</button>
  <button class="tab" onclick="loadLeague('esp.1',this)">LaLiga</button>
  <button class="tab" onclick="loadLeague('fra.1',this)">Ligue 1</button>
  <button class="tab" onclick="loadLeague('ita.1',this)">Serie A</button>
  <button class="tab" onclick="loadLeague('ger.1',this)">Bundesliga</button>
  <button class="tab" onclick="loadLeague('usa.1',this)">MLS</button>
  <button class="tab" onclick="loadLeague('fifa.friendly',this)">Amicaux</button>
</div>
<div class="container"><div id="box">Chargement...</div></div>
<div id="modal" onclick="if(event.target==this) closeModal()">
  <div class="modal-box">
    <div class="modal-head"><b id="modal-title">Détails</b><button onclick="closeModal()" style="background:#ffc;color:#000;border:none;padding:6px 12px;border-radius:20px;font-weight:bold">X</button></div>
    <div class="modal-body">
      <div class="tab-detail">
        <button id="btn-detail" class="active" onclick="showTab('detail')">⚽ Buteurs</button>
        <button id="btn-stats" onclick="showTab('stats')">📊 Stats</button>
        <button id="btn-effectif" onclick="showTab('effectif')">👥 Effectif</button>
      </div>
      <div id="tab-detail"></div>
      <div id="tab-stats" style="display:none"></div>
      <div id="tab-effectif" style="display:none"></div>
    </div>
  </div>
</div>
<script>
const LEAGUES={'fifa.friendly':'Amicaux','eng.1':'Premier League','esp.1':'LaLiga','fra.1':'Ligue 1','ita.1':'Serie A','ger.1':'Bundesliga','usa.1':'MLS'};
let allMatchesCache=[], currentEventId=null, currentLeague=null, detailInterval=null, mainInterval=null, minuteTicker=null;
function heureCotonou(d){ return new Date(d).toLocaleString('fr-FR',{timeZone:'Africa/Porto-Novo', hour:'2-digit', minute:'2-digit', day:'2-digit', month:'2-digit'})+' Cotonou'; }
function getMatchState(s){ let raw=((s.displayClock||'')+' '+(s.type.shortDetail||'')+' '+(s.type.detail||'')).toLowerCase(); let m=raw.match(/(\d+)'/); let minute=m?parseInt(m[1]):null; if(raw.includes('ht')) return {state:'HT', minute:45, label:'Mi-temps', isLive:true, order:1}; if(s.type.state==='post' || raw.includes('ft')) return {state:'FT', minute:90, label:'Terminé', isLive:false, order:3}; if(s.type.state==='in') return {state:'LIVE', minute, label:minute?`LIVE ${minute}'`:'LIVE', isLive:true, order:0}; return {state:'PRE', minute:null, label:'Prévu', isLive:false, order:2}; }
function extractName(t){ if(!t) return 'Buteur'; let m=t.match(/^(.+?)\s*\(/); return m?m[1].trim():t.split(' - ')[0].trim().substring(0,35); }
function getLogo(team){ if(!team) return ''; return team.logo || `https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F${team.id}.png&w=80&h=80`; }
function getPlayerAvatar(name, jersey, athlete){ if(athlete?.headshot?.href && athlete.headshot.href.startsWith('http')) return athlete.headshot.href; if(athlete?.headshot && typeof athlete.headshot === 'string' && athlete.headshot.startsWith('http')) return athlete.headshot; if(athlete?.id) return `https://a.espncdn.com/combiner/i?img=%2Fi%2Fheadshots%2Fsoccer%2Fplayers%2Ffull%2F${athlete.id}.png&w=80&h=80&scale=crop&background=transparent`; return null; }
async function fetchLeague(lg){ const days=[]; const today=new Date(); for(let i=-3;i<=1;i++){ const d=new Date(today); d.setDate(today.getDate()+i); days.push(`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`); } let all=[]; for(let ds of days){ try{ const r=await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/${lg}/scoreboard?dates=${ds}`); const j=await r.json(); if(j.events) all=all.concat(j.events.map(e=>({...e,_lg:lg}))); }catch(e){} } return all; }
function renderCard(g){ const c=g.competitions[0]; const st=c.status; const h=c.competitors.find(x=>x.homeAway==='home'); const a=c.competitors.find(x=>x.homeAway==='away'); const ms=getMatchState(st); let badgeClass=ms.state==='LIVE'?'live':ms.state==='HT'?'ht':ms.state==='FT'?'fini':'sched'; let timerText=ms.state==='LIVE'?`⏱️ <span class="live-minute" data-start="${ms.minute||0}">${ms.minute||0}'</span>`: ms.state==='HT'?`Mi-temps`: ms.state==='FT'?`Terminé`: heureCotonou(g.date); let progressW=ms.minute? (ms.minute/90)*100 : ms.state==='HT'?50: ms.state==='FT'?100:0; return `<div class="card" id="match-${g.id}" onclick="openDetail('${g.id}','${g._lg}')" style="border-left:6px solid ${ms.state==='LIVE'?'red':ms.state==='HT'?'orange':ms.state==='FT'?'#777':'#0a3d8f'}"><div class="card-top"><div style="display:flex; align-items:center; gap:8px; flex:1;"><div class="team"><img referrerpolicy="no-referrer" src="${getLogo(a.team)}" onerror="this.style.display='none'"><br>${a.team.abbreviation||''}</div><div style="flex:1; font-size:13px;"><div style="display:flex; justify-content:space-between"><span>${a.team.shortDisplayName}</span><b id="score-a-${g.id}">${a.score||0}</b></div><div style="display:flex; justify-content:space-between"><span>${h.team.shortDisplayName}</span><b id="score-h-${g.id}">${h.score||0}</b></div><small id="time-${g.id}" style="color:${ms.state==='LIVE'?'red':'#444'}; font-weight:bold">${timerText}</small></div><div class="team"><img referrerpolicy="no-referrer" src="${getLogo(h.team)}" onerror="this.style.display='none'"><br>${h.team.abbreviation||''}</div></div><div style="text-align:right; min-width:88px"><span id="badge-${g.id}" class="badge ${badgeClass}">${ms.label}</span></div></div><div class="progress"><div id="prog-${g.id}" class="progress-fill" style="width:${progressW}%; background:${ms.state==='HT'?'orange':ms.state==='LIVE'?'red':'#999'}"></div></div></div>`; }
async function loadAll(btn){ if(btn){ document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); } document.getElementById('box').innerHTML='⏳ Chargement...'; let all=[]; for(let lg of Object.keys(LEAGUES)){ all=all.concat(await fetchLeague(lg)); await new Promise(r=>setTimeout(r,100)); } allMatchesCache=all; afficherTous(allMatchesCache); startAutoRefresh(); }
function afficherTous(all){ const box=document.getElementById('box'); const liveCount=all.filter(m=>getMatchState(m.competitions[0].status).isLive).length; document.getElementById('live-info').innerText=`${all.length} matchs - 🔴 ${liveCount} LIVE`; document.getElementById('clock').innerText=new Date().toLocaleTimeString('fr-FR',{timeZone:'Africa/Porto-Novo', hour:'2-digit', minute:'2-digit'})+' Cotonou'; all=all.sort((a,b)=>{ const ma=getMatchState(a.competitions[0].status), mb=getMatchState(b.competitions[0].status); if(ma.order!==mb.order) return ma.order-mb.order; return new Date(a.date)-new Date(b.date); }); let html='', grouped={}; all.forEach(m=>{ if(!grouped[m._lg]) grouped[m._lg]=[]; grouped[m._lg].push(m); }); for(let lg of Object.keys(LEAGUES)){ if(!grouped[lg]) continue; const lc=grouped[lg].filter(m=>getMatchState(m.competitions[0].status).isLive).length; html+=`<div class="league-title"><span>⚽ ${LEAGUES[lg]}</span><span>${lc>0?`🔴 ${lc} LIVE - `:''}${grouped[lg].length}</span></div>`+grouped[lg].map(x=>renderCard(x)).join(''); } box.innerHTML=html || '<div style="background:#ffc;padding:20px;text-align:center">Aucun match</div>'; startMinuteTicker(); }
async function refreshScoresOnly(){ let fresh=[]; for(let lg of Object.keys(LEAGUES)){ fresh=fresh.concat(await fetchLeague(lg)); } fresh.forEach(g=>{ const c=g.competitions[0]; const h=c.competitors.find(x=>x.homeAway==='home'); const a=c.competitors.find(x=>x.homeAway==='away'); const ms=getMatchState(c.status); const elA=document.getElementById(`score-a-${g.id}`), elH=document.getElementById(`score-h-${g.id}`), elBadge=document.getElementById(`badge-${g.id}`), elProg=document.getElementById(`prog-${g.id}`); if(!elA) return; elA.innerText=a.score||0; elH.innerText=h.score||0; if(elBadge) elBadge.innerText=ms.label; if(elProg && ms.minute) elProg.style.width=(ms.minute/90*100)+'%'; }); }
function startAutoRefresh(){ clearInterval(mainInterval); mainInterval=setInterval(refreshScoresOnly,15000); }
function startMinuteTicker(){ clearInterval(minuteTicker); minuteTicker=setInterval(()=>{ document.querySelectorAll('.live-minute').forEach(el=>{ let v=parseInt(el.dataset.start)||0; if(v>0 && v<90){ el.innerText=(v+1)+"'"; el.dataset.start=v+1; } }); },60000); }
async function loadLiveOnly(btn){ if(btn){ document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); } if(allMatchesCache.length===0) await loadAll(null); const live=allMatchesCache.filter(m=>getMatchState(m.competitions[0].status).isLive); if(live.length===0){ document.getElementById('box').innerHTML=`<div style="background:#ffc;padding:25px;border-radius:12px;text-align:center"><h3>😴 Aucun LIVE</h3></div>`; return; } afficherTous(live); }
async function loadLeague(lg,btn){ if(btn){ document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); } document.getElementById('box').innerHTML='Chargement...'; const ev=await fetchLeague(lg); document.getElementById('box').innerHTML=`<div class="league-title"><span>⚽ ${LEAGUES[lg]}</span><span>${ev.length}</span></div>`+ev.map(renderCard).join('') || '<div style="background:#ffc;padding:15px;text-align:center">Aucun match</div>'; }
function showTab(n){ ['detail','stats','effectif'].forEach(x=>{ document.getElementById('tab-'+x).style.display=x===n?'block':'none'; document.getElementById('btn-'+x).classList.toggle('active', x===n); }); }
async function openDetail(eventId,league){ currentEventId=eventId; currentLeague=league; document.getElementById('modal').style.display='block'; document.getElementById('tab-detail').innerHTML='⏳'; document.getElementById('tab-stats').innerHTML='⏳'; document.getElementById('tab-effectif').innerHTML='⏳'; showTab('detail'); await fetchDetail(eventId,league); clearInterval(detailInterval); detailInterval=setInterval(()=>fetchDetail(currentEventId,currentLeague),15000); }
async function fetchDetail(eventId,league){
  try{
    const r=await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/${league}/summary?event=${eventId}&t=${Date.now()}`);
    const data=await r.json(); const comp=data.header?.competitions?.[0]; if(!comp) return;
    const home=comp.competitors.find(c=>c.homeAway==='home'); const away=comp.competitors.find(c=>c.homeAway==='away'); const ms=getMatchState(comp.status);
    document.getElementById('modal-title').innerText=`${away.team.displayName} ${away.score} - ${home.score} ${home.team.displayName}`;
    let details=comp.details||[]; let scorers=details.filter(d=>d.scoringPlay);
    let htmlB=`<div style="text-align:center; padding:14px; background:#ffc; border-radius:12px; margin:10px; border:2px solid #000; display:flex; justify-content:space-around; align-items:center"><div><img referrerpolicy="no-referrer" src="${getLogo(away.team)}" style="width:48px; height:48px; background:#fff; border-radius:50%; padding:4px"><br><b style="font-size:11px">${away.team.abbreviation}</b></div><div><div style="font-size:28px; font-weight:bold">${away.score||0} - ${home.score||0}</div><small style="background:${ms.isLive?'red':'#000'}; color:#fff; padding:3px 8px; border-radius:10px">${ms.label}</small></div><div><img referrerpolicy="no-referrer" src="${getLogo(home.team)}" style="width:48px; height:48px; background:#fff; border-radius:50%; padding:4px"><br><b style="font-size:11px">${home.team.abbreviation}</b></div></div>`;
    if(scorers.length>0){ scorers.forEach(s=>{ let inv0=s.athletesInvolved?.[0], part0=s.participants?.[0]; let buteurName = inv0?.athlete?.displayName || inv0?.displayName || part0?.athlete?.displayName || extractName(s.text); let passeurName = s.athletesInvolved?.[1]?.athlete?.displayName || s.participants?.[1]?.athlete?.displayName || null; let minute = s.clock?.displayValue || ''; htmlB+=`<div class="buteur"><b>${buteurName}</b> <span style="float:right; background:#000; color:#ffc; padding:2px 8px; border-radius:10px">${minute}</span><br><small>${s.type?.text||'But'}</small>${passeurName?`<br>🎯 Passe : <b>${passeurName}</b>`:''}</div>`; }); } else { htmlB+=`<div style="padding:12px; background:#f5f5f5; margin:10px; border-radius:8px; text-align:center">${away.score==0&&home.score==0?'0-0 Pas de but':'Score '+away.score+'-'+home.score}</div>`; }
    document.getElementById('tab-detail').innerHTML=htmlB;
    let stats=data.boxscore?.teams||[]; let trad={'possession':'Possession %','Possession':'Possession %','Possession %':'Possession %','shots':'Tirs totaux','totalShots':'Tirs totaux','shotsOnTarget':'Tirs cadrés','Shots on Target':'Tirs cadrés','shotsOffTarget':'Tirs non cadrés','blockedShots':'Tirs bloqués','cornerKicks':'Corners','Corners':'Corners','offsides':'Hors-jeu','Offsides':'Hors-jeu','fouls':'Fautes','Fouls':'Fautes','yellowCards':'Cartons jaunes','Yellow Cards':'Cartons jaunes','redCards':'Cartons rouges','Red Cards':'Cartons rouges','saves':'Arrêts gardien','Saves':'Arrêts gardien','totalPasses':'Passes totales','Passes':'Passes totales','passAccuracy':'Précision passes %'}; let htmlS=`<div style="display:flex; justify-content:space-around; align-items:center; padding:12px; background:#000; color:#ffc; margin-bottom:4px"><div style="text-align:center"><img src="${getLogo(away.team)}" style="width:32px; background:#fff; border-radius:50%; padding:3px"><br><small>${away.team.abbreviation}</small></div><b style="font-size:13px">STATS DU MATCH</b><div style="text-align:center"><img src="${getLogo(home.team)}" style="width:32px; background:#fff; border-radius:50%; padding:3px"><br><small>${home.team.abbreviation}</small></div></div>`; if(stats.length>0 && stats[0].statistics){ let teamStats={}; stats.forEach(t=>{ teamStats[t.team.id]=t; }); let names=[...new Set(Object.values(teamStats).flatMap(t=>t.statistics.map(s=>s.name)))]; names.forEach(name=>{ let cleanName = trad[name] || name; let vA='0',vH='0'; if(teamStats[away.team.id]){ let f=teamStats[away.team.id].statistics.find(x=>x.name===name); if(f) vA=f.displayValue; } if(teamStats[home.team.id]){ let f=teamStats[home.team.id].statistics.find(x=>x.name===name); if(f) vH=f.displayValue; } let pctA=parseFloat(vA)||0, pctH=parseFloat(vH)||0, tot=pctA+pctH||1; let isPct = cleanName.includes('Possession') || cleanName.includes('Précision'); htmlS+=`<div style="display:flex; justify-content:space-between; padding:11px 12px; border-bottom:1px solid #f2f2f2; font-size:13px"><span style="font-weight:bold; min-width:35px">${vA}${isPct && !vA.includes('%')?'%':''}</span><span style="flex:1; text-align:center">${cleanName}</span><span style="font-weight:bold; min-width:35px; text-align:right">${vH}${isPct && !vH.includes('%')?'%':''}</span></div><div style="height:6px; background:#eee; display:flex; margin:0 12px 8px 12px; border-radius:3px; overflow:hidden"><div style="width:${(pctA/tot)*100}%; background:#0a3d8f"></div><div style="width:${(pctH/tot)*100}%; background:#c00"></div></div>`; }); } else { htmlS+='<div style="padding:20px; text-align:center">Stats LIVE après coup d\'envoi</div>'; } document.getElementById('tab-stats').innerHTML=htmlS;
    let rosters=data.rosters||[]; let htmlE=''; if(rosters.length>=2){ rosters.forEach(r=>{ htmlE+=`<div style="background:#000; color:#ffc; padding:8px 12px; display:flex; justify-content:space-between; align-items:center; margin-top:12px"><span style="display:flex; align-items:center; gap:8px"><img src="${getLogo(r.team)}" style="width:24px; background:#fff; border-radius:50%; padding:2px"> ${r.team.displayName}</span><span style="font-size:10px; background:#ffc; color:#000; padding:2px 8px; border-radius:10px">${r.formation||''}</span></div>`; let starters=(r.roster||[]).filter(p=>p.starter), bench=(r.roster||[]).filter(p=>!p.starter); htmlE+=`<div style="padding:6px 12px; font-weight:bold; font-size:11px; background:#e8f5e9">✅ TITULAIRES (${starters.length})</div>`; starters.forEach(p=>{ let name=p.athlete?.displayName||'Joueur', pos=p.position?.abbreviation||'', jersey=p.jersey||''; let photoUrl=getPlayerAvatar(name, jersey, p.athlete); let hasPhoto = !!photoUrl; let fallback = jersey || name.substring(0,2).toUpperCase(); htmlE+=`<div class="player-row titulaire"><div class="avatar" style="background:${hasPhoto?'#fff':'#0a3d8f'}">${hasPhoto?`<img referrerpolicy="no-referrer" src="${photoUrl}" onerror="this.parentNode.innerHTML='${fallback}'; this.parentNode.style.background='#0a3d8f'; this.parentNode.style.color='#fff'">`:`${fallback}`}</div><span style="flex:1"><b>#${jersey} ${name}</b> <small style="color:#666">${pos}</small></span><span style="font-size:10px; background:#0a3d8f; color:#fff; padding:3px 8px; border-radius:10px">${pos}</span></div>`; }); htmlE+=`<div style="padding:6px 12px; font-weight:bold; font-size:11px; background:#fff3e0">🔄 REMPLAÇANTS (${bench.length})</div>`; bench.forEach(p=>{ let name=p.athlete?.displayName||'', pos=p.position?.abbreviation||'SUB', jersey=p.jersey||''; let photoUrl=getPlayerAvatar(name, jersey, p.athlete); let hasPhoto = !!photoUrl; let fallback = jersey || name.substring(0,2).toUpperCase(); htmlE+=`<div class="player-row"><div class="avatar bench" style="background:${hasPhoto?'#fff':'#666'}; width:32px; height:32px; font-size:10px">${hasPhoto?`<img referrerpolicy="no-referrer" src="${photoUrl}" onerror="this.parentNode.innerHTML='${fallback}'; this.parentNode.style.background='#666'; this.parentNode.style.color='#fff'">`:`${fallback}`}</div><span style="flex:1">#${jersey} ${name} <small style="color:#666">${pos}</small></span></div>`; }); }); }else{ htmlE='<div style="padding:20px; text-align:center">Compo 1h avant match</div>'; } document.getElementById('tab-effectif').innerHTML=htmlE;
  }catch(e){ document.getElementById('tab-detail').innerHTML='Erreur: '+e.message; }
}
function closeModal(){ document.getElementById('modal').style.display='none'; clearInterval(detailInterval); }
loadAll();
</script>
</body>
</html>
