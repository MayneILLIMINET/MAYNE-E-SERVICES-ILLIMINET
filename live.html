async function fetchRealNews(lg){
  CURRENT_NEWS_LEAGUE=lg||null;
  document.getElementById('news-box').innerHTML='<div style="padding:14px; background:#fff; text-align:center; font-size:12px">📰 Chargement des actus en français...</div>';
  let allArts=[]; const feeds=[
    {url:'https://www.lequipe.fr/rss/football.xml', source:"L'ÉQUIPE"},
    {url:'https://www.footmercato.net/rss', source:'FOOT MERCATO'},
    {url:'https://rmcsport.bfmtv.com/rss/football/', source:'RMC SPORT'},
    {url:'https://www.24haubenin.info/rss.xml', source:'24H AU BÉNIN'},
    {url:'https://beninwebtv.com/feed/', source:'BÉNIN WEB TV'}
  ];
  await Promise.all(feeds.map(async f=>{
    try{ const r=await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(f.url)}`); const j=await r.json();
      (j.items||[]).forEach(it=>{ let img=it.enclosure?.link || it.thumbnail || ''; if(!img){ let m=(it.description||'').match(/src="([^"]+\.(jpg|jpeg|png|webp)[^"]*)"/i); if(m) img=m[1]; } if(!img) img='https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=800&q=80'; let txt=(it.title+' '+(it.description||'')).replace(/<[^>]*>/g,' '); allArts.push({titre:it.title, cat:f.source, img:img, link:it.link||'#', text:txt.toLowerCase()}); });
    }catch(e){}
  }));
  if(allArts.length<3){ try{ const r=await fetch('https://site.api.espn.com/apis/site/v2/sports/soccer/news?limit=15'); const j=await r.json(); (j.articles||[]).forEach(a=>{ if(a.headline && a.images?.[0]?.url) allArts.push({titre:traduireTitre(a.headline), cat:"ESPN • FR", img:a.images[0].url, link:a.links?.web?.href||'#', text:a.headline.toLowerCase()}); }); }catch(e){} }
  let filtered=allArts; if(lg && LEAGUE_KEYWORDS[lg]){ let kws=LEAGUE_KEYWORDS[lg]; let f=allArts.filter(a=>kws.some(k=>a.text.includes(k))); if(f.length>=2) filtered=f; }
  let seen=new Set(); filtered=filtered.filter(a=>{ if(seen.has(a.titre)) return false; seen.add(a.titre); return true; });
  if(filtered.length===0) filtered=allArts; REAL_NEWS=filtered.slice(0,10); newsIndex=0; renderNews();
}
function traduireTitre(t){ let d={'Champions League':'Ligue des Champions','Premier League':'Premier League','Transfer':'Mercato','Injury':'Blessure','Report':'Info','Preview':'Avant-match','Review':'Débrief','Goal':'But','Win':'Victoire','Draw':'Match nul','Loss':'Défaite','Manager':'Entraîneur','Player':'Joueur','Team':'Équipe','Match':'Match','League':'Championnat','World Cup':'Coupe du Monde','Africa Cup':'CAN'}; Object.keys(d).forEach(k=>{ t=t.split(k).join(d[k]); }); return t; }
function renderNews(){
  if(REAL_NEWS.length===0){ document.getElementById('news-box').innerHTML='<div style="padding:12px; background:#fff; text-align:center">📰 Actus indisponibles pour le moment</div>'; return; }
  let n=REAL_NEWS[newsIndex]; let label=CURRENT_NEWS_LEAGUE?`📰 ACTUS • ${LEAGUES[CURRENT_NEWS_LEAGUE]} • En Français`:'📰 ACTUS FOOT • En Français 🇫🇷';
  document.getElementById('news-box').innerHTML=`<div class="news-header"><span>${label}</span><span>● ${REAL_NEWS.length} actus</span></div><div class="news-main" onclick="window.open('${n.link}','_blank')"><img src="${n.img}" onerror="this.src='https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=800&q=80'"><div class="news-text"><small>${n.cat}</small><b>${n.titre}</b><small style="color:#fff; opacity:0.8">Clique pour lire l'article →</small></div></div><div class="news-dots">${REAL_NEWS.map((_,i)=>`<span onclick="setNews(${i})" class="${i===newsIndex?'active':''}"></span>`).join('')}</div><div class="news-list">${REAL_NEWS.map((a,i)=>`<div class="news-mini ${i===newsIndex?'active':''}" onclick="setNews(${i})"><img src="${a.img}" onerror="this.style.display='none'"><p>${a.titre}</p></div>`).join('')}</div>`;
  clearInterval(newsInterval); newsInterval=setInterval(()=>{ newsIndex=(newsIndex+1)%REAL_NEWS.length; renderNews(); },4000);
}
function setNews(i){ newsIndex=i; renderNews(); }
function heureCotonou(d){ return new Date(d).toLocaleString('fr-FR',{timeZone:'Africa/Porto-Novo', hour:'2-digit', minute:'2-digit', day:'2-digit', month:'2-digit'})+' Cotonou'; }
function getMatchState(s){
  if(!s || !s.type) return {state:'PRE', minute:null, label:'Prévu', isLive:false, order:2};
  const stateRaw = String(s.type.state||'').toLowerCase();
  const detail = String(s.type.detail||'').toLowerCase();
  const short = String(s.type.shortDetail||'').toLowerCase();
  const clock = String(s.displayClock||'').toLowerCase();
  const combined = (stateRaw+' '+detail+' '+short+' '+clock);
  let m = combined.match(/(\d+)'/); let minute = m ? parseInt(m[1]) : null;
  const hasMinute = minute!==null && minute>0 && minute<=120;
  const isHT = combined.includes('ht') || combined.includes('half');
  const isFT = stateRaw==='post' || combined.includes('full time') || combined.includes('final');
  const isIn = stateRaw==='in' || combined.includes('live') || (hasMinute && !isFT);
  if(isHT) return {state:'HT', minute:45, label:'Mi-temps', isLive:true, order:1};
  if(isIn) return {state:'LIVE', minute:minute||0, label:minute?`LIVE ${minute}'`:'LIVE', isLive:true, order:0};
  if(isFT) return {state:'FT', minute:90, label:'Terminé', isLive:false, order:3};
  return {state:'PRE', minute:null, label:'Prévu', isLive:false, order:2};
}

    `https://api.allorigins.win/raw?url=${encodeURIComponent(`https://site.api.espn.com/apis/site/v2/sports/soccer/all/scoreboard?dates=${ds}&limit=1000`)}`
  ];
  for(let u of urls){
    try{ const r=await fetch(u); const j=await r.json(); if(j.events && j.events.length>0) return j.events; }catch(e){}
  }

async function fetchAllLeaguesFast(force=false){
  if(!force && CACHE.data && Date.now()-CACHE.time < 30000) return CACHE.data;
  const dbg=document.getElementById('debug'); if(dbg) dbg.innerText="=== DIAGNOSTIC ===\n";
  const today=new Date(); const dates=[]; for(let i=-7;i<=7;i++){ const d=new Date(today); d.setDate(today.getDate()+i); dates.push(fmtDate(d)); }
  // 15 requêtes seulement, pas 496
  const perDay = await Promise.all(dates.map(ds=>fetchAllDay(ds)));
  const seen=new Set(); let all=[];
  perDay.flat().forEach(e=>{
    if(!e || !e.id || seen.has(e.id)) return; seen.add(e.id);
    let slug = getLeagueSlugFromEvent(e);
    // On garde seulement nos ligues connues + on garde le nom réel pour l'affichage
    let finalSlug = LEAGUES[slug] ? slug : slug;
    all.push({...e, _lg: finalSlug, _lgName: getLeagueNameFromEvent(e)});
  });
  CACHE.data=all; CACHE.time=Date.now();
  const liveTotal = all.filter(m=>getMatchState(m.competitions[0].status).isLive).length;
  logDebug("Jours testés : "+dates.length+" | TOTAL : "+all.length+" matchs | LIVE : "+liveTotal);
  perDay.forEach((arr,idx)=>{ logDebug(dates[idx]+" : "+arr.length+" matchs"); });
  const tabCount=document.getElementById('live-count-tab'); if(tabCount) tabCount.innerText = liveTotal>0 ? `(${liveTotal})` : '';
  return all;
}
async function fetchLeague(lg){
  // Pour UNE ligue : 1 seule requête avec range, pas 16
  const today=new Date(); const d1=new Date(today); d1.setDate(today.getDate()-7); const d2=new Date(today); d2.setDate(today.getDate()+7);
  const urls=[
    `https://site.api.espn.com/apis/site/v2/sports/soccer/${lg}/scoreboard?dates=${fmtDate(d1)}-${fmtDate(d2)}&limit=1000`,
    `https://site.api.espn.com/apis/site/v2/sports/soccer/${lg}/scoreboard?limit=1000`,
    `https://api.allorigins.win/raw?url=${encodeURIComponent(`https://site.api.espn.com/apis/site/v2/sports/soccer/${lg}/scoreboard?dates=${fmtDate(d1)}-${fmtDate(d2)}&limit=1000`)}`
  ];
  for(let u of urls){
    try{ const r=await fetch(u); const j=await r.json(); if(j.events && j.events.length>0) return j.events.map(e=>({...e,_lg:lg})); }catch(e){}
  }
  // Dernier secours : on filtre le cache global
  if(allMatchesCache.length>0) return allMatchesCache.filter(m=>m._lg===lg);
  return [];
}
function renderCard(g){

  const ms=getMatchState(st);

  let timerText=ms.state==='LIVE'?`⏱️ <span class="live-minute" data-start="${ms.minute||0}">${ms.minute||0}'</span>`: ms.state==='HT'?`Mi-temps`: ms.state==='FT'?`Terminé`: heureCotonou(g.date);
  let progressW=ms.minute? (ms.minute/90)*100 : ms.state==='HT'?50: ms.state==='FT'?100:0;
  let extraClass = ms.isLive ? ' live-pulse' : '';
  return `<div class="card${extraClass}" id="match-${g.id}" onclick="openDetail('${g.id}','${g._lg}')" style="border-left:6px solid ${ms.state==='LIVE'?'red':ms.state==='HT'?'orange':ms.state==='FT'?'#777':'#0a3d8f'}"><div class="card-top"><div style="display:flex; align-items:center; gap:8px; flex:1;"><div class="team"><img referrerpolicy="no-referrer" src="${getLogo(a.team)}" onerror="this.style.display='none'"><br>${a.team.abbreviation||''}</div><div style="flex:1; font-size:13px;"><div style="display:flex; justify-content:space-between"><span>${a.team.shortDisplayName}</span><b id="score-a-${g.id}">${a.score||0}</b></div><div style="display:flex; justify-content:space-between"><span>${h.team.shortDisplayName}</span><b id="score-h-${g.id}">${h.score||0}</b></div><small id="time-${g.id}" style="color:${ms.state==='LIVE'?'red':'#444'}; font-weight:bold">${timerText}</small></div><div class="team"><img referrerpolicy="no-referrer" src="${getLogo(h.team)}" onerror="this.style.display='none'"><br>${h.team.abbreviation||''}</div></div><div style="text-align:right; min-width:88px"><span id="badge-${g.id}" class="badge ${badgeClass}">${ms.label}</span></div></div><div class="progress"><div id="prog-${g.id}" class="progress-fill" style="width:${progressW}%; background:${ms.state==='HT'?'orange':ms.state==='LIVE'?'red':'#999'}"></div></div></div>`;

function triPro(list){
  return [...list].sort((a,b)=>{ const ma=getMatchState(a.competitions[0].status), mb=getMatchState(b.competitions[0].status); if(ma.order!==mb.order) return ma.order-mb.order; return new Date(a.date)-new Date(b.date); });
}
async function loadAll(btn){
  if(btn){ document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); }
  fetchRealNews(null);
  document.getElementById('box').innerHTML='⏳ Chargement PRO (15 requêtes)...';
  const dbg=document.getElementById('debug'); if(dbg) dbg.innerText="";
  let all=await fetchAllLeaguesFast(true); allMatchesCache=all;
  if(all.length===0){

function afficherTous(all){
  const box=document.getElementById('box');
  const liveCount=all.filter(m=>getMatchState(m.competitions[0].status).isLive).length;
  document.getElementById('live-info').innerText=`${all.length} matchs - 🔴 ${liveCount} LIVE`;
  document.getElementById('clock').innerText=new Date().toLocaleTimeString('fr-FR',{timeZone:'Africa/Porto-Novo', hour:'2-digit', minute:'2-digit'})+' Cotonou';
  const tabCount=document.getElementById('live-count-tab'); if(tabCount) tabCount.innerText = liveCount>0 ? `(${liveCount})` : '';
  let html='', grouped={};
  all.forEach(m=>{ if(!grouped[m._lg]) grouped[m._lg]=[]; grouped[m._lg].push(m); });
  // On affiche d'abord nos ligues prioritaires, puis les autres ligues trouvées dans /all
  const ordered=[...PRIORITY, ...Object.keys(grouped).filter(l=>!PRIORITY.includes(l))];
  for(let lg of ordered){
    if(!grouped[lg]) continue;
    let list=triPro(grouped[lg]);
    const lc=list.filter(m=>getMatchState(m.competitions[0].status).isLive).length;
    let shown=list.slice(0,LIMIT_PAR_LIGUE);
    let extra=''; if(list.length>LIMIT_PAR_LIGUE){ extra=`<div class="voir-tout" onclick="document.querySelector('[data-lg=&quot;${lg}&quot;]').click(); window.scrollTo({top:0,behavior:'smooth'})">Voir les ${list.length} matchs de ${LEAGUES[lg]||lg} →</div>`; }
    let title = LEAGUES[lg] || ('⚽ '+ (grouped[lg][0]._lgName || lg));
    html+=`<div class="league-title"><span>${title}</span><span>${lc>0?`🔴 ${lc} LIVE - `:''}${shown.length} / ${list.length}</span></div>`+shown.map(x=>renderCard(x)).join('')+extra;
  }
  box.innerHTML=html || '<div style="background:#ffc;padding:20px;text-align:center">Aucun match</div>'; startMinuteTicker();
}
