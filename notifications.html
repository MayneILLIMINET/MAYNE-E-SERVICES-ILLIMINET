  var ANDROID_BRIDGE_NAME = '_MetaPlayablesBridge';
  var RAF_FRAME_THRESHOLD = 3;

  var gameReadySent = false;
  var firstInteractionSent = false;
  var errorSent = false;
  var frameCount = 0;
  var originalRAF = window.requestAnimationFrame;

  // --- Transport Layer ---

  function hasIOSBridge() {
    return !!(window.webkit &&
              window.webkit.messageHandlers &&
              window.webkit.messageHandlers[HANDLER_NAME]);

              typeof window[ANDROID_BRIDGE_NAME].postEvent === 'function');
  }

  function isInIframe() {
    return !!(window.parent && window.parent !== window);
  }

  function sendEvent(eventName, payload) {

      type: eventName,
      payload: payload || {},
      timestamp: Date.now()
    };

    if (hasIOSBridge()) {
      try {
        window.webkit.messageHandlers[HANDLER_NAME].postMessage(message);
      } catch (e) { /* ignore */ }

        eventName,
        JSON.stringify(p)

    } catch (e) { /* ignore */ }
    return;
  }

    if (isInIframe()) {
      try {
        window.parent.postMessage(message, '*');
      } catch (e) { /* ignore */ }
      return;
    }
  }

  // --- rAF Game-Ready Detection ---

  function onFrame() {
    if (gameReadySent) return;

    frameCount++;
    if (frameCount >= RAF_FRAME_THRESHOLD) {
      gameReadySent = true;
      sendEvent('game_ready', {
        frame_count: frameCount,
        detected_at: Date.now()

    originalRAF.call(window, onFrame);

      message: event.message || 'Unknown error',

    error: function(message) {

      errorSent = true;

        message: message || 'Unknown error',
        auto_captured: false

    sendEvent: function(eventName, payload) {

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
html,body{overflow-x:hidden}
body{background:#500;display:flex;justify-content:center}
.app{max-width:430px;width:100%;min-height:100vh;background:#fdf6ec;padding-bottom:110px}
.head{padding:16px;display:flex;align-items:center;justify-content:space-between;background:#500;color:#fff;position:sticky;top:0;z-index:10}
.back{width:44px;height:44px;background:#fff;color:#000;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:bold}
.toolbar{display:flex;gap:6px;padding:8px 12px;background:#fff;position:sticky;top:68px;z-index:9;border-bottom:1px solid #eee;align-items:center;flex-wrap:wrap}
.tool-btn{padding:8px 10px;border-radius:20px;border:1px solid #ddd;background:#f5f5f5;font-size:12px;font-weight:700;cursor:pointer}
.tool-btn.active{background:#500;color:#fff;border-color:#500}
.tool-btn.danger{background:#ff3b30;color:#fff;border-color:#ff3b30}
.tool-btn:disabled{opacity:.4}
.notif{display:flex;gap:10px;padding:12px 12px;background:#fff;margin:8px 12px;border-radius:14px;box-shadow:0 2px 6px rgba(0,0,0,.05);cursor:pointer;position:relative;align-items:center}
.notif.unread{border-left:4px solid #ff5000;background:#fff8f0}
.ico{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.ico.green{background:#d6f78c}.ico.red{background:#ffcccc}.ico.blue{background:#cce5ff}.ico.yellow{background:#fff3cd}
.dot{width:8px;height:8px;background:#ff0000;border-radius:50%;position:absolute;top:12px;right:12px}
.cb{width:18px;height:18px;flex-shrink:0}
.date-group{padding:8px 16px;font-size:11px;font-weight:800;color:#888;text-transform:uppercase;margin-top:4px;display:flex;justify-content:space-between}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:430px;width:100%;background:#000;display:flex;justify-content:space-around;padding:10px 0;z-index:5}
.bnav{border:none;background:none;color:#fff;font-size:11px;cursor:pointer}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:99;padding:20px}
.box{background:#fff;border-radius:20px;padding:20px;width:calc(100% - 32px);max-width:360px;max-height:85vh;overflow:auto;box-sizing:border-box}
.btn{width:100%;background:#0f3d2e;color:#fff;border:none;border-radius:100px;padding:14px;font-weight:800;margin-top:10px;cursor:pointer}
.btn-red{background:#ff3b30}

<body>
<div class="app">
<div class="head"><div class="back" onclick="location.href='index.html'">‹</div><b id="title-count">Notifications</b><div class="back" onclick="location.reload()">↻</div></div>

<div class="toolbar">
  <label style="display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700"><input id="checkAll" type="checkbox" onchange="toggleAll(this)"> Tout</label>
  <button class="tool-btn" onclick="marquerToutLu()">✓ Tout lu</button>
  <button class="tool-btn danger" id="btnDelSel" onclick="supprimerSelection()" disabled>🗑️ Supprimer (<span id="selCount">0</span>)</button>
  <button class="tool-btn danger" onclick="toutSupprimer()">🗑️ Tout supprimer</button>
</div>

<div id="notif-list"></div>
</div>
<div class="bottom"><button class="bnav" onclick="location.href='index.html'">🔙ACCUEIL</button><button class="bnav" onclick="marquerToutLu()">✓ TOUT LU</button><button class="bnav" onclick="location.href='compte.html'">INFOS👤</button></div>

<div id="detail" class="overlay" onclick="if(event.target===this)closeDetail()"><div class="box">
<div id="d-icon" style="font-size:36px;margin-bottom:8px"></div>
<h3 id="d-title"></h3>
<p id="d-date" style="font-size:11px;color:#888;margin:6px 0"></p>
<p id="d-msg" style="font-size:14px;margin:12px 0;text-align:left;line-height:1.4;word-break:break-word"></p>
<b id="d-mont" style="font-size:18px;color:#0f3d2e"></b>
<button class="btn" onclick="closeDetail()">Fermer</button>
<button class="btn btn-red" onclick="supprimerNotif()">🗑️ Supprimer</button>
</div></div>

<script>
let uid=null, allNotifs=[], currentOpenId=null;
let selected = new Set();

function getReadKey(){ return 'mayne_notif_read_'+uid; }
function getDelKey(){ return 'mayne_notif_del_'+uid; }
function getReadIds(){ try{return JSON.parse(localStorage.getItem(getReadKey())||'[]')}catch(e){return[]} }
function getDelIds(){ try{return JSON.parse(localStorage.getItem(getDelKey())||'[]')}catch(e){return[]} }

function parseFRDate(str){
  if(!str) return Date.now();
  let t=Date.parse(str); if(!isNaN(t)) return t;
  try{
    const [dPart,timePart]=str.split(' ');
    if(dPart && dPart.includes('/')){
      const [d,m,y]=dPart.split('/').map(Number);
      let h=0,mi=0,s=0;
      if(timePart){ const tp=timePart.split(':'); h=+tp[0]||0; mi=+tp[1]||0; s=+tp[2]||0; }
      return new Date(y,m-1,d,h,mi,s).getTime();
    }
  }catch(e){}
  return Date.now();
}
function pushNotif(obj){
  if(getDelIds().includes(obj.id)) return;
  const idx=allNotifs.findIndex(n=>n.id===obj.id);
  if(idx>=0) allNotifs[idx]=obj; else allNotifs.push(obj);
  render();
  updateBadge();
}
function formatGroup(ts){
  const d=new Date(ts); const now=new Date();
  if(d.toDateString()===now.toDateString()) return "Aujourd'hui";
  const yest=new Date(); yest.setDate(now.getDate()-1);
  if(d.toDateString()===yest.toDateString()) return "Hier";
  return d.toLocaleDateString('fr-FR');
}
function render(){
  allNotifs.sort((a,b)=> (b.ts||0) - (a.ts||0));
  const c=document.getElementById('notif-list');
  const readIds=getReadIds();
  const delIds=getDelIds();
  let h='', lastGroup='';
  let visible=0;
  allNotifs.forEach(v=>{
    if(delIds.includes(v.id)) return;
    visible++;
    const group=formatGroup(v.ts);
    if(group!==lastGroup){ h+=`<div class="date-group"><span>${group}</span></div>`; lastGroup=group; }
    const unread=!readIds.includes(v.id);
    const isSel=selected.has(v.id);
    h+=`<div class="notif ${unread?'unread':''}" >
      <input type="checkbox" class="cb" ${isSel?'checked':''} onclick="event.stopPropagation();toggleSel('${v.id}',this.checked)">
      <div class="ico ${v.color}">${v.icon}</div>
      <div style="flex:1;min-width:0" onclick="openNotif('${v.id}')">
        <div style="display:flex;justify-content:space-between;gap:8px"><b style="font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${v.titre}</b><small style="color:#999;font-size:10px">${v.date||''}</small></div>
        <p style="font-size:13px;margin-top:4px;color:#444;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${v.message}</p>
        ${v.montant?`<b style="font-size:12px;color:#0f3d2e">${v.montant} XOF</b>`:''}
      </div>${unread?'<div class="dot"></div>':''}
    </div>`;
  });
  c.innerHTML=h||'<div style="text-align:center;padding:40px;color:#888">Aucune notification</div>';
  document.getElementById('title-count').innerText = visible? `Notifications (${visible})` : 'Notifications';
  updateToolbar();
}
function updateToolbar(){
  document.getElementById('selCount').innerText=selected.size;
  document.getElementById('btnDelSel').disabled=selected.size===0;
  const allVisible = allNotifs.filter(n=>!getDelIds().includes(n.id)).map(n=>n.id);
  const checkAll=document.getElementById('checkAll');
  if(checkAll){
    checkAll.checked = allVisible.length>0 && allVisible.every(id=>selected.has(id));
    checkAll.indeterminate = selected.size>0 && selected.size < allVisible.length;
  }
}
function toggleSel(id, checked){
  if(checked) selected.add(id); else selected.delete(id);
  updateToolbar();
  document.getElementById('selCount').innerText=selected.size;
  document.getElementById('btnDelSel').disabled=selected.size===0;
}
function toggleAll(el){
  const allVisible = allNotifs.filter(n=>!getDelIds().includes(n.id)).map(n=>n.id);
  if(el.checked){ allVisible.forEach(id=>selected.add(id)); }
  else { selected.clear(); }
  render(); updateToolbar(); updateBadge();
}

function updateBadge(){
  const read=getReadIds();
  const del=getDelIds();
  const unread=allNotifs.filter(n=>!read.includes(n.id) && !del.includes(n.id)).length;
  localStorage.setItem('mayne_notif_unread', unread);
  localStorage.setItem('mayne_notif_unread_'+uid, unread);
  localStorage.setItem('mayne_notif_total_'+uid, allNotifs.filter(n=>!del.includes(n.id)).length);
}

function openNotif(id){
  const v=allNotifs.find(n=>n.id===id); if(!v) return;
  currentOpenId=id;
  document.getElementById('d-icon').textContent=v.icon;
  document.getElementById('d-title').textContent=v.titre;
  document.getElementById('d-date').textContent=v.date;
  document.getElementById('d-msg').textContent=v.message;
  document.getElementById('d-mont').textContent=v.montant? v.montant+' XOF' : '';
  document.getElementById('detail').style.display='flex';
  document.body.style.overflow='hidden';
  let read=getReadIds();
  if(!read.includes(id)){ read.push(id); localStorage.setItem(getReadKey(), JSON.stringify(read)); }
  render(); updateBadge();
}
function closeDetail(){document.getElementById('detail').style.display='none'; document.body.style.overflow='';}
function supprimerNotif(){
  if(!currentOpenId) return;
  doDelete([currentOpenId]);
  closeDetail();
}
function doDelete(ids){
  let del=getDelIds();
  ids.forEach(id=>{
    if(!del.includes(id)) del.push(id);
    if(id.startsWith('not_')){
      db.ref('notifications/'+uid+'/'+id.replace('not_','')).remove();
    }
  });
  localStorage.setItem(getDelKey(), JSON.stringify(del));
  allNotifs=allNotifs.filter(n=>!ids.includes(n.id));
  ids.forEach(id=>selected.delete(id));
  render(); updateBadge();
}
function supprimerSelection(){
  if(selected.size===0) return;
  if(!confirm('Supprimer '+selected.size+' notification(s) ?')) return;
  doDelete(Array.from(selected));
}
function toutSupprimer(){
  const visible=allNotifs.filter(n=>!getDelIds().includes(n.id));
  if(visible.length===0) return;
  if(!confirm('Tout supprimer ? Cette action supprime toutes tes notifications de Firebase.')) return;
  doDelete(visible.map(n=>n.id));
}
function marquerToutLu(){
  const visible=allNotifs.filter(n=>!getDelIds().includes(n.id)).map(n=>n.id);
  localStorage.setItem(getReadKey(), JSON.stringify([...new Set([...getReadIds(), ...visible])]));
  render(); updateBadge();
}

async function init(){
  const u=JSON.parse(localStorage.getItem('mayne_current_user')||'null');
  if(!u||!u.phone) return;
  uid=(u.phone||'').replace(/[^0-9]/g,'');
  db.ref('epargne/'+uid).on('value',snap=>{ snap.forEach(ch=>{ const v=ch.val(); const isRetrait=v.type==='Retrait'||(v.montant||0)<0; pushNotif({id:'ep_'+ch.key, titre:isRetrait?'Retrait epargne':'Placement '+(v.nom||''), message:isRetrait?`Retrait de ${Math.abs(v.montantCollecte||v.montant)} XOF`:`Depot ${v.montantCollecte||v.montant} XOF`, date:v.date||'', ts:parseFRDate(v.date), icon:isRetrait?'↓':'↑', color:isRetrait?'red':'green', montant:v.montantCollecte||v.montant}); }); });
  db.ref('security_logs/'+uid).on('value',snap=>{ snap.forEach(ch=>{ const v=ch.val(); pushNotif({id:'sec_'+ch.key, titre:v.titre||'Securite', message:v.message||'', date:v.date||'', ts:parseFRDate(v.date), icon:'🔒', color:'blue'}); }); });
  db.ref('notifications/'+uid).on('value',snap=>{ snap.forEach(ch=>{ const v=ch.val(); pushNotif({id:'not_'+ch.key, titre:v.titre||'Info', message:v.message||'', date:v.date||'', ts:parseFRDate(v.date)||v.createdAt||Date.now(), icon:'🔔', color:'yellow'}); }); });
  db.ref('transactions/'+uid).limitToLast(50).on('value',snap=>{ snap.forEach(ch=>{ const v=ch.val(); pushNotif({id:'tr_'+ch.key, titre:v.titre||v.type||'Commande', message:v.message||'', date:v.date||'', ts:parseFRDate(v.date), icon:'🛒', color:'blue', montant:v.montant||''}); }); });
}
firebase.auth().onAuthStateChanged(function(user){
  if(user){ init(); } 
  else { firebase.auth().signInAnonymously(); }
});
</script>
