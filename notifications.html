<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Notifications - MAYNE</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script>
const cfg={apiKey:"AIzaSyDR0zDiGxisp4G-CDjltu8VFmxMMFjXI9E",authDomain:"mayneilliminetdb.firebaseapp.com",databaseURL:"https://mayneilliminetdb-default-rtdb.firebaseio.com",projectId:"mayneilliminetdb"};
if(!firebase.apps.length)firebase.initializeApp(cfg);
const db=firebase.database();
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#500;display:flex;justify-content:center}
.app{max-width:430px;width:100%;min-height:100vh;background:#fdf6ec;padding-bottom:90px}
.head{padding:16px;display:flex;align-items:center;justify-content:space-between;background:#500;color:#fff;position:sticky;top:0;z-index:5}
.back{width:44px;height:44px;background:#fff;color:#000;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:bold}
.notif{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid #f0e9d8;background:#fff;margin:8px 12px;border-radius:14px;box-shadow:0 2px 6px rgba(0,0,0,.05);cursor:pointer;position:relative}
.notif.unread{border-left:4px solid #ff5000}
.ico{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.ico.green{background:#d6f78c} .ico.red{background:#ffcccc} .ico.blue{background:#cce5ff} .ico.yellow{background:#fff3cd}
.dot{width:8px;height:8px;background:#ff0000;border-radius:50%;position:absolute;top:12px;right:12px}
.date-group{padding:8px 16px;font-size:12px;font-weight:800;color:#888;text-transform:uppercase;margin-top:8px}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:430px;width:100%;background:#000;display:flex;justify-content:space-around;padding:10px 0;z-index:5}
.bnav{border:none;background:none;color:#fff;font-size:11px;cursor:pointer}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:99;padding:16px}
.box{background:#fff;border-radius:20px;padding:20px;max-width:380px;width:100%;text-align:center}
.btn{width:100%;background:#0f3d2e;color:#fff;border:none;border-radius:100px;padding:12px;font-weight:800;margin-top:12px;cursor:pointer}
</style>
</head>
<body>
<div class="app">
<div class="head"><div class="back" onclick="location.href='epargne.html'">‹</div><b>Notifications</b><div class="back" onclick="location.reload()">↻</div></div>
<div id="notif-list"></div>
</div>
<div class="bottom"><button class="bnav" onclick="location.href='index.html'">🏠 ACCUEIL</button><button class="bnav" onclick="location.href='epargne.html'">EPARGNE⭐</button><button class="bnav" onclick="location.href='compte.html'">INFOS👤</button></div>

<div id="detail" class="overlay" onclick="if(event.target===this)closeDetail()"><div class="box">
<div id="d-icon" style="font-size:40px;margin-bottom:10px"></div>
<h3 id="d-title"></h3>
<p id="d-date" style="font-size:12px;color:#888;margin:6px 0"></p>
<p id="d-msg" style="font-size:14px;margin:12px 0;text-align:left;white-space:pre-wrap"></p>
<b id="d-mont" style="font-size:18px;color:#0f3d2e"></b>
<button class="btn" onclick="closeDetail()">Fermer</button>
</div></div>

<script>
let uid=null;
let allNotifs=[];
let readIds = JSON.parse(localStorage.getItem('mayne_notif_read')||'[]');

function pushNotif(obj){
  // evite doublons
  if(!allNotifs.find(n=>n.id===obj.id)){
    allNotifs.push(obj);
    render();
  }
}
function formatGroup(dateStr){
  const d=new Date(dateStr);
  const now=new Date();
  if(d.toDateString()===now.toDateString()) return "Aujourd'hui";
  const yest=new Date(); yest.setDate(now.getDate()-1);
  if(d.toDateString()===yest.toDateString()) return "Hier";
  return d.toLocaleDateString('fr-FR');
}
function render(){
  allNotifs.sort((a,b)=> (b.ts||0) - (a.ts||0));
  const c=document.getElementById('notif-list');
  let h=''; let lastGroup='';
  allNotifs.forEach((v,i)=>{
    const group=formatGroup(v.ts);
    if(group!==lastGroup){ h+=`<div class="date-group">${group}</div>`; lastGroup=group; }
    const unread = !readIds.includes(v.id);
    h+=`<div class="notif ${unread?'unread':''}" onclick="openNotif(${i})">
      <div class="ico ${v.color}">${v.icon}</div>
      <div style="flex:1"><div style="display:flex;justify-content:space-between"><b style="font-size:14px">${v.titre}</b><small style="color:#999;font-size:11px">${v.date||''}</small></div>
      <p style="font-size:13px;margin-top:4px;color:#444;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${v.message}</p>
      ${v.montant?`<b style="font-size:12px;color:#0f3d2e">${v.montant} XOF</b>`:''}
      </div>${unread?'<div class="dot"></div>':''}
    </div>`;
  });
  if(!h) h='<div style="text-align:center;padding:40px;color:#888">Aucune notification</div>';
  c.innerHTML=h;
}
function openNotif(idx){
  const v=allNotifs[idx];
  if(!v) return;
  document.getElementById('d-icon').textContent=v.icon;
  document.getElementById('d-icon').className=''; 
  document.getElementById('d-title').textContent=v.titre;
  document.getElementById('d-date').textContent=v.date;
  document.getElementById('d-msg').textContent=v.message;
  document.getElementById('d-mont').textContent=v.montant? v.montant+' XOF' : '';
  document.getElementById('detail').style.display='flex';
  // marquer lu
  if(!readIds.includes(v.id)){ readIds.push(v.id); localStorage.setItem('mayne_notif_read', JSON.stringify(readIds)); render(); }
}
function closeDetail(){document.getElementById('detail').style.display='none';}

async function init(){
  const u=JSON.parse(localStorage.getItem('mayne_current_user')||'null');
  if(!u||!u.phone) return;
  uid=(u.phone||'').replace(/[^0-9]/g,'');

  db.ref('epargne/'+uid).on('value',snap=>{
    if(!snap.exists())return;
    snap.forEach(ch=>{
      const v=ch.val(); const key=ch.key;
      const isRetrait = v.type==='Retrait' || (v.montant||0)<0;
      pushNotif({
        id:'ep_'+key,
        titre: isRetrait? 'Retrait epargne' : 'Placement '+ (v.nom||''),
        message: isRetrait? `Retrait de ${Math.abs(v.montantCollecte||v.montant)} XOF vers Principal ${v.penalite?' - penalite '+v.penalite+'F':''}` : `Depot ${v.montantCollecte||v.montant} XOF - ${v.frequence||''} ${v.bloque?' - Bloquee jusqu au '+v.echeance:''} - ${v.rythme||''}`,
        date: v.date||'',
        ts: new Date(v.date||v.echeance||Date.now()).getTime(),
        icon: isRetrait?'↓':'↑',
        color: isRetrait?'red':'green',
        montant: v.montantCollecte||v.montant
      });
    });
  });

  db.ref('security_logs/'+uid).on('value',snap=>{
    if(!snap.exists())return;
    snap.forEach(ch=>{
      const v=ch.val();
      pushNotif({id:'sec_'+ch.key, titre:v.titre||'Securite', message:v.message||'', date:v.date||'', ts:new Date(v.date||Date.now()).getTime(), icon:'🔒', color:'blue'});
    });
  });

  db.ref('notifications/'+uid).on('value',snap=>{
    if(!snap.exists())return;
    snap.forEach(ch=>{
      const v=ch.val();
      pushNotif({id:'not_'+ch.key, titre:v.titre||'Info', message:v.message||'', date:v.date||'', ts:new Date(v.date||Date.now()).getTime(), icon:'🔔', color:'yellow'});
    });
  });

  db.ref('transactions/'+uid).limitToLast(50).on('value',snap=>{
    if(!snap.exists())return;
    snap.forEach(ch=>{
      const v=ch.val();
      pushNotif({id:'tr_'+ch.key, titre:v.titre||v.type||'Commande', message:v.message||`${v.type||'Operation'} - ${v.statut||''}`, date:v.date||'', ts:new Date(v.date||Date.now()).getTime(), icon:'🛒', color:'blue', montant:v.montant||''});
    });
  });
}
window.onload=init;
</script>
</body>
</html>
