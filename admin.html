<!DOCTYPE html>
<html lang="fr">
<head><style>

  font-family: "Optimistic";
  font-style: normal;

<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADMIN USERS PRO - MAYNE</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
body{background:#111;color:#fff;font-family:system-ui;display:flex;justify-content:center;margin:0}
.app{max-width:850px;width:100%;min-height:100vh;background:#1e1e1e;border:5px solid #ff5000}
.top{padding:10px;background:#000;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5;gap:8px;flex-wrap:wrap}
.top-left{display:flex;gap:8px;align-items:center}
.btn-retour{background:#fff;color:#000;padding:6px 12px;border-radius:20px;font-size:11px;font-weight:900;text-decoration:none}
.btn-admin{background:#ff5000;color:#fff;padding:6px 12px;border-radius:20px;font-size:11px;font-weight:900;text-decoration:none}
.input{width:calc(100% - 16px);background:#000;color:#fff;padding:10px;border:1px solid #555;border-radius:8px;margin:8px 8px}
table{width:100%;border-collapse:collapse;font-size:11px}
th,td{border:1px solid #333;padding:5px;text-align:left}
th{background:#ff5000;position:sticky;top:50px;z-index:2}
tr{cursor:pointer} tr:hover{background:#2a2a2a}
.btn{background:#2b8a3e;color:#fff;border:none;padding:5px 8px;border-radius:4px;font-weight:bold;cursor:pointer;font-size:10px}
.btn-del{background:#dc3545}
.btn-blue{background:#0d6efd}
.btn-orange{background:#ff9800;color:#000}
.btn-dark{background:#333;color:#fff;border:1px solid #555}
/* MODAL */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:999;padding:10px;overflow-y:auto}
#modal-box{background:#1e1e1e;border:2px solid #ff5000;border-radius:14px;width:100%;max-width:460px;padding:14px;max-height:90vh;overflow-y:auto}
#modal-box h3{margin:0 0 10px 0;color:#ff5000;font-size:14px}
.row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #333;font-size:12px;gap:10px}
.badge{padding:2px 8px;border-radius:10px;font-size:10px;font-weight:900}
.badge-ok{background:#28a745;color:#fff}.badge-no{background:#dc3545;color:#fff}.badge-wait{background:#ffeb3b;color:#000}
#modal-img{width:100%;max-height:260px;object-fit:contain;background:#000;border-radius:8px;margin-top:10px;display:none;border:1px solid #444}
.btns{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.btn-big{padding:10px;border:none;border-radius:8px;font-weight:900;cursor:pointer;font-size:11px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px;background:#000;margin:0 8px;border-radius:8px}
.sval{font-weight:900;color:#0f0;font-size:13px}
.slab{font-size:8px;color:#aaa}
</style>
</head>
<body>
<div class="app">
<div class="top">
  <div class="top-left">
    <a href="admin.html" class="btn-retour">← RETOUR ADMIN</a>
    <a href="index.html" class="btn-admin" style="background:#333;color:#fff;border:1px solid #555">🏠 ACCUEIL</a>
  </div>
  <b style="color:#ffeb3b">👥 USERS PRO</b>
  <span id="cu" style="background:#000;padding:4px 8px;border-radius:10px;font-size:11px"></span>
</div>

<div class="stats">
  <div><div class="sval" id="stTot">0</div><div class="slab">TOTAL USERS</div></div>
  <div><div class="sval" id="stSolde" style="color:#0f0">0</div><div class="slab">SOLDE TOTAL</div></div>
  <div><div class="sval" id="stKyc" style="color:#ff9800">0</div><div class="slab">KYC ATTENTE</div></div>
  <div><div class="sval" id="stEmail" style="color:#dc3545">0</div><div class="slab">EMAIL NON VERIF</div></div>
</div>

<input id="s-user" class="input" placeholder="🔍 nom / num / email / parrain..." oninput="filtrer()">

<table><thead><tr><th>Nom / Email</th><th>Num</th><th>Solde</th><th>Com</th><th>Epargne</th><th>Gain</th><th>💾</th></tr></thead><tbody id="tbody"></tbody></table>
</div>

<!-- MODAL DETAIL USER PRO -->
<div id="modal" onclick="if(event.target==this) closeModal()">
  <div id="modal-box">
    <h3 id="m-title">Détail Utilisateur</h3>
    <div id="m-content"></div>
    <img id="modal-img">
    <div id="m-kyc-actions" style="margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:6px">
      <button class="btn-big" style="background:#28a745;color:#fff" onclick="verifyEmail(true)">✅ Vérifier Email Manuel</button>
      <button class="btn-big" style="background:#dc3545;color:#fff" onclick="verifyEmail(false)">❌ Dé-vérifier Email</button>
      <button class="btn-big" style="background:#0d6efd;color:#fff" onclick="verifyKYC(true)">🪪 Valider KYC</button>
      <button class="btn-big" style="background:#ff9800;color:#000" onclick="verifyKYC(false)">🪪 Rejeter KYC</button>
      <button class="btn-big" style="background:#333;color:#fff;border:1px solid #555" onclick="editSoldes()">💰 Modifier Soldes</button>
      <button class="btn-big" style="background:#000;color:#f00;border:1px solid #f00" onclick="deleteUser()">🗑️ Supprimer User</button>
    </div>
    <div class="btns" style="margin-top:10px">
      <button class="btn-big" style="background:#333;color:#fff" onclick="closeModal()">Fermer</button>
      <button class="btn-big" style="background:#ff5000;color:#fff" onclick="openNotif()">🔔 Notifier User</button>
    </div>
  </div>
</div>

<script>
const firebaseConfig={apiKey:"AIzaSyDR0zDiGxisp4G-CDjltu8VFmxMMFjXI9E",authDomain:"mayneilliminetdb.firebaseapp.com",databaseURL:"https://mayneilliminetdb-default-rtdb.firebaseio.com",projectId:"mayneilliminetdb",storageBucket:"mayneilliminetdb.appspot.com",messagingSenderId:"904857888891",appId:"1:904857888891:web:a89e339ea89de0340a5ade"};
if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
var db=firebase.database(),all=[],ADMIN_LIST=["0158612131","2290158612131","158612131","229158612131"];
let currentKey=null, currentData=null;

function getPhone(){
  try{
    let p = JSON.parse(localStorage.getItem('mayne_current_user')||'{}')?.phone;
    if(p) return p;
    p = JSON.parse(localStorage.getItem('mayne_'+'current_user')||'{}')?.phone;
    if(p) return p;
  }catch(e){} return null;
}
function isAdmin(phone){
  if(!phone) return false;
  const c=phone.replace(/\D/g,'');
  return ADMIN_LIST.some(a=> c.endsWith(a.replace(/\D/g,'').slice(-8)) || c===a.replace(/\D/g,''));
}
function init(){
  const phone=getPhone();
  if(!phone){ document.body.innerHTML='<div style="padding:20px;text-align:center">⛔ Non connecté<br><a href="index.html" style="color:#ff5000">Aller à l accueil</a></div>'; return; }
  if(!isAdmin(phone)){ document.body.innerHTML='⛔ Accès admin seulement 0158612131 - Ton num: '+phone; return; }
  db.ref('clients').on('value',s=>{
    all=[]; 
    let totS=0, kycWait=0, emailNo=0;
    s.forEach(c=>{
      let v=c.val(); 
      all.push({key:c.key, data:v, nom:v.nom||'',solde:v.solde||0,commission:v.commission||0,recompense:v.recompense||0,gain_parrainage:v.gain_parrainage||0,parrain:v.parrain||'', email:v.email||'', kyc:v.kyc||{}});
      totS+= (v.solde||0);
      if(!v.kyc_verified && (v.kyc||v.cni_url||v.kyc_docs)) kycWait++;
      else if(v.kyc && (v.kyc.statut==='en_attente' || v.kyc.statut==='attente')) kycWait++;
      if(!v.email_verified && !v.email_verifie) emailNo++;
    });
    document.getElementById('cu').innerText=all.length+' users';
    document.getElementById('stTot').innerText=all.length;
    document.getElementById('stSolde').innerText=totS.toLocaleString()+' F';
    document.getElementById('stKyc').innerText=kycWait;
    document.getElementById('stEmail').innerText=emailNo;
    render(all);
  });
}

function render(l){
  let tb=document.getElementById('tbody');tb.innerHTML='';
  l.slice(0,500).forEach(u=>{
    let kycBadge = u.data.kyc_verified ? '✅' : (u.data.kyc?.statut==='en_attente' ? '⏳' : '❌');
    let emailBadge = (u.data.email_verified||u.data.email_verifie) ? '✅' : '❌';
    let tr=document.createElement('tr');
    tr.innerHTML=`<td onclick="openUser('${u.key}')" style="cursor:pointer"><b>${u.nom}</b> ${kycBadge} ${emailBadge}<br><small style="color:#ffeb3b">${u.parrain}</small><br><small style="color:#aaa">${u.email.slice(0,22)}</small></td>
    <td onclick="openUser('${u.key}')" style="cursor:pointer">${u.key}</td>
    <td><input id="s-${u.key}" type="number" value="${u.solde}" style="width:65px;background:#000;color:#0f0;border:1px solid #333;border-radius:4px;padding:3px" onclick="event.stopPropagation()"></td>
    <td><input id="c-${u.key}" type="number" value="${u.commission}" style="width:60px;background:#000;color:#ffeb3b;border:1px solid #333;border-radius:4px;padding:3px" onclick="event.stopPropagation()"></td>
    <td><input id="r-${u.key}" type="number" value="${u.recompense}" style="width:60px;background:#000;color:#f0f;border:1px solid #333;border-radius:4px;padding:3px" onclick="event.stopPropagation()"></td>
    <td><input id="g-${u.key}" type="number" value="${u.gain_parrainage}" style="width:55px;background:#000;color:#0ff;border:1px solid #333;border-radius:4px;padding:3px" onclick="event.stopPropagation()"></td>
    <td><button class="btn" onclick="event.stopPropagation();saveU('${u.key}')">💾</button></td>`;
    tb.appendChild(tr);
  });
}

function saveU(p){
  db.ref('clients/'+p).update({
    solde:Number(document.getElementById('s-'+p).value),
    commission:Number(document.getElementById('c-'+p).value),
    recompense:Number(document.getElementById('r-'+p).value),
    gain_parrainage:Number(document.getElementById('g-'+p).value)
  }).then(()=>{ 
    // petite anim pro
    let btn=document.querySelector(`button[onclick="event.stopPropagation();saveU('${p}')"]`);
    if(btn){ btn.innerText='✅'; setTimeout(()=>btn.innerText='💾',1000); }
  });
}
function filtrer(){
  let q=document.getElementById('s-user').value.toLowerCase();
  render(all.filter(u=>u.nom.toLowerCase().includes(q)||u.key.includes(q)||(u.email||'').toLowerCase().includes(q)||u.parrain.toLowerCase().includes(q)));
}

async function openUser(key){
  currentKey=key;
  let snap=await db.ref('clients/'+key).once('value');
  let v=snap.val(); if(!v) return;
  currentData=v;
  document.getElementById('m-title').innerText= (v.nom||'Sans nom')+' - '+key;

  let kyc = v.kyc || {};
  let kycStatut = (kyc.statut|| v.kyc_status || (v.kyc_verified?'verifie':'non_verifie')).toLowerCase();
  let kycBadge = kycStatut.includes('verif') ? '<span class="badge badge-ok">VÉRIFIÉ</span>' : kycStatut.includes('attente') ? '<span class="badge badge-wait">EN ATTENTE</span>' : '<span class="badge badge-no">NON VÉRIFIÉ</span>';

  let email = v.email || 'Non défini';
  let emailStatut = v.email_verified || v.email_verifie || false;
  let emailBadge = emailStatut ? '<span class="badge badge-ok">Email Vérifié</span>' : '<span class="badge badge-no">Email Non vérifié</span>';

  let photoKyc = kyc.photo || v.photo_kyc || v.cni_url || v.kyc_docs || '';
  if(!photoKyc){
    try{
      let kycSnap = await db.ref('kyc_demandes').orderByChild('client_id').equalTo(key).once('value');
      kycSnap.forEach(ch=>{ let kd=ch.val(); if(kd.photo) photoKyc=kd.photo; if(kd.cni_url) photoKyc=kd.cni_url; });
    }catch(e){}
  }

  let html=`
    <div class="row"><span>📱 Téléphone</span><b>${key}</b></div>
    <div class="row"><span>👤 Nom</span><b>${v.nom||''} ${v.prenom||''}</b></div>
    <div class="row"><span>📧 Email</span><b style="font-size:11px">${email}</b></div>
    <div class="row"><span>Statut Email</span>${emailBadge}</div>
    <div class="row"><span>💰 Solde</span><b style="color:#0f0">${v.solde||0} F</b></div>
    <div class="row"><span>💸 Commission</span><b style="color:#ffeb3b">${v.commission||0} F</b></div>
    <div class="row"><span>🏦 Epargne</span><b style="color:#f0f">${v.recompense||0} F</b></div>
    <div class="row"><span>🎁 Parrainage</span><b style="color:#0ff">${v.gain_parrainage||0} F</b></div>
    <div class="row"><span>🔐 KYC</span>${kycBadge}</div>
    <div class="row"><span>📄 Pièce</span><b>${kyc.piece_type||kyc.type||v.piece_type||'-'} N° ${kyc.numero_piece||kyc.numero||v.numero_piece||''}</b></div>
    <div class="row"><span>📅 KYC date</span><b>${kyc.verified_at ? new Date(kyc.verified_at).toLocaleString('fr-FR') : (kyc.date||v.kyc_date||'-')}</b></div>
    <div class="row"><span>👥 Parrain</span><b>${v.parrain||'-'}</b></div>
    <div class="row"><span>📅 Inscription</span><b>${v.date_inscription||'-'}</b></div>
  `;
  document.getElementById('m-content').innerHTML=html;
  let img=document.getElementById('modal-img');
  if(photoKyc && (photoKyc.startsWith('http') || photoKyc.startsWith('data:image'))){ img.src=photoKyc; img.style.display='block'; } else { img.style.display='none'; }
  document.getElementById('modal').style.display='flex';
}

function closeModal(){document.getElementById('modal').style.display='none'; currentKey=null;}

function verifyEmail(etat){
  if(!currentKey) return;
  if(!confirm((etat?'Vérifier':'Dé-vérifier')+' email de '+currentKey+' ?')) return;
  db.ref('clients/'+currentKey).update({
    email_verified: etat,
    email_verifie: etat,
    email_verified_at: new Date().toISOString(),
    email_verified_by: 'admin_'+getPhone()
  }).then(()=>{
    db.ref('notifications/'+currentKey).push({
      titre: etat?'✅ Email Vérifié':'❌ Email Dé-vérifié',
      message: etat?'Ton email a été vérifié manuellement par l admin.':'Ton email a été dé-vérifié.',
      date: new Date().toLocaleString('fr-FR')
    });
    alert('Email '+(etat?'vérifié ✅':'dé-vérifié ❌'));
    closeModal();
  });
}

function verifyKYC(etat){
  if(!currentKey) return;
  if(!confirm((etat?'VALIDER':'REJETER')+' KYC de '+currentKey+' ?')) return;
  db.ref('clients/'+currentKey).update({
    kyc_verified: etat,
    kyc_status: etat?'valide':'rejete',
    'kyc/statut': etat?'verifie':'rejete',
    'kyc/verified_at': new Date().toISOString(),
    'kyc/verified_by': 'admin_'+getPhone()
  }).then(()=>{
    db.ref('notifications/'+currentKey).push({
      titre: etat?'✅ KYC Validé':'❌ KYC Rejeté',
      message: etat?'Félicitations ! Ton KYC est validé. Tu peux retirer.':'Ton KYC est rejeté. Envoie de meilleures photos nettes.',
      date: new Date().toLocaleString('fr-FR')
    });
    alert('KYC '+(etat?'validé ✅':'rejeté ❌'));
    closeModal();
  });
}

function editSoldes(){
  if(!currentKey) return;
  let s = prompt('Nouveau SOLDE pour '+currentKey+' (actuel: '+(currentData.solde||0)+')', currentData.solde||0);
  if(s===null) return;
  let c = prompt('Nouvelle COMMISSION (actuel: '+(currentData.commission||0)+')', currentData.commission||0);
  if(c===null) return;
  let r = prompt('Nouvelle EPARGNE (actuel: '+(currentData.recompense||0)+')', currentData.recompense||0);
  if(r===null) return;
  db.ref('clients/'+currentKey).update({
    solde: Number(s),
    commission: Number(c),
    recompense: Number(r)
  }).then(()=>{ alert('Soldes modifiés'); closeModal(); });
}

async function deleteUser(){
  if(!currentKey) return;
  if(!confirm('⚠️ SUPPRIMER DÉFINITIVEMENT '+currentKey+' ?\n'+(currentData.nom||'')+'\nCette action est irréversible !')) return;
  if(!confirm('Confirme 2e fois: supprimer '+currentKey+' de la base ? Solde/Bonus/Epargne perdus.')) return;
  try{
    const email = currentData.email||'';
    if(email){ 
      const emailKey = email.replace(/\./g,',');
      await db.ref('emails_index/'+emailKey).remove().catch(()=>{});
    }
    await db.ref('clients/'+currentKey).remove();
    try{ 
      let s=await db.ref('kyc_demandes').orderByChild('client_id').equalTo(currentKey).once('value'); 
      s.forEach(ch=>{ db.ref('kyc_demandes/'+ch.key).remove(); }); 
    }catch(e){}
    await db.ref('notifications/'+currentKey).remove().catch(()=>{});
    alert('🗑️ Utilisateur '+currentKey+' supprimé définitivement');
    closeModal();
  }catch(e){ alert('Erreur: '+e.message); }
}

function openNotif(){
  if(!currentKey) return;
  let titre = prompt('Titre notif pour '+currentKey+' :','Info MAYNE');
  if(!titre) return;
  let msg = prompt('Message :','Votre demande a été traitée');
  if(!msg) return;
  db.ref('notifications/'+currentKey).push({
    titre: titre,
    message: msg,
    date: new Date().toLocaleString('fr-FR'),
    by: 'admin_'+getPhone()
  }).then(()=> alert('Notif envoyée à '+currentKey));
}

window.onload=init;
</script>
