<style>
body{margin:0;padding:5px;font-family:Arial,sans-serif;background:#aaaa;min-height:100vh}
.app-container{width:100%;max-width:1100px;margin:0 auto;padding:12px;background:#500;border:9px solid #ff5000;border-radius:10px;color:#fff;box-sizing:border-box}
.header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.btn{padding:6px 12px;border:1px solid #fff;border-radius:4px;cursor:pointer;font-weight:bold}
.btn-home{background:#aaa;color:#fff}
.btn-logout{background:#c00;color:#fff}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat-box{background:#1e1e1e;border:2px solid #fff;border-radius:6px;padding:10px;text-align:center}
.stat-val{font-size:20px;font-weight:bold;color:#0f0}
.stat-label{font-size:11px;color:#aaa}
.tab-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{background:#fb3b;color:#fff;border:1px solid #fff;padding:8px 10px;border-radius:4px;cursor:pointer;font-size:11px;font-weight:bold}
.tab.active{background:#ff5000}
.search-box{width:100%;padding:10px;border:5px solid #ff5000;border-radius:4px;box-sizing:border-box;margin-bottom:10px;text-align:center;font-weight:bold}
.table-wrap{background:#1e1e1e;border-radius:6px;overflow:auto;max-height:70vh}
table{width:100%;border-collapse:collapse;font-size:12px}
th{position:sticky;top:0;background:#000;color:#ffeb3b;padding:8px;text-align:left}
td{padding:7px;border-bottom:1px solid #333}
tr:hover{background:#2a2a2a}
.badge{padding:2px 6px;border-radius:4px;font-size:10px;font-weight:bold}
.badge-ok{background:#2b8a3e;color:#fff}
.badge-no{background:#c00;color:#fff}
.action-btn{padding:4px 6px;font-size:10px;border:none;border-radius:3px;cursor:pointer;margin:1px}
.btn-credit{background:#0f0;color:#000}
.btn-debit{background:#ff5000;color:#fff}
.btn-view{background:#09f;color:#fff}

<body>
<div class="app-container">
  <div class="header">
    <h3 style="margin:0;color:#ffeb3b">🔧 ADMIN MAYNE E-SERVICES</h3>
    <div>
      <button class="btn btn-home" onclick="location.href='index.html'">🏠 ACCUEIL</button>
      <button class="btn btn-logout" onclick="location.href='index.html'">RETOUR</button>
    </div>
  </div>

  <div class="stat-grid">
    <div class="stat-box"><div class="stat-val" id="stat-clients">0</div><div class="stat-label">CLIENTS TOTAL</div></div>
    <div class="stat-box"><div class="stat-val" id="stat-solde">0 F</div><div class="stat-label">SOLDE CUMULÉ</div></div>
    <div class="stat-box"><div class="stat-val" id="stat-cmd">0</div><div class="stat-label">COMMANDES EN COURS</div></div>
  </div>

  <div class="tab-bar">
    <button class="tab active" onclick="switchTab('clients')">👥 CLIENTS</button>
    <button class="tab" onclick="switchTab('p2p')">🚀 P2P/P2M</button>
    <button class="tab" onclick="switchTab('market')">🛒 MARKET</button>
    <button class="tab" onclick="switchTab('1xbet')">🎲 1XBET</button>
    <button class="tab" onclick="switchTab('factures')">🧾 FACTURES</button>
    <button class="tab" onclick="switchTab('forfaits')">📦 FORFAITS</button>
  </div>

  <input id="searchInput" class="search-box" placeholder="Rechercher nom, téléphone, email..." oninput="filterTable()">

  <div class="table-wrap">
    <table id="mainTable">
      <thead id="tableHead"><tr><th>Nom</th><th>Téléphone</th><th>Email</th><th>Solde</th><th>Bonus</th><th>Epargne</th><th>Email Verif</th><th>Actions</th></tr></thead>
      <tbody id="tableBody"><tr><td colspan="8" style="text-align:center;padding:20px">Chargement...</td></tr></tbody>
    </table>
  </div>
</div>

<script>
const ADMIN_PHONES = ["0158612131","158612131","2290158612131","229158612131","0158612131".replace(/\D/g,'')];
let currentTab='clients';
let allData=[];

function checkAdmin(){
  const saved = JSON.parse(localStorage.getItem('mayne_current_user')||'null') || JSON.parse(localStorage.getItem('mayne_current_user')||'null');
  const tiny = localStorage.getItem('mayne_'+'current_user');
  let phone=null;
  try{ phone = JSON.parse(tiny)?.phone || JSON.parse(localStorage.getItem('mayne_current_user'))?.phone; }catch(e){}
  if(!phone){ alert('Non connecté'); location.href='index.html'; return; }
  const clean = phone.replace(/\D/g,'');
  const isAdmin = ADMIN_PHONES.some(a=> clean.endsWith(a.replace(/\D/g,'').slice(-8)) ) || clean==="0158612131" || clean==="158612131";
  // Pour test on autorise tout le monde, commente si tu veux restreindre
  // if(!isAdmin){ alert('Accès admin refusé'); location.href='index.html'; }
}
checkAdmin();

function switchTab(tab){
  currentTab=tab;
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('tableBody').innerHTML='<tr><td colspan="8" style="text-align:center;padding:20px">Chargement '+tab+'...</td></tr>';
  if(tab==='clients') loadClients();
  else loadCommandes(tab);
}

function loadClients(){
  document.getElementById('tableHead').innerHTML='<tr><th>Nom</th><th>Téléphone</th><th>Email</th><th>Solde</th><th>Bonus</th><th>Epargne</th><th>Email Verif</th><th>Actions</th></tr>';
  database.ref('clients').once('value').then(snap=>{
    const vals = snap.val()||{};
    allData = Object.entries(vals).map(([phone,data])=>({phone,...data}));
    renderClients(allData);
    document.getElementById('stat-clients').innerText = allData.length;
    const total = allData.reduce((a,b)=>a+(b.solde||0),0);
    document.getElementById('stat-solde').innerText = total.toLocaleString('fr-FR')+' F';
  });
}

function renderClients(list){
  const tbody=document.getElementById('tableBody');
  tbody.innerHTML='';
  list.forEach(c=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`
      <td><b>${c.nom||'-'}</b><br><small>${c.parrain?'Parrain: '+c.parrain:''}</small></td>
      <td>${c.phone||c.telephone||''}</td>
      <td style="max-width:150px;overflow:hidden;text-overflow:ellipsis">${c.email||''}</td>
      <td style="color:#0f0;font-weight:bold">${(c.solde||0).toLocaleString()}</td>
      <td style="color:#ffeb3b">${(c.commission||0).toLocaleString()}</td>
      <td style="color:#f80">${(c.recompense||0).toLocaleString()}</td>
      <td><span class="badge ${c.email_verified?'badge-ok':'badge-no'}">${c.email_verified?'OUI':'NON'}</span></td>
      <td>
        <button class="action-btn btn-credit" onclick="creditClient('${c.phone||''}', 'solde')">+ Solde</button>
        <button class="action-btn btn-debit" onclick="debitClient('${c.phone||''}', 'solde')">- Solde</button>
        <button class="action-btn btn-view" onclick="viewClient('${c.phone||''}')">Voir</button>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

function loadCommandes(type){
  const map={
    'p2p':'commandes_p2p_p2m',
    'market':'commandes_marketplace',
    '1xbet':'commandes_1xbet',
    'factures':'commandes_factures',
    'forfaits':'commandes_forfaits',
    'epargne':'commandes_epargne'
  };
  const path = map[type]||'commandes_p2p_p2m';
  document.getElementById('tableHead').innerHTML='<tr><th>Client</th><th>Montant</th><th>Type</th><th>Statut</th><th>Date</th><th>Actions</th></tr>';
  database.ref(path).limitToLast(200).once('value').then(snap=>{
    const vals = snap.val()||{};
    const list = Object.entries(vals).map(([id,data])=>({id,...data})).reverse();
    allData=list;
    const tbody=document.getElementById('tableBody');
    tbody.innerHTML='';
    let encours=0;
    list.forEach(c=>{
      if((c.statut||'').toLowerCase().includes('en cours')) encours++;
      const tr=document.createElement('tr');
      tr.innerHTML=`<td>${c.client_id||c.phone||''}</td><td>${c.montant||c.total||''}</td><td>${c.type||type}</td><td>${c.statut||''}</td><td>${c.date||''}</td><td><button class="action-btn btn-view" onclick="validerCommande('${path}','${c.id}')">Valider</button></td>`;
      tbody.appendChild(tr);
    });
    document.getElementById('stat-cmd').innerText=encours;
    if(list.length===0) tbody.innerHTML='<tr><td colspan="6" style="text-align:center">Aucune commande</td></tr>';
  });
}

function filterTable(){
  const q=document.getElementById('searchInput').value.toLowerCase();
  if(currentTab!=='clients'){ 
    const rows=document.querySelectorAll('#tableBody tr');
    rows.forEach(r=>{ r.style.display = r.innerText.toLowerCase().includes(q) ? '' : 'none'; });
    return;
  }
  const filtered = allData.filter(c=> (c.nom||'').toLowerCase().includes(q) || (c.phone||'').includes(q) || (c.email||'').toLowerCase().includes(q) );
  renderClients(filtered);
}

function creditClient(phone, field){
  const montant = prompt('Montant à ajouter (F) pour '+phone+' ?');
  if(!montant) return;
  const val=parseInt(montant);
  if(isNaN(val)) return alert('Montant invalide');
  database.ref('clients/'+phone+'/'+field).once('value').then(s=>{
    const cur=s.val()||0;
    database.ref('clients/'+phone+'/'+field).set(cur+val).then(()=>{ alert('Crédité'); loadClients(); });
  });
}
function debitClient(phone, field){
  const montant = prompt('Montant à retirer (F) pour '+phone+' ?');
  if(!montant) return;
  const val=parseInt(montant);
  if(isNaN(val)) return alert('Montant invalide');
  database.ref('clients/'+phone+'/'+field).once('value').then(s=>{
    const cur=s.val()||0;
    database.ref('clients/'+phone+'/'+field).set(Math.max(0,cur-val)).then(()=>{ alert('Débité'); loadClients(); });
  });
}
function viewClient(phone){
  const c = allData.find(x=> (x.phone||'')===phone );
  if(!c) return alert('Non trouvé');
  alert('CLIENT\nNom: '+c.nom+'\nPhone: '+phone+'\nEmail: '+c.email+'\nSolde: '+c.solde+'\nCommission: '+c.commission+'\nEpargne: '+c.recompense+'\nVerif: '+c.email_verified+'\nParrain: '+c.parrain);
}
function validerCommande(path,id){
  const nouveau = prompt('Nouveau statut (ex: validé, livré, rejeté) ?','validé');
  if(!nouveau) return;
  database.ref(path+'/'+id+'/statut').set(nouveau).then(()=>{ alert('Statut mis à jour'); loadCommandes(currentTab); });
}

loadClients();
</script>
