<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADMIN FINAL - MAYNE PRO</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box}
body{background:#0e0e0e;color:#fff;font-family:system-ui,-apple-system,sans-serif;margin:0;padding:0}
.app{max-width:1000px;width:100%;margin:0 auto;background:#151515;min-height:100vh}
.top{padding:12px;background:#000;display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:0;z-index:20;border-bottom:3px solid #ff5000}
.top-title{font-size:14px;font-weight:900;color:#ffeb3b}
.top-sub{font-size:10px;color:#0f0}
.top-actions{display:flex;gap:6px}
.btn{padding:9px 14px;border-radius:999px;font-size:12px;font-weight:900;cursor:pointer;text-decoration:none;border:none}
.btn-home{background:#fff;color:#000}
.btn-orange{background:#ff5000;color:#fff}
.btn:disabled{opacity:.5}
.tabs{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;padding:12px 10px 6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:#222;color:#fff;border:1px solid #333;padding:9px 14px;border-radius:999px;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap;flex-shrink:0}
.tab.active{background:#ff5000;border-color:#fff}
.tab i{font-style:normal;background:#000;color:#ffeb3b;padding:1px 7px;border-radius:999px;margin-left:4px;font-size:11px}
.tab i.has{background:#ff5000;color:#fff}
.section{padding:0 10px 20px}
.h2{color:#ffeb3b;font-size:12px;font-weight:900;margin:10px 0 8px;border-left:4px solid #ff5000;padding-left:8px;line-height:1.4}
.input{width:100%;background:#000;color:#fff;padding:12px 14px;border:1px solid #333;border-radius:12px;font-size:13px;outline:none}
.input:focus{border-color:#ff5000}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.stat{background:#000;border-radius:12px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:15px}
.stat span{font-size:8px;color:#999;font-weight:800;letter-spacing:.5px}
.cmd-buttons{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.cmd-btn{background:#222;color:#fff;border:1px solid #333;padding:9px 12px;border-radius:999px;font-size:11px;font-weight:800;cursor:pointer;white-space:nowrap}
.cmd-btn.active{background:#ff5000;border-color:#fff}
.cmd-btn b{color:#ffeb3b;background:#000;padding:1px 6px;border-radius:999px;margin-left:4px}
.cmd-btn b.has{background:#ff5000;color:#fff}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:#1e1e1e;border:1px solid #2a2a2a;border-radius:14px;padding:12px}
.card.en-cours{border-left:4px solid #ffeb3b}
.card.validating{opacity:.6}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.user-name{font-size:15px;font-weight:900;line-height:1.1}
.user-name small{display:block;font-size:11px;color:#aaa;font-weight:400;margin-top:2px;word-break:break-all}
.user-phone{font-size:13px;font-weight:900;color:#ffeb3b}
.badge{font-size:10px;font-weight:900;padding:5px 9px;border-radius:999px;white-space:nowrap}
.badge.ok{background:#28a745;color:#fff}
.badge.no{background:#dc3545;color:#fff}
.badge.wait{background:#ffeb3b;color:#000}
.card-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:10px 0;padding:10px;background:#111;border-radius:10px}
.card-grid.two{grid-template-columns:1fr 1fr}
.kv{font-size:12px;min-width:0}
.kv b{display:block;font-size:8px;color:#ffeb3b;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
.kv span{color:#fff;word-break:break-word}
.edit-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:10px 0}
.edit-field label{display:block;font-size:8px;color:#999;font-weight:800;letter-spacing:.5px;margin-bottom:4px;text-transform:uppercase}
.edit-field input{width:100%;background:#000;color:#fff;border:1px solid #333;border-radius:10px;padding:11px 8px;font-size:13px;font-weight:800;outline:none}
.edit-field input:focus{border-color:#ff5000}
.edit-field input.green{color:#0f0}
.edit-field input.yellow{color:#ffeb3b}
.edit-field input.pink{color:#f0f}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.actions.three{grid-template-columns:1fr 1fr 1fr}
.btn-action{border:none;padding:11px 6px;border-radius:10px;font-weight:900;font-size:12px;cursor:pointer}
.btn-action:active{transform:scale(.97)}
.btn-action:disabled{opacity:.5}
.btn-val{background:#28a745;color:#fff}
.btn-ann{background:#dc3545;color:#fff}
.btn-save{background:#0d6efd;color:#fff}
.btn-view{background:#333;color:#fff;border:1px solid #555}
.btn-full{width:100%;background:#ff5000;color:#fff;border:none;padding:12px;border-radius:10px;font-weight:900;font-size:13px;cursor:pointer;margin-top:6px}
.empty{text-align:center;padding:30px;color:#888;font-size:13px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:flex-end;justify-content:center;z-index:99}
#mBox{background:#1e1e1e;border-radius:18px 18px 0 0;width:100%;max-width:600px;padding:16px;max-height:92vh;overflow:auto}
.row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #333;font-size:12px;gap:8px}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(80px);background:#111;border:2px solid #28a745;color:#fff;padding:12px 16px;border-radius:12px;font-size:12px;font-weight:800;z-index:999;opacity:0;transition:.3s;max-width:92%;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.6)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{border-color:#dc3545}
@media(max-width:480px){.edit-grid{grid-template-columns:1fr 1fr 1fr}.edit-field input{font-size:12px;padding:10px 6px}}
</style>
</head>
<body>
<div class="app">
<div class="top">
<div>
<div class="top-title">🔧 ADMIN FINAL MAYNE</div>
<div class="top-sub" id="adminPhone">Connexion...</div>
</div>
<div class="top-actions">
<a href="statut.html" class="btn btn-home">STATUT 🧭</a>
<button class="btn btn-orange" id="btnReload" onclick="loadAllCounts()">🔄 RELOAD</button>
</div>
</div>
<div class="tabs">
<button class="tab active" id="tab-users" onclick="switchMain('users')">👥 TOUS LES USERS</button>
<button class="tab" id="tab-cmd" onclick="switchMain('cmd')">📦 COMMANDES <i id="bubble-all">0</i></button>
</div>
<div id="sec-users" class="section">
<div class="h2">1 / TOUS LES USERS — Nom, Prénom, Solde, Commission, Épargne, Numéro, Email</div>
<input id="searchUser" class="input" placeholder="🔍 Rechercher nom, prénom, numéro, email..." oninput="filterUsers()">
<div class="stats">
<div class="stat"><b id="uCount">0</b><span>USERS</span></div>
<div class="stat"><b id="uSolde" style="color:#0f0">0</b><span>SOLDE TOTAL</span></div>
<div class="stat"><b id="uCom" style="color:#ffeb3b">0</b><span>COMMISSION</span></div>
<div class="stat"><b id="uEp" style="color:#f0f">0</b><span>ÉPARGNE</span></div>
</div>
<div class="list" id="listUsers"><div class="empty">Chargement...</div></div>
</div>
<div id="sec-cmd" class="section" style="display:none">
<div class="h2">2 / COMMANDES EN COURS — Tes vrais services Firebase</div>
<div class="cmd-buttons" id="cmdButtons"></div>
<input id="searchCmd" class="input" placeholder="🔍 Rechercher client, montant..." oninput="filterCmd()">
<div class="list" id="listCmd" style="margin-top:10px"><div class="empty">Clique sur un service ci-dessus</div></div>
</div>
</div>
<div id="modal" onclick="if(event.target==this) closeModal()">
<div id="mBox">
<h3 id="mTitle" style="color:#ff5000;margin:0 0 8px 0">Détail</h3>
<div id="mContent"></div>
<div id="mActions" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px"></div>
<button class="btn" style="width:100%;margin-top:8px;background:#333;color:#fff;padding:12px;border-radius:10px;border:none;font-weight:900" onclick="closeModal()">Fermer</button>
</div>
</div>
<div id="toast"></div>
<script>
const firebaseConfig={apiKey:"AIzaSyDR0zDiGxisp4G-CDjltu8VFmxMMFjXI9E",authDomain:"mayneilliminetdb.firebaseapp.com",databaseURL:"https://mayneilliminetdb-default-rtdb.firebaseio.com",projectId:"mayneilliminetdb",storageBucket:"mayneilliminetdb.appspot.com",messagingSenderId:"904857888891",appId:"1:904857888891:web:a89e339ea89de0340a5ade"};
if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
var db=firebase.database();
let toastTimer=null;
function showToast(msg,isErr){
const t=document.getElementById('toast');
t.innerText=msg; t.className=isErr?'show err':'show';
clearTimeout(toastTimer); toastTimer=setTimeout(()=>{ t.className=''; },2800);
}
const ADMIN_LIST=["0158612131","2290158612131","158612131"];
function getPhone(){ try{ let p=JSON.parse(localStorage.getItem('mayne_current_user')||'{}')?.phone; if(p) return p; }catch(e){} return null; }
function isAdmin(p){ if(!p) return false; const c=p.replace(/\D/g,''); return ADMIN_LIST.some(a=> c.endsWith(a.replace(/\D/g,'').slice(-8))); }
const curPhone=getPhone();
if(!isAdmin(curPhone)){ document.body.innerHTML='<div style="padding:40px;text-align:center;color:#fff">⛔ Admin 0158612131 seulement<br>'+ (curPhone||'non connecté')+'<br><a href="index.html" style="color:#ff5000">Retour</a></div>'; throw 'not admin'; }
document.getElementById('adminPhone').innerText='Admin: '+curPhone+' ✅';
const SERVICES = [
{key:'depots', label:'Dépôts', path:'commandes_depots'},
{key:'retraits', label:'Retrait', path:'commandes_retraits'},
{key:'epargne', label:'Épargne', path:'epargne'},
{key:'1xbet', label:'1XBET', path:'commandes_1xbet'},
{key:'forfaits', label:'FORFAIT', path:'commandes_forfaits'},
{key:'factures', label:'Facture', path:'commandes_factures'},
{key:'transferts', label:'Transfert', path:'commandes_transferts'},
{key:'echanges', label:'Echanges', path:'commandes_echanges'}
];
let allUsers=[], allCmd=[], currentService=null, processing=new Set();
function switchMain(tab){
document.getElementById('sec-users').style.display = tab==='users' ? 'block' : 'none';
document.getElementById('sec-cmd').style.display = tab==='cmd' ? 'block' : 'none';
document.getElementById('tab-users').classList.toggle('active', tab==='users');
document.getElementById('tab-cmd').classList.toggle('active', tab==='cmd');
if(tab==='cmd') loadAllCounts();
}
function fmt(n){ return Math.round(n||0).toLocaleString('fr-FR')+' F'; }
function loadUsers(){
db.ref('clients').on('value', snap=>{
allUsers=[]; let totS=0,totC=0,totE=0;
snap.forEach(ch=>{
const v=ch.val(); const phone=ch.key;
allUsers.push({key:phone, nom:v.nom||'', prenom:v.prenom||'', phone, email:v.email||'', solde:v.solde||0, commission:v.commission||0, recompense:v.recompense||0, data:v});
totS+= (v.solde||0); totC+= (v.commission||0); totE+= (v.recompense||0);
});
document.getElementById('uCount').innerText=allUsers.length;
document.getElementById('uSolde').innerText=fmt(totS);
document.getElementById('uCom').innerText=fmt(totC);
document.getElementById('uEp').innerText=fmt(totE);
renderUsers(allUsers);
});
}
function renderUsers(list){
const el=document.getElementById('listUsers'); el.innerHTML='';
if(list.length===0){ el.innerHTML='<div class="empty">Aucun user</div>'; return; }
list.slice(0,500).forEach(u=>{
const div=document.createElement('div');
div.className='card';
div.innerHTML=`<div class="card-top"><div><div class="user-name">${u.nom||'-'} ${u.prenom||''}<small>${u.email||'Pas d\'email'}</small></div><div class="user-phone" style="margin-top:4px">${u.phone}</div></div><span class="badge ok">USER</span></div><div class="edit-grid"><div class="edit-field"><label>💰 Solde</label><input id="solde-${u.key}" type="number" value="${u.solde}" class="green"></div><div class="edit-field"><label>⭐ Commission</label><input id="com-${u.key}" type="number" value="${u.commission}" class="yellow"></div><div class="edit-field"><label>🐷 Épargne</label><input id="ep-${u.key}" type="number" value="${u.recompense}" class="pink"></div></div><button class="btn-full" id="save-${u.key}" onclick="saveUser('${u.key}',this)">💾 SAUVEGARDER</button>`;
el.appendChild(div);
});
}
function filterUsers(){ const q=document.getElementById('searchUser').value.toLowerCase(); renderUsers(allUsers.filter(u=> (u.nom||'').toLowerCase().includes(q) || (u.prenom||'').toLowerCase().includes(q) || u.phone.includes(q) || (u.email||'').toLowerCase().includes(q))); }
async function saveUser(phone,btn){
if(btn){ btn.disabled=true; btn.innerText='⏳ Sauvegarde...'; }
const s=Number(document.getElementById('solde-'+phone).value);
const c=Number(document.getElementById('com-'+phone).value);
const e=Number(document.getElementById('ep-'+phone).value);
try{ await db.ref('clients/'+phone).update({solde:s, commission:c, recompense:e}); showToast('✅ '+phone+' sauvegardé'); }catch(err){ showToast('❌ '+err.message,true); }
if(btn){ btn.disabled=false; btn.innerText='💾 SAUVEGARDER'; }
}
async function loadAllCounts(){
const btn=document.getElementById('btnReload'); if(btn){ btn.disabled=true; btn.innerText='⏳...'; }
const container=document.getElementById('cmdButtons'); container.innerHTML='Scan...';
allCmd=[]; let total=0;
const counts={};
for(const svc of SERVICES){
try{
const snap=await db.ref(svc.path).once('value');
let countEnCours=0;
snap.forEach(ch=>{
const v=ch.val();
const statut=((v.statut||v.status||'')+'').toLowerCase();
const isValide = statut.includes('valid')||statut.includes('succes')||statut.includes('payé')||statut.includes('paye');
const isRejete = statut.includes('rejet')||statut.includes('annul')||statut.includes('echec');
const isEnCours = !isValide && !isRejete;
if(isEnCours){
countEnCours++;
allCmd.push({id:ch.key, path:svc.path, service:svc.key, label:svc.label, client:v.client_id||v.phone||v.user||'', montant:v.montant||v.total||v.prix||v.amount||0, statut: statut||'en cours', date:v.date||v.created_at||'', data:v});
}
});
counts[svc.key]=countEnCours;
total+=countEnCours;
}catch(e){ counts[svc.key]=0; }
}
const bubble=document.getElementById('bubble-all'); bubble.innerText=total; bubble.className= total>0 ? 'has' : '';
container.innerHTML='';
const allBtn=document.createElement('button');
allBtn.className='cmd-btn'+(!currentService?' active':'');
allBtn.innerHTML=`TOUS <b class="${total>0?'has':''}">${total}</b>`;
allBtn.onclick=()=>{ currentService=null; document.querySelectorAll('.cmd-btn').forEach(b=>b.classList.remove('active')); allBtn.classList.add('active'); renderCmd(allCmd); };
container.appendChild(allBtn);
SERVICES.forEach(svc=>{
const c=counts[svc.key]||0;
const b=document.createElement('button');
b.className='cmd-btn'+(currentService===svc.key?' active':'');
b.innerHTML=`${svc.label} <b class="${c>0?'has':''}">${c}</b>`;
b.onclick=()=> loadService(svc.key,b);
container.appendChild(b);
});
renderCmd(allCmd);
if(btn){ btn.disabled=false; btn.innerText='🔄 RELOAD'; }
}
function loadService(key,btnEl){
currentService=key;
document.querySelectorAll('.cmd-btn').forEach(b=>b.classList.remove('active'));
if(btnEl) btnEl.classList.add('active');
const list = allCmd.filter(c=> c.service===key);
renderCmd(list);
}
function renderCmd(list){
const el=document.getElementById('listCmd'); el.innerHTML='';
if(list.length===0){ el.innerHTML='<div class="empty">Aucune commande en cours pour ce service</div>'; return; }
list.forEach((item,idx)=>{
const k=item.path+'|'+item.id;
const isBusy=processing.has(k);
const div=document.createElement('div');
div.className='card en-cours'+(isBusy?' validating':'');
div.innerHTML=`<div class="card-top"><div><div class="user-name">${item.client||'-'}<small>${item.label} • #${idx+1} • ${item.id.slice(0,10)}</small></div><div style="font-size:15px;font-weight:900;color:#0f0;margin-top:4px">${fmt(item.montant)}</div></div><span class="badge wait">${item.statut.toUpperCase()}</span></div><div class="card-grid two"><div class="kv"><b>Service</b><span>${item.label}</span></div><div class="kv"><b>Date</b><span>${(item.date||'').toString().slice(0,16)||'-'}</span></div></div><div class="actions three"><button class="btn-action btn-view" onclick="openDetailCmd('${item.path}','${item.id}')">👁️ Voir</button><button class="btn-action btn-val" ${isBusy?'disabled':''} onclick="actionCmd('${item.path}','${item.id}','validé',this)">${isBusy?'⏳':'✅ Valider'}</button><button class="btn-action btn-ann" ${isBusy?'disabled':''} onclick="actionCmd('${item.path}','${item.id}','annulé',this)">❌ Annuler</button></div>`;
el.appendChild(div);
});
}
function filterCmd(){ const q=document.getElementById('searchCmd').value.toLowerCase(); let base = currentService ? allCmd.filter(i=>i.service===currentService) : allCmd; renderCmd(base.filter(i=> (i.client||'').toLowerCase().includes(q) || (i.montant||'').toString().includes(q) || i.label.toLowerCase().includes(q))); }
async function actionCmd(path,id,newStatut,btnEl){
const k=path+'|'+id;
if(processing.has(k)) return;
processing.add(k);
if(btnEl){ btnEl.disabled=true; btnEl.innerText='⏳'; }
const item=allCmd.find(x=>x.path===path && x.id===id);
try{
await db.ref(path+'/'+id+'/statut').set(newStatut);
await db.ref(path+'/'+id+'/status').set(newStatut);
await db.ref(path+'/'+id+'/updated_at').set(new Date().toISOString());
await db.ref(path+'/'+id+'/updated_by').set('admin_'+curPhone);
const phone=item?.client;
if(phone){ db.ref('notifications/'+phone).push({titre:newStatut==='validé'?'✅ Validé':'❌ Annulé', message:`Ta commande ${item.label} ${item.montant}F est ${newStatut}`, date:new Date().toLocaleString('fr-FR')}); }
showToast((newStatut==='validé'?'✅ Validé • ':'❌ Annulé • ')+ (item?item.label+' '+fmt(item.montant):''));
}catch(e){ showToast('❌ '+e.message,true); }
processing.delete(k);
loadAllCounts();
}
function openDetailCmd(path,id){
const item=allCmd.find(x=>x.path===path && x.id===id); if(!item) return;
document.getElementById('mTitle').innerText=item.label+' - '+id;
let html=`<div class="row"><span>Client</span><b>${item.client}</b></div><div class="row"><span>Montant</span><b style="color:#0f0">${fmt(item.montant)}</b></div><div class="row"><span>Statut</span><b>${item.statut}</b></div><div class="row"><span>Date</span><b>${item.date||'-'}</b></div>`;
Object.keys(item.data||{}).forEach(k=>{ if(typeof item.data[k]!=='object') html+=`<div class="row"><span>${k}</span><b style="max-width:60%;word-break:break-all;font-size:11px">${String(item.data[k]).slice(0,300)}</b></div>`; });
document.getElementById('mContent').innerHTML=html;
document.getElementById('mActions').innerHTML=`<button class="btn-action btn-val" onclick="closeModal();actionCmd('${path}','${id}','validé')">✅ VALIDER - 1 CLIC</button><button class="btn-action btn-ann" onclick="closeModal();actionCmd('${path}','${id}','annulé')">❌ ANNULER</button>`;
document.getElementById('modal').style.display='flex';
}
function closeModal(){ document.getElementById('modal').style.display='none'; }
firebase.auth().onAuthStateChanged(function(user){ if(user){ loadUsers(); loadAllCounts(); } else { firebase.auth().signInAnonymously(); } });
</script>
</body>
</html>
