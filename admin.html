<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADMIN FUSION - MAYNE</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#111;color:#fff;display:flex;justify-content:center}
.app{max-width:750px;width:100%;min-height:100vh;background:#1e1e1e;border:5px solid #ff5000}
.top{padding:12px;background:#000;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.tabs{display:flex;gap:4px;padding:8px;background:#000;position:sticky;top:48px;z-index:9}
.tab{flex:1;padding:10px;border:none;border-radius:8px;font-weight:800;cursor:pointer;background:#222;color:#fff}
.tab.active{background:#ff5000}
.input{width:100%;background:#000;color:#fff;padding:10px;border:1px solid #555;border-radius:8px;margin:4px 0}
.btn{border:none;border-radius:6px;padding:6px 10px;font-weight:800;cursor:pointer}
.btn-save{background:#2b8a3e;color:#fff}.btn-valid{background:#0f0;color:#000}.btn-annul{background:#c00;color:#fff}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{border:1px solid #333;padding:6px;text-align:left}
th{background:#ff5000;position:sticky;top:0}
tr:nth-child(even){background:#2a2a2a}
.section{padding:12px;display:none}.section.active{display:block}
.item{background:#000;border-radius:10px;padding:10px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;font-size:12px}
.badge{padding:2px 6px;border-radius:100px;font-size:10px;font-weight:800}
.en-cours{background:#ffbb00;color:#000}.valide{background:#0f0;color:#000}.annule{background:#c00;color:#fff}
</style>
</head>
<body>
<div class="app">
<div class="top"><b>👑 ADMIN MAYNE FUSION</b><span id="admin-info" style="font-size:11px"></span></div>
<div class="tabs">
<button class="tab active" id="t1" onclick="switchTab('users')">USERS (<span id="cu">0</span>)</button>
<button class="tab" id="t2" onclick="switchTab('trans')">TRANSFERTS (<span id="ct">0</span>)</button>
<button class="tab" id="t3" onclick="switchTab('parrain')">PARRAINAGE</button>
</div>

<!-- USERS -->
<div id="sec-users" class="section active">
<input id="search-user" class="input" placeholder="🔍 Rechercher nom / numéro..." oninput="filtrerUsers()">
<div style="overflow:auto;max-height:75vh">
<table><thead><tr><th>Nom/Parrain</th><th>Num</th><th>Solde</th><th>Com</th><th>Gain Parr</th><th>💾</th></tr></thead><tbody id="tbody-users"></tbody></table>
</div>
</div>

<!-- TRANSFERTS -->
<div id="sec-trans" class="section">
<select id="filter-trans" class="input" onchange="filtrerTrans()"><option value="">Tous</option><option value="en cours">En cours</option><option value="valid">Validé</option><option value="annul">Annulé</option><option value="Retrait">Retrait seulement</option><option value="Envoi">Envoi seulement</option></select>
<div id="list-trans" style="max-height:75vh;overflow:auto"></div>
</div>

<!-- PARRAINAGE -->
<div id="sec-parrain" class="section">
<div id="list-parrain" style="max-height:75vh;overflow:auto"></div>
</div>

</div>

<script>
var cfg={apiKey:"AIzaSyDR0zDiGxisp4G-CDjltu8VFmxMMFjXI9E",authDomain:"mayneilliminetdb.firebaseapp.com",databaseURL:"https://mayneilliminetdb-default-rtdb.firebaseio.com",projectId:"mayneilliminetdb"};
if(!firebase.apps.length)firebase.initializeApp(cfg);
var db=firebase.database();
var ADMIN_UID="0158612131";
var allUsers=[], allTrans=[], usersMap={};

function switchTab(t){
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  if(t==='users'){document.getElementById('t1').classList.add('active');document.getElementById('sec-users').classList.add('active');}
  if(t==='trans'){document.getElementById('t2').classList.add('active');document.getElementById('sec-trans').classList.add('active');}
  if(t==='parrain'){document.getElementById('t3').classList.add('active');document.getElementById('sec-parrain').classList.add('active');}
}

function init(){
  var u=JSON.parse(localStorage.getItem('mayne_current_user')||'null');
  var uid = u ? u.phone.replace(/\D/g,'') : '';
  if(uid !== ADMIN_UID){ document.body.innerHTML='<h2 style="padding:20px;color:#fff">⛔ Accès refusé - Admin seulement</h2>'; return; }
  document.getElementById('admin-info').innerText=uid;

  db.ref('clients').on('value', s=>{
    allUsers=[]; usersMap={};
    s.forEach(ch=>{
      let v=ch.val();
      let o={key:ch.key, nom:v.nom||'', solde:v.solde||0, commission:v.commission||0, gain_parrainage:v.gain_parrainage||0, parrain:v.parrain||''};
      allUsers.push(o); usersMap[ch.key]=o;
    });
    document.getElementById('cu').innerText=allUsers.length;
    renderUsers(allUsers);
    renderParrainage();
  });

  db.ref('commandes_transferts').on('value', s=>{
    allTrans=[];
    s.forEach(ch=>{ allTrans.push({id:ch.key, ...ch.val()}); });
    allTrans.sort((a,b)=> (b.date||'').localeCompare(a.date||''));
    document.getElementById('ct').innerText=allTrans.length;
    renderTrans(allTrans);
  });
}

function renderUsers(list){
  let tbody=document.getElementById('tbody-users'); tbody.innerHTML='';
  list.slice(0,300).forEach(u=>{
    tbody.innerHTML+=`<tr>
      <td><b>${u.nom}</b><br><small style="color:#ffeb3b">Parrain:${u.parrain||'aucun'}</small></td>
      <td>${u.key}</td>
      <td><input id="s-${u.key}" type="number" value="${u.solde}" style="width:70px;background:#000;color:#0f0;border:1px solid #555;padding:4px"></td>
      <td><input id="c-${u.key}" type="number" value="${u.commission}" style="width:60px;background:#000;color:#ffeb3b;border:1px solid #555;padding:4px"></td>
      <td><input id="g-${u.key}" type="number" value="${u.gain_parrainage}" style="width:60px;background:#000;color:#0ff;border:1px solid #555;padding:4px"></td>
      <td><button class="btn btn-save" onclick="saveUser('${u.key}')">💾</button></td>
    </tr>`;
  });
}

function saveUser(phone){
  let ns=Number(document.getElementById('s-'+phone).value);
  let nc=Number(document.getElementById('c-'+phone).value);
  let ng=Number(document.getElementById('g-'+phone).value);
  db.ref('clients/'+phone).update({solde:ns, commission:nc, gain_parrainage:ng}).then(()=>alert('✅ '+phone+' MAJ'));
}

function filtrerUsers(){
  let q=document.getElementById('search-user').value.toLowerCase();
  let f=allUsers.filter(u=> u.nom.toLowerCase().includes(q) || u.key.includes(q) || (u.parrain||'').includes(q));
  renderUsers(f);
}

function renderTrans(list){
  let div=document.getElementById('list-trans'); div.innerHTML='';
  list.forEach(t=>{
    let col = t.statut?.includes('valid') ? 'valide' : t.statut?.includes('annul') ? 'annule' : 'en-cours';
    div.innerHTML+=`<div class="item"><div><b>${t.type} ${t.methode||''} - ${t.montant}F</b><br><small>${t.client_nom} (${t.client_id})<br>${t.numero_complet||t.numero_decaissement} | ${t.pays||''}<br>${t.date}</small><br><span class="badge ${col}">${t.statut}</span></div><div style="display:flex;flex-direction:column;gap:4px"><button class="btn btn-valid" onclick="validTrans('${t.id}')">Valider</button><button class="btn btn-annul" onclick="annulTrans('${t.id}')">Annuler</button></div></div>`;
  });
}

function filtrerTrans(){
  let q=document.getElementById('filter-trans').value.toLowerCase();
  if(!q) return renderTrans(allTrans);
  let f=allTrans.filter(t=> (t.statut||'').toLowerCase().includes(q) || (t.type||'').toLowerCase().includes(q));
  renderTrans(f);
}

function validTrans(id){ db.ref('commandes_transferts/'+id).update({statut:'validé'}).then(()=>alert('Validé')); }
function annulTrans(id){ 
  let t=allTrans.find(x=>x.id===id);
  if(confirm('Rembourser solde si Envoi?')){
    if(t.type==='Envoi'){ let cli=t.client_id; let m=Number(t.montant||0); db.ref('clients/'+cli).once('value').then(s=>{ if(s.exists()) db.ref('clients/'+cli).update({solde:(s.val().solde||0)+m}); }); }
  }
  db.ref('commandes_transferts/'+id).update({statut:'annulé'}).then(()=>alert('Annulé')); 
}

function renderParrainage(){
  // compte filleuls
  let childCount={};
  allUsers.forEach(u=>{
    if(u.parrain){ childCount[u.parrain]=(childCount[u.parrain]||0)+1; }
  });
  let sorted = [...allUsers].sort((a,b)=>(childCount[b.key]||0)-(childCount[a.key]||0));
  let div=document.getElementById('list-parrain'); div.innerHTML='';
  sorted.slice(0,100).forEach(u=>{
    let cnt=childCount[u.key]||0;
    if(cnt===0) return;
    let filleuls = allUsers.filter(x=>x.parrain===u.key).map(f=>`${f.nom}(${f.key})`).join(', ');
    div.innerHTML+=`<div class="item" style="flex-direction:column;align-items:flex-start"><b>${u.nom} - ${u.key} → ${cnt} filleuls</b><small style="color:#aaa;margin-top:4px">${filleuls}</small></div>`;
  });
  if(!div.innerHTML) div.innerHTML='<small>Aucun parrainage encore</small>';
}

window.onload=init;
</script>
</body>
</html>
