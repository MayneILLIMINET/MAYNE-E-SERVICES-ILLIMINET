<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADMIN FINAL - MAYNE</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<style>
body{background:#0a0a0a;color:#fff;font-family:system-ui;display:flex;justify-content:center;margin:0;padding:4px}
.app{max-width:1000px;width:100%;min-height:100vh;background:#1e1e1e;border:6px solid #ff5000;border-radius:12px;overflow:hidden}
.top{padding:12px;background:#000;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;position:sticky;top:0;z-index:20;border-bottom:3px solid #ff5000}
.btn{padding:6px 12px;border-radius:20px;font-size:11px;font-weight:900;cursor:pointer;text-decoration:none;border:1px solid #fff}
.btn-home{background:#fff;color:#000}
.btn-orange{background:#ff5000;color:#fff}
.section{padding:10px}
.h2{color:#ffeb3b;font-size:13px;font-weight:900;margin:12px 0 6px 0;border-left:4px solid #ff5000;padding-left:8px}
.input{width:calc(100% - 20px);background:#000;color:#fff;padding:10px;border:2px solid #ff5000;border-radius:8px;margin:8px 10px;box-sizing:border-box;text-align:center;font-weight:bold}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 10px}
.tab{background:#222;color:#fff;border:1px solid #444;padding:8px 12px;border-radius:20px;font-size:11px;font-weight:800;cursor:pointer}
.tab.active{background:#ff5000;color:#fff;border-color:#fff}
.bubble{background:#000;color:#ffeb3b;padding:1px 6px;border-radius:10px;margin-left:5px;font-size:10px;border:1px solid #ff5000}
.bubble.has{background:#ff5000;color:#fff;animation:pulse 1s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.15)}100%{transform:scale(1)}}
.wrap{background:#0f0f0f;border-radius:8px;overflow:auto;max-height:70vh;border:1px solid #333;margin:0 10px}
table{width:100%;border-collapse:collapse;font-size:11px}
th,td{border:1px solid #333;padding:6px;text-align:left}
th{background:#ff5000;position:sticky;top:0;z-index:2;font-size:10px}
tr:hover{background:#2a2a2a}
.btn-sm{border:none;padding:5px 8px;border-radius:4px;font-weight:800;cursor:pointer;font-size:10px;margin:1px}
.btn-save{background:#0d6efd;color:#fff}
.btn-edit{background:#ff9800;color:#000}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:99;padding:10px}
#mBox{background:#1e1e1e;border:2px solid #ff5000;border-radius:14px;max-width:520px;width:100%;padding:14px;max-height:92vh;overflow:auto}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #333;font-size:12px;gap:8px;flex-wrap:wrap}
.row label{font-size:10px;color:#aaa;width:80px}
.row input{flex:1;background:#000;color:#fff;border:1px solid #555;border-radius:6px;padding:7px;font-size:12px;min-width:120px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 10px}
.sbox{background:#000;border:1px solid #333;border-radius:8px;padding:8px;text-align:center}
.sval{font-weight:900;font-size:14px;color:#0f0}
.slab{font-size:8px;color:#aaa}
</style>
</head>
<body>
<div class="app">
<div class="top">
  <div><b style="color:#ffeb3b">🔧 ADMIN FINAL MAYNE</b><br><small id="adminPhone" style="color:#0f0;font-size:10px"></small></div>
  <div style="display:flex;gap:6px">
    <a href="index.html" class="btn btn-home">🏠 ACCUEIL</a>
    <button class="btn btn-orange" onclick="loadAllCounts()">🔄 RELOAD</button>
  </div>
</div>
<div class="tabs">
  <button class="tab active" id="tab-users" onclick="switchMain('users')">👥 TOUS LES USERS</button>
  <button class="tab" id="tab-cmd" onclick="switchMain('cmd')">📦 COMMANDES <span class="bubble" id="bubble-all">0</span></button>
</div>
<div id="sec-users" class="section">
  <div class="h2">1/ TOUS LES USERS</div>
  <input id="searchUser" class="input" placeholder="🔍 Rechercher..." oninput="filterUsers()">
  <div class="stats">
    <div class="sbox"><div class="sval" id="uCount">0</div><div class="slab">USERS</div></div>
    <div class="sbox"><div class="sval" id="uSolde" style="color:#0f0">0</div><div class="slab">SOLDE</div></div>
    <div class="sbox"><div class="sval" id="uCom" style="color:#ffeb3b">0</div><div class="slab">COM</div></div>
    <div class="sbox"><div class="sval" id="uEp" style="color:#f0f">0</div><div class="slab">EPARGNE</div></div>
  </div>
  <div class="wrap"><table><thead><tr><th>Nom</th><th>Prénom</th><th>Numéro</th><th>Email</th><th>Solde</th><th>Com</th><th>Epargne</th><th>💾</th></tr></thead><tbody id="tbodyUsers"></tbody></table></div>
</div>
<div id="sec-cmd" class="section" style="display:none">
  <div class="h2">2/ COMMANDES - 5 dernières (plus récente en haut)</div>
  <div style="display:flex;flex-wrap:wrap;gap:6px;margin:8px 10px" id="cmdButtons"></div>
  <input id="searchCmd" class="input" placeholder="🔍 Rechercher..." oninput="filterCmd()" style="margin:8px 10px;width:calc(100% - 20px)">
  <div class="wrap"><table><thead><tr><th>Service</th><th>Client</th><th>Montant</th><th>Statut (éditable)</th><th>Date</th><th>Actions</th></tr></thead><tbody id="tbodyCmd"><tr><td colspan="6" style="text-align:center;padding:20px">Clique un service</td></tr></tbody></table></div>
</div>
</div>
<div id="modal" onclick="if(event.target==this) closeModal()"><div id="mBox"><h3 id="mTitle" style="color:#ff5000">Détail</h3><div id="mContent"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px"><button class="btn-sm" style="padding:12px;background:#28a745;color:#fff" onclick="saveModalChanges()">💾 SAUVEGARDER</button><button class="btn-sm" style="padding:12px;background:#dc3545;color:#fff" onclick="deleteCurrentCmd()">🗑️ SUPPRIMER</button></div><button class="btn" style="width:100%;margin-top:8px;background:#333;color:#fff" onclick="closeModal()">Fermer</button></div></div>
<script>
const firebaseConfig={apiKey:"AIzaSyDR0zDiGxisp4G-CDjltu8VFmxMMFjXI9E",authDomain:"mayneilliminetdb.firebaseapp.com",databaseURL:"https://mayneilliminetdb-default-rtdb.firebaseio.com",projectId:"mayneilliminetdb",storageBucket:"mayneilliminetdb.appspot.com",messagingSenderId:"904857888891",appId:"1:904857888891:web:a89e339ea89de0340a5ade"};
if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);var db=firebase.database();
const ADMIN_LIST=["0158612131","2290158612131","158612131"];
function getPhone(){try{let p=JSON.parse(localStorage.getItem('mayne_current_user')||'{}')?.phone;if(p)return p;p=JSON.parse(localStorage.getItem('mayne_'+'current_user')||'{}')?.phone;if(p)return p;}catch(e){}return null;}
function isAdmin(p){if(!p)return false;const c=p.replace(/\D/g,'');return ADMIN_LIST.some(a=>c.endsWith(a.replace(/\D/g,'').slice(-8)));}
const curPhone=getPhone();if(!isAdmin(curPhone)){document.body.innerHTML='⛔ Admin 0158612131 seulement';throw 'not admin';}document.getElementById('adminPhone').innerText='Admin: '+curPhone+' ✅';
const SERVICES=[
  {key:'depots',label:'Dépôts',possible:['commandes_depots','depots']},
  {key:'retraits',label:'Retrait',possible:['commandes_retraits','retraits']},
  {key:'epargne',label:'Épargne',possible:['epargne','commandes_epargne','commandes_epargnes']},
  {key:'1xbet',label:'1XBET',possible:['commandes_1xbet']},
  {key:'forfaits',label:'FORFAIT',possible:['commandes_forfaits']},
  {key:'factures',label:'Facture',possible:['commandes_factures']},
  {key:'transferts',label:'Transfert',possible:['commandes_transferts','commandes_echanges']},
  {key:'echanges',label:'Echanges',possible:['commandes_echanges']}
];
let allUsers=[],currentService=null,currentModalItem=null;
function switchMain(tab){document.getElementById('sec-users').style.display=tab==='users'?'block':'none';document.getElementById('sec-cmd').style.display=tab==='cmd'?'block':'none';document.getElementById('tab-users').classList.toggle('active',tab==='users');document.getElementById('tab-cmd').classList.toggle('active',tab==='cmd');if(tab==='cmd')loadAllCounts();}
function loadUsers(){db.ref('clients').on('value',snap=>{allUsers=[];let totS=0,totC=0,totE=0;snap.forEach(ch=>{const v=ch.val();const phone=ch.key;allUsers.push({key:phone,nom:v.nom||'',prenom:v.prenom||'',phone,email:v.email||'',solde:v.solde||0,commission:v.commission||0,recompense:v.recompense||0});totS+=(v.solde||0);totC+=(v.commission||0);totE+=(v.recompense||0);});document.getElementById('uCount').innerText=allUsers.length;document.getElementById('uSolde').innerText=totS.toLocaleString()+' F';document.getElementById('uCom').innerText=totC.toLocaleString()+' F';document.getElementById('uEp').innerText=totE.toLocaleString()+' F';renderUsers(allUsers);});}
function renderUsers(list){const tb=document.getElementById('tbodyUsers');tb.innerHTML='';list.slice(0,500).forEach(u=>{const tr=document.createElement('tr');tr.innerHTML=`<td><b>${u.nom}</b></td><td>${u.prenom}</td><td><b style="color:#ffeb3b">${u.phone}</b></td><td style="max-width:120px;overflow:hidden;font-size:10px">${u.email}</td><td><input id="solde-${u.key}" type="number" value="${u.solde}" style="width:70px;background:#000;color:#0f0;border:1px solid #333;border-radius:4px;padding:3px"></td><td><input id="com-${u.key}" type="number" value="${u.commission}" style="width:70px;background:#000;color:#ffeb3b;border:1px solid #333;border-radius:4px;padding:3px"></td><td><input id="ep-${u.key}" type="number" value="${u.recompense}" style="width:70px;background:#000;color:#f0f;border:1px solid #333;border-radius:4px;padding:3px"></td><td><button class="btn-sm btn-save" onclick="saveUser('${u.key}')">💾</button></td>`;tb.appendChild(tr);});}
function filterUsers(){const q=document.getElementById('searchUser').value.toLowerCase();renderUsers(allUsers.filter(u=>(u.nom||'').toLowerCase().includes(q)||(u.prenom||'').toLowerCase().includes(q)||u.phone.includes(q)||(u.email||'').toLowerCase().includes(q)));}
function saveUser(phone){const s=Number(document.getElementById('solde-'+phone).value);const c=Number(document.getElementById('com-'+phone).value);const e=Number(document.getElementById('ep-'+phone).value);db.ref('clients/'+phone).update({solde:s,commission:c,recompense:e}).then(()=>alert('✅ '+phone));}
async function loadAllCounts(){const container=document.getElementById('cmdButtons');container.innerHTML='Scan...';let total=0;const counts={};for(const svc of SERVICES){let cnt=0;for(const path of svc.possible){try{const snap=await db.ref(path).once('value');if(!snap.exists())continue;snap.forEach(ch=>{const v=ch.val();const st=((v.statut||v.status||'')+'').toLowerCase();const isVal=st.includes('valid')||st.includes('succes');const isRej=st.includes('rejet')||st.includes('annul');if(!isVal&&!isRej)cnt++;});svc.foundPath=path;break;}catch(e){}}counts[svc.key]=cnt;total+=cnt;}document.getElementById('bubble-all').innerText=total;container.innerHTML='';SERVICES.forEach(svc=>{const c=counts[svc.key]||0;const btn=document.createElement('button');btn.className='tab';btn.style.borderColor=c>0?'#ff5000':'#444';const found=svc.foundPath?`<small style="font-size:7px;color:#0f0">${svc.foundPath}</small>`:`<small style="font-size:7px;color:#f00">non trouvé</small>`;btn.innerHTML=`${svc.label} <span class="bubble ${c>0?'has':''}">[${c}]</span><br>${found}`;btn.onclick=()=>loadService(svc.key);container.appendChild(btn);});}
async function loadService(key){currentService=key;const svc=SERVICES.find(s=>s.key===key);const tb=document.getElementById('tbodyCmd');tb.innerHTML='<tr><td colspan="6" style="text-align:center">Chargement 5 dernières '+svc.label+'...</td></tr>';let all=[];for(const path of svc.possible){try{const snap=await db.ref(path).limitToLast(20).once('value');snap.forEach(ch=>{const v=ch.val();all.push({id:ch.key,path,label:svc.label,client:v.client_id||v.phone||'',montant:v.montant||v.total||0,statut:v.statut||v.status||'en cours',date:v.date||v.created_at||'',data:v});});}catch(e){}}all.sort((a,[STRIPPED] da=(a.date||'').toString();const db2=(b.date||'').toString();if(da&&db2)return db2.localeCompare(da);return b.id.localeCompare(a.id);});const last5=all.slice(0,5);renderCmd(last5);}
function renderCmd(list){const tb=document.getElementById('tbodyCmd');tb.innerHTML='';if(list.length===0){tb.innerHTML='<tr><td colspan="6" style="text-align:center">Aucune</td></tr>';return;}list.forEach(item=>{const safe=item.id.replace(/[^a-zA-Z0-9]/g,'_');const tr=document.createElement('tr');tr.innerHTML=`<td onclick="openDetail('${item.path}','${item.id}')"><b style="color:#ffeb3b">${item.label}</b></td><td onclick="openDetail('${item.path}','${item.id}')"><b>${item.client}</b></td><td><b style="color:#0f0">${item.montant} F</b></td><td><input id="statut-${safe}" type="text" value="${item.statut}" style="width:100px;background:#000;color:#ffeb3b;border:1px solid #555;border-radius:4px;padding:4px;font-size:10px"><button class="btn-sm btn-save" onclick="saveStatut('${item.path}','${item.id}','${safe}')">💾</button></td><td><small>${(item.date||'').toString().slice(0,16)}</small></td><td><button class="btn-sm btn-edit" onclick="openDetail('${item.path}','${item.id}')">👁️ Modifier tout</button></td>`;tb.appendChild(tr);});}
function filterCmd(){const q=document.getElementById('searchCmd').value.toLowerCase();document.querySelectorAll('#tbodyCmd tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none');}
function saveStatut(path,id,safe){const ns=document.getElementById('statut-'+safe).value;if(!ns)return;db.ref(path+'/'+id+'/statut').set(ns).then(()=>{db.ref(path+'/'+id+'/status').set(ns);db.ref(path+'/'+id+'/updated_at').set(new Date().toISOString());alert('✅ Statut: '+ns);});}
function openDetail(path,id){db.ref(path+'/'+id).once('value').then(snap=>{const v=snap.val();if(!v)return;currentModalItem={path,id,data:[STRIPPED]'mTitle').innerText=path+' - '+id;let html='';html+=`<div class="row"><label>Client</label><input id="edit-client" value="${v.client_id||v.phone||''}"></div>`;html+=`<div class="row"><label>Montant</label><input id="edit-montant" type="number" value="${v.montant||v.total||0}"></div>`;html+=`<div class="row"><label>Statut</label><input id="edit-statut" value="${v.statut||v.status||''}" placeholder="validé, rejeté..."></div>`;html+=`<div class="row"><label>Date</label><input id="edit-date" value="${v.date||''}"></div>`;html+=`<div class="row"><label>Type</label><input id="edit-type" value="${v.type||''}"></div>`;document.getElementById('mContent').innerHTML=html;document.getElementById('modal').style.display='flex';});}
function saveModalChanges(){if(!currentModalItem)return;const {path,id}=currentModalItem;const nc=document.getElementById('edit-client').value;const nm=Number(document.getElementById('edit-montant').value);const ns=document.getElementById('edit-statut').value;const nd=document.getElementById('edit-date').value;const nt=document.getElementById('edit-type').value;db.ref(path+'/'+id).update({client_id:nc,phone:nc,montant:nm,total:nm,statut:ns,status:ns,date:nd,type:nt,updated_at:new Date().toISOString(),updated_by:'admin_'+curPhone}).then(()=>{alert('✅ Modifié: '+ns);closeModal();loadService(currentService);});}
function deleteCurrentCmd(){if(!currentModalItem)return;if(!confirm('Supprimer '+currentModalItem.id+' ?'))return;db.ref(currentModalItem.path+'/'+currentModalItem.id).remove().then(()=>{alert('Supprimée');closeModal();loadService(currentService);});}
function closeModal(){document.getElementById('modal').style.display='none';}
loadUsers();loadAllCounts();firebase.auth().onAuthStateChanged(function(user){
  if(user){ init(); } 
  else { firebase.auth().signInAnonymously(); }
});
</script>
</body>
</html>
