<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AppDans Player V3 - Auto Scan</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif}
body{background:#0a0a0a;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:14px}
.header{width:100%;max-width:560px;text-align:center;margin:10px 0}
.header h1{font-size:24px;font-weight:900} .header h1 span{color:#1DB954}
.header p{opacity:.55;font-size:12px;margin-top:4px}
.card{width:100%;max-width:560px;background:#151515;border-radius:20px;padding:14px;border:1px solid #222}
.top-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{padding:14px;border-radius:14px;border:0;font-weight:800;font-size:13px;cursor:pointer}
.btn-green{background:#1DB954;color:#000}
.btn-dark{background:#2a2a2a;color:#fff}
.search{width:100%;margin:12px 0;padding:12px 14px;border-radius:12px;border:1px solid #333;background:#1e1e1e;color:#fff;font-size:14px}
.list{max-height:42vh;overflow:auto;border-radius:12px;background:#0f0f0f;border:1px solid #1e1e1e}
.item{padding:11px 12px;border-bottom:1px solid #1a1a1a;cursor:pointer;display:flex;justify-content:space-between;gap:10px;font-size:13px;align-items:center}
.item.active{background:#1DB9541a;color:#1DB954;border-left:3px solid #1DB954}
.item .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.count{font-size:11px;opacity:.5;margin:8px 2px}
.player{margin-top:12px;background:#1e1e1e;border-radius:16px;padding:14px;border:1px solid #2a2a2a}
.title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.seek{width:100%;margin:10px 0;accent-color:#1DB954;height:4px}
.time{display:flex;justify-content:space-between;font-size:11px;opacity:.6}
.controls{display:flex;justify-content:center;gap:10px;align-items:center;margin-top:10px}
.controls button{width:46px;height:46px;border-radius:50%;border:0;background:#2a2a2a;color:#fff;font-size:18px}
.controls button.play{width:62px;height:62px;background:#1DB954;color:#000;font-size:26px}
.modes{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.mode-btn{padding:7px 11px;border-radius:20px;border:1px solid #333;background:#2a2a2a;color:#fff;font-size:11px;cursor:pointer}
.mode-btn.on{background:#1DB954;color:#000;border-color:#1DB954;font-weight:800}
.ab-box{margin-top:12px;background:#111;border:1px dashed #333;border-radius:12px;padding:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ab-box button{padding:6px 10px;border-radius:8px;border:1px solid #333;background:#2a2a2a;color:#fff;font-size:11px}
.ab-box button.on{background:#1DB954;color:#000}
.hint{font-size:11px;opacity:.35;text-align:center;margin-top:10px}
</style>
</head>
<body>
<div class="header"><h1>AppDans <span>Player V3</span></h1><p>Scan auto • Mémorise tout • Tout lire en boucle • 100% offline</p></div>
<div class="card">
<div class="top-actions">
<button class="btn btn-green" id="pickFolderBtn">📁 Scanner dossier Musique</button>
<button class="btn btn-dark" id="pickFilesBtn">🎵 Choisir fichiers</button>
</div>
<input type="file" id="fileInput" accept=".mp3,.m4a,.wav,.ogg,.flac,audio/*" multiple hidden>
<input type="file" id="folderInput" accept=".mp3,.m4a,.wav,.ogg,.flac,audio/*" multiple webkitdirectory hidden>
<input type="text" id="search" class="search" placeholder="Rechercher une chanson...">
<div class="count" id="count">Aucune chanson chargée</div>
<div class="list" id="list"></div>
<div class="player" id="playerBox" style="display:none">
<div class="title" id="nowTitle"></div>
<input type="range" id="seek" class="seek" value="0">
<div class="time"><span id="cur">0:00</span><span id="dur">0:00</span></div>
<div class="controls">
<button id="prevBtn">⏮</button>
<button class="play" id="playBtn">▶</button>
<button id="nextBtn">⏭</button>
</div>
<div class="modes">
<button class="mode-btn" id="loopBtn">🔁 Boucle: OFF</button>
<button class="mode-btn" id="shuffleBtn">🔀 Aléatoire: OFF</button>
<button class="mode-btn on" id="allBtn">▶ Tout lire: ON</button>
<button class="mode-btn" id="clearBtn">🗑 Vider</button>
</div>
<div class="ab-box">
<span>AB Repeat (VLC):</span>
<button id="aBtn">Set A [ 0:00 ]</button>
<button id="bBtn">Set B [ 0:00 ]</button>
<button id="clearAB">Effacer</button>
<span id="abStatus" style="font-size:11px;opacity:.6"></span>
</div>
</div>
<div class="hint">Première fois : clique sur "Scanner dossier Musique" puis choisis le dossier Music / Download. Après, tout reste mémorisé automatiquement.</div>
</div>
<audio id="audio" preload="metadata"></audio>
<script>
const $=id=>document.getElementById(id);
const fileInput=$('fileInput'), folderInput=$('folderInput'), pickFilesBtn=$('pickFilesBtn'), pickFolderBtn=$('pickFolderBtn');
const listEl=$('list'), audio=$('audio'), playBtn=$('playBtn'), prevBtn=$('prevBtn'), nextBtn=$('nextBtn'), seek=$('seek'), nowTitle=$('nowTitle'), playerBox=$('playerBox'), curEl=$('cur'), durEl=$('dur'), loopBtn=$('loopBtn'), shuffleBtn=$('shuffleBtn'), allBtn=$('allBtn'), clearBtn=$('clearBtn'), searchEl=$('search'), countEl=$('count');
const aBtn=$('aBtn'), bBtn=$('bBtn'), clearAB=$('clearAB'), abStatus=$('abStatus');
let tracks=[], filteredTracks=[], index=0, loopMode=0, shuffle=false, playAll=true, pointA=null, pointB=null;
const DB_NAME='appdans_v3', STORE='tracks';
function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,1); r.onupgradeneeded=()=>r.result.createObjectStore(STORE); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);});}
async function idbSaveAll(files){const db=await idbOpen(); const tx=db.transaction(STORE,'readwrite'); const s=tx.objectStore(STORE); s.clear(); for(let f of files){ await new Promise(r=>{const req=s.add({name:f.name, blob:f, lastModified:f.lastModified}); req.onsuccess=r; req.onerror=r;});}}
async function idbLoad(){try{const db=await idbOpen(); const tx=db.transaction(STORE,'readonly'); const s=tx.objectStore(STORE); const all=await new Promise(res=>{const req=s.getAll(); req.onsuccess=()=>res(req.result); req.onerror=()=>res([]);}); if(all.length){const files=all.map(o=>o.blob); setTracks(files,false);}}catch(e){}}
function setTracks(fileList, save=true){
  const audioFiles = Array.from(fileList).filter(f=>f.type.startsWith('audio/') || /\.(mp3|m4a|wav|ogg|flac|aac)$/i.test(f.name));
  if(!audioFiles.length){ alert('Aucun fichier audio trouvé'); return; }
  audioFiles.sort((a,b)=>a.name.localeCompare(b.name));
  tracks = audioFiles.map((f,i)=>({id:i, name:f.name, file:f, url: URL.createObjectURL(f)}));
  filteredTracks = [...tracks];
  if(save){ idbSaveAll(audioFiles); }
  render(); if(tracks.length){ loadByFiltered(0,false); }
}
function render(){
  listEl.innerHTML=''; filteredTracks.forEach((t,fi)=>{
    const realIndex = tracks.indexOf(t);
    const d=document.createElement('div'); d.className='item'+(realIndex===index?' active':'');
    d.innerHTML=`<span class="n">${t.name}</span><span>${fi+1}</span>`; d.onclick=()=>{ index=realIndex; load(index,true); }; listEl.appendChild(d);
  });
  countEl.textContent = `${filteredTracks.length} / ${tracks.length} chansons - Boucle Tout ${playAll?'ON':'OFF'}`;
}
function load(i,auto){ index=i; const t=tracks[index]; if(!t) return; audio.src=t.url; nowTitle.textContent=t.name; playerBox.style.display='block'; pointA=null; pointB=null; updateAB(); render(); if(auto){ audio.play().then(()=>playBtn.textContent='⏸'); }}
function loadByFiltered(fi,auto){ const t=filteredTracks[fi]; if(!t) return; index=tracks.indexOf(t); load(index,auto); }
pickFilesBtn.onclick=()=>fileInput.click(); pickFolderBtn.onclick=()=>folderInput.click();
fileInput.onchange=e=>{ if(e.target.files.length) setTracks(e.target.files,true); };
folderInput.onchange=e=>{ if(e.target.files.length) setTracks(e.target.files,true); };
searchEl.oninput=()=>{ const q=searchEl.value.toLowerCase(); filteredTracks = q ? tracks.filter(t=>t.name.toLowerCase().includes(q)) : [...tracks]; render(); };
function fmt(s){ if(isNaN(s)) return '0:00'; const m=Math.floor(s/60), sec=Math.floor(s%60).toString().padStart(2,'0'); return m+':'+sec; }
playBtn.onclick=()=>{ if(audio.paused){ audio.play(); playBtn.textContent='⏸'; } else { audio.pause(); playBtn.textContent='▶'; } };
prevBtn.onclick=()=>{ if(audio.currentTime>3){ audio.currentTime=0; return; } if(shuffle){ load(Math.floor(Math.random()*tracks.length),true); } else if(index>0) load(index-1,true); else if(loopMode===1) load(tracks.length-1,true); };
nextBtn.onclick=()=>nextTrack();
function nextTrack(){ if(shuffle){ load(Math.floor(Math.random()*tracks.length),true); return; } if(index < tracks.length-1) load(index+1,true); else { if((loopMode===1||playAll) && tracks.length) load(0,true); else playBtn.textContent='▶'; } }
loopBtn.onclick=()=>{ loopMode=(loopMode+1)%3; loopBtn.textContent=['🔁 Boucle: OFF','🔁 Boucle: TOUT','🔂 Boucle: UN'][loopMode]; loopBtn.classList.toggle('on',loopMode!==0); audio.loop=(loopMode===2); };
shuffleBtn.onclick=()=>{ shuffle=!shuffle; shuffleBtn.textContent=`🔀 Aléatoire: ${shuffle?'ON':'OFF'}`; shuffleBtn.classList.toggle('on',shuffle); };
allBtn.onclick=()=>{ playAll=!playAll; allBtn.textContent=`▶ Tout lire: ${playAll?'ON':'OFF'}`; allBtn.classList.toggle('on',playAll); render(); };
clearBtn.onclick=async()=>{ if(confirm('Vider toute la liste ?')){ tracks=[]; filteredTracks=[]; render(); playerBox.style.display='none'; audio.pause(); const db=await idbOpen(); db.transaction(STORE,'readwrite').objectStore(STORE).clear(); countEl.textContent='Liste vidée'; } };
aBtn.onclick=()=>{ pointA=audio.currentTime; updateAB(); }; bBtn.onclick=()=>{ pointB=audio.currentTime; if(pointA!==null&&pointB!==null&&pointB<=pointA){ [pointA,pointB]=[pointB,pointA]; } updateAB(); }; clearAB.onclick=()=>{ pointA=null; pointB=null; updateAB(); };
function updateAB(){ aBtn.textContent=`Set A [ ${pointA!==null?fmt(pointA):'0:00'} ]`; bBtn.textContent=`Set B [ ${pointB!==null?fmt(pointB):'0:00'} ]`; aBtn.classList.toggle('on',pointA!==null); bBtn.classList.toggle('on',pointB!==null); if(pointA!==null&&pointB!==null) abStatus.textContent=`🔁 AB ${fmt(pointA)} → ${fmt(pointB)}`; else if(pointA!==null) abStatus.textContent=`A à ${fmt(pointA)}, attends B`; else abStatus.textContent=''; }
audio.ontimeupdate=()=>{ if(pointA!==null&&pointB!==null){ if(audio.currentTime>=pointB){ audio.currentTime=pointA; } } seek.value = audio.duration? audio.currentTime/audio.duration*100:0; curEl.textContent=fmt(audio.currentTime); durEl.textContent=fmt(audio.duration); };
seek.oninput=()=>{ if(audio.duration) audio.currentTime=seek.value/100*audio.duration; };
audio.onended=()=>{ if(loopMode===2){ audio.currentTime=0; audio.play(); return; } if(playAll||loopMode===1) nextTrack(); else playBtn.textContent='▶'; };
idbLoad();
</script>
</body>
</html>
