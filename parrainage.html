<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parrainage - MAYNE</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#f5000;color:#fff;display:flex;justify-content:center}
.app{max-width:430px;width:100%;min-height:100vh;background:#1e1e1e;padding-bottom:90px;border:5px solid #fff}
.top{padding:16px;display:flex;justify-content:space-between;align-items:center}
.card{margin:12px 16px;background:#aaaa;border:10px solid #ff5000;border-radius:22px;padding:18px;text-align:center}
.code{font-size:32px;font-weight:900;letter-spacing:4px;color:#ffeb3b;background:#000;padding:14px;border-radius:12px;border:2px dashed #ff5000;margin:12px 0}
.btn{width:100%;border:none;border-radius:100px;padding:14px;font-weight:800;color:#fff;cursor:pointer;margin-top:10px;background:#ff5000}
.list{padding:16px}.item{background:#000;border-radius:12px;padding:10px;margin-bottom:6px;display:flex;justify-content:space-between;font-size:12px}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:430px;width:100%;background:#000;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #333}
.bnav{border:none;background:none;font-size:11px;color:#fff;cursor:pointer;padding:8px 12px}
.bnav.active{background:#ff5000;color:#fff;border-radius:100px;font-weight:700}
/* SCHEMA ARBRE */
.tree{padding:12px;background:#000;border-radius:12px;margin-top:10px;text-align:left}
.tree ul{margin-left:18px;border-left:1px dashed #ff5000;padding-left:12px;list-style:none}
.tree li{position:relative;padding:6px 0}
.tree li::before{content:"";position:absolute;left:-13px;top:16px;width:12px;height:1px;background:#ff5000}
.node{background:#1e1e1e;border:1px solid #ff5000;border-radius:20px;padding:6px 10px;display:inline-flex;gap:6px;align-items:center;font-size:12px}
.badge{font-size:10px;padding:2px 6px;border-radius:100px;background:#ff5000}
.lv1.node{border-color:#0f0}.lv2.node{border-color:#ffeb3b}.lv3.node{border-color:#00bfff}
</style>
</head>
<body>
<div class="app">
<div class="top"><b>👥 PARRAINAGE</b><button class="bnav" onclick="location.href='index.html'">Retour</button></div>

<div class="card">
<div style="font-size:12px;color:#000;font-weight:700">TON CODE PARRAIN UNIQUE</div>
<div class="code" id="code-affiche">...</div>
<button class="btn" onclick="copierCode()">📋 Copier le code</button>
<div style="margin-top:10px;font-size:11px;color:#000">Gain: <b id="gain">0F</b> | N1: <b id="c1">0</b> | N2: <b id="c2">0</b> | N3: <b id="c3">0</b></div>
</div>

<div class="list">
<h3 style="font-size:14px">📊 Schéma de mon réseau</h3>
<div class="tree" id="tree">Chargement...</div>
<h3 style="font-size:14px;margin-top:16px">Mes filleuls directs (<span id="nb">0</span>)</h3>
<div id="histo">Aucun filleul</div>
</div>
</div>

<div class="bottom"><button class="bnav" onclick="location.href='index.html'">🏠 ACCUEIL</button><button class="bnav active">PARRAINAGE👥</button><button class="bnav" onclick="location.href='transfert.html'">TRANSFERT💸</button></div>

<script>
var cfg={apiKey:"AIzaSyDR0zDiGxisp4G-CDjltu8VFmxMMFjXI9E",authDomain:"mayneilliminetdb.firebaseapp.com",databaseURL:"https://mayneilliminetdb-default-rtdb.firebaseio.com",projectId:"mayneilliminetdb"};
if(!firebase.apps.length)firebase.initializeApp(cfg);
var db=firebase.database();
var uid="";

function init(){
  var u=JSON.parse(localStorage.getItem('mayne_current_user')||'null');
  if(!u||!u.phone){location.href='index.html';return;}
  uid=u.phone.replace(/\D/g,'');
  document.getElementById('code-affiche').innerText=uid;

  db.ref('clients/'+uid).on('value',s=>{
    document.getElementById('gain').innerText=(s.val()?.gain_parrainage||0)+'F';
  });

  db.ref('clients').on('value',s=>{
    let all={};
    s.forEach(ch=>{ all[ch.key] = {key:ch.key, nom:ch.val().nom||'Sans nom', parrain:(ch.val().parrain||'').replace(/\D/g,'')} });

    // Construire arbre
    let children = {};
    Object.values(all).forEach(c=>{
      if(!c.parrain) return;
      if(!children[c.parrain]) children[c.parrain]=[];
      children[c.parrain].push(c);
    });

    let direct = children[uid]||[];
    document.getElementById('nb').innerText=direct.length;
    let histo=document.getElementById('histo');
    histo.innerHTML = direct.length? '' : 'Aucun filleul. Partage ton code!';
    direct.forEach(d=>{ histo.innerHTML+=`<div class=item><div><b>${d.nom}</b><br><small>${d.key}</small></div><div style="color:#0f0">N1</div></div>`; });

    // Compter niveaux
    let n2=0,n3=0;
    direct.forEach(d1=>{
      let l2 = children[d1.key]||[];
      n2+=l2.length;
      l2.forEach(d2=>{
        let l3 = children[d2.key]||[];
        n3+=l3.length;
      });
    });
    document.getElementById('c1').innerText=direct.length;
    document.getElementById('c2').innerText=n2;
    document.getElementById('c3').innerText=n3;

    // RENDU SCHEMA
    let treeDiv=document.getElementById('tree');
    function renderNode(user, level){
      let cls = level===1?'lv1':level===2?'lv2':'lv3';
      let html = `<li class="${cls}"><span class="node"><b>${user.nom}</b> <small>${user.key}</small> <span class="badge">N${level}</span></span>`;
      let childs = children[user.key]||[];
      if(childs.length && level<3){
        html+='<ul>';
        childs.forEach(ch=>{ html+=renderNode(ch, level+1); });
        html+='</ul>';
      }
      html+='</li>';
      return html;
    }

    let html=`<ul><li><span class="node" style="background:#ff5000"><b>TOI</b> ${uid} <span class="badge">ROOT</span></span><ul>`;
    direct.forEach(d=>{ html+=renderNode(d,1); });
    html+='</ul></li></ul>';
    if(direct.length===0) html='<small style="color:#aaa">Pas encore de filleuls. Ton schéma apparaîtra ici.</small>';
    treeDiv.innerHTML=html;
  });
}

function copierCode(){navigator.clipboard.writeText(uid);alert('Code copié: '+uid);}
firebase.auth().onAuthStateChanged(function(user){
  if(user){ init(); } 
  else { firebase.auth().signInAnonymously(); }
});
</script>
</body>
</html>
