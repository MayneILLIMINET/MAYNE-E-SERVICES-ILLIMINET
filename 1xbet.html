<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>1XBET MAYNE</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyDR0zDiGxisp4G-CDjltu8VFmxMMFjXI9E",authDomain:"mayneilliminetdb.firebaseapp.com",databaseURL:"https://mayneilliminetdb-default-rtdb.firebaseio.com",projectId:"mayneilliminetdb"};
if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
const database=firebase.database(); const db=database;
const ADMIN_UID="0158612131";
const WEBHOOK_URL='https://script.google.com/macros/s/AKfycbwasVyjf7iuYpMoonjNy-byi-_DKBeg9VRUfrWsnXQSPJNDElCVgV67ZFiZjY-eckpH/exec';
const ONESIGNAL_WEBHOOK='https://script.google.com/macros/s/AKfycbzoM5bqwSZm83RtFHaJK58ByQCqByYc2hCk58GA-97h0FTsC4cqca12cj38w0tf7jxv/exec';
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#f5000;color:#fff;display:flex;justify-content:center}
.app{max-width:430px;width:100%;min-height:100vh;background:#1e1e1e;padding-bottom:90px;border:5px solid #fff;position:relative}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px}
.avatar{width:44px;height:44px;border-radius:50%;background:#feb3;display:flex;align-items:center;justify-content:center;font-weight:800}
.card{margin:12px 16px;background:#aaaa;border:10px solid #ff5000;border-radius:22px;padding:18px}
.montant{font-size:22px;font-weight:900;margin:8px 0}
.input{width:100%;background:#1e1e1e;color:#fff;padding:13px;border:1px solid #fff;border-radius:12px;margin:6px 0}
.select{width:100%;background:#1e1e1e;color:#fff;padding:13px;border:1px solid #fff;border-radius:12px;margin:6px 0}
.btn{width:100%;border:none;border-radius:100px;padding:14px;font-weight:800;color:#fff;cursor:pointer;margin-top:10px}
.btn-depot{background:#ff5000}.btn-retrait{background:#e67e22}.btn-valid{background:#2b8a3e}
.list{padding:16px}.item{background:#000;border-radius:12px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:430px;width:100%;background:#000;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #333}
.bnav{border:none;background:none;font-size:11px;color:#fff;cursor:pointer;padding:8px 12px}.bnav.active{background:#0f3d2e;color:#d6f78c;border-radius:100px;font-weight:700}
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:9999;padding:15px}.modal-box{background:#1e1e1e;color:#fff;padding:20px;border-radius:10px;max-width:300px;width:100%;text-align:center}.modal-btn{flex:1;padding:10px;border:none;border-radius:6px;font-weight:bold;cursor:pointer}.btn-yes{background:#2b8a3e;color:#fff}.btn-no{background:#ddd;color:#000}.modal-btns{display:flex;gap:8px;margin-top:12px}
.warning-box{background:#1e1e1e;border:2px dashed #ffeb3b;border-radius:12px;padding:12px;margin:10px 0;display:none;text-align:left}
.nb-red{background:#300;border:2px solid #ff0000;border-radius:12px;padding:10px;margin-bottom:10px;font-size:11px;color:#ffeb3b;text-align:left}.toggle{display:flex;gap:6px;margin-bottom:12px}.toggle button{flex:1}
</style>
</head>
<body>
<div class="app">
<div id="global-notif" style="display:none;position:fixed;top:15px;left:50%;transform:translateX(-50%);z-index:99999;background:#008000;color:#fff;padding:12px 18px;font-weight:bold;text-align:center;border-radius:8px;"></div>
<div class="top"><div style="display:flex;gap:10px;align-items:center"><div class="avatar" id="av">M</div><div><b id="uname">Chargement...</b><br><span id="uemail" style="font-size:11px;color:#aaa"></span></div></div><button class="bnav" onclick="location.href='notifications.html'">NOTIF🔔</button></div>
<div class="card"><div style="font-size:12px;color:#a8c0b6">Solde Principal</div><div class="montant" id="solde">0.00 XOF</div><div style="font-size:12px;color:#aaa">BONUS: <b id="com">0 XOF</b></div></div>
<div class="card">
<h3>1XBET</h3>
<div class="nb-red"><b>NB RETRAIT:</b> 1XBET > Retrait > Moyen = <b>Espèce</b>, VILLE: <b>ABOMEY-CALAVI</b>, RUE: <b>SECRÉTAIRE DE DIEU</b>. Copiez le code et collez ici.</div>
<div class="toggle"><button id="tab-depot" class="select" style="background:#ff5000" onclick="switchMode('depot')">Dépôt</button><button id="tab-retrait" class="select" style="background:#1e1e1e" onclick="switchMode('retrait')">Retrait</button></div>
<div id="zone-depot"><input id="xbet-id" class="input" placeholder="ID Joueur 1XBET"><input id="xbet-montant" type="number" class="input" placeholder="Montant minimum 300F"><input id="xbet-wa" class="input" placeholder="Numéro WhatsApp (facultatif)"><div id="warning-depot" class="warning-box"><div style="color:#ffeb3b;font-weight:bold;font-size:12px">⚠️ AVERTISSEMENT - FRAIS 1%</div><div id="detail-depot" style="font-size:11px;margin-top:8px;line-height:1.4"></div></div><button id="btn-depot" class="btn btn-depot" onclick="handleDepot()">Continuer</button></div>
<div id="zone-retrait" style="display:none"><input id="xbet-id-r" class="input" placeholder="ID Joueur 1XBET"><input id="xbet-montant-r" type="number" class="input" placeholder="Montant à retirer"><select id="xbet-methode" class="select"><option value="ESPECES">ESPÈCES</option></select><input id="xbet-num-benef" class="input" placeholder="Numéro bénéficiaire (facultatif)"><input id="xbet-code-recu" class="input" placeholder="CODE 1XBET REÇU *"><input id="xbet-wa-r" class="input" placeholder="Numéro WhatsApp (facultatif)"><div id="warning-retrait" class="warning-box"><div style="color:#ffeb3b;font-weight:bold;font-size:12px">⚠️ AVERTISSEMENT - FRAIS 1%</div><div id="detail-retrait" style="font-size:11px;margin-top:8px;line-height:1.4"></div></div><button id="btn-retrait" class="btn btn-retrait" onclick="handleRetrait()">Continuer</button></div>
<div id="xbet-status" style="margin-top:8px;font-size:12px;display:none;text-align:center"></div>
</div>
<div class="list"><h3>Mes transactions 1XBET</h3><div id="histo">Aucune opération</div></div>
</div>
<div class="bottom"><button class="bnav" onclick="location.href='index.html'">🏠 ACCUEIL</button><button class="bnav" onclick="location.href='epargne.html'">EPARGNE⭐</button><button class="bnav" onclick="location.href='p2p.html'">P2P🚀</button><button class="bnav active">1XBET🎲</button></div>
<div id="custom-alert" class="modal-overlay"><div class="modal-box"><div id="alert-msg"></div><button class="modal-btn btn-yes" style="margin-top:10px" onclick="hideAlert()">OK</button></div></div>
<div id="custom-confirm" class="modal-overlay"><div class="modal-box"><div id="confirm-msg"></div><div class="modal-btns"><button class="modal-btn btn-no" onclick="doConfirm(false)">Pas besoin</button><button class="modal-btn btn-yes" onclick="doConfirm(true)">Oui bien sûr</button></div></div></div>
<script>
let uid,userNom='Client',solde=0,_lock=false,confirmCallback=null,etapeDepot=1,etapeRetrait=1,depotMode='normal',depotMontant1xbet=0;
function showAlert(m){document.getElementById('alert-msg').innerText=m;document.getElementById('custom-alert').style.display='flex';}
function hideAlert(){document.getElementById('custom-alert').style.display='none';}
function showConfirm(m,cb){confirmCallback=cb;document.getElementById('confirm-msg').innerText=m;document.getElementById('custom-confirm').style.display='flex';}
function doConfirm(y){document.getElementById('custom-confirm').style.display='none';if(confirmCallback)confirmCallback(y);}
function envoyerAlerte(s,d){try{const p={service:s,id:Date.now(),data:Object.assign({},d,{client_id:uid,client_nom:userNom,telephone_compte:uid})};fetch(WEBHOOK_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(p),keepalive:true});}catch(e){}}
function afficherSucces(id){const m='commande envoyée avec succès!';const t=document.getElementById('global-notif');t.innerText='✅ '+m;t.style.display='block';setTimeout(()=>t.style.display='none',20000);const e=document.getElementById(id);if(e){e.innerText=m;e.style.display='block';e.style.color='#006400';}}
function proposerSupport(s,d,cb){let det='';for(const[k,v]of Object.entries(d)){det+=`${k}: ${v}\n`;}const txt=`🔔 URGENT\n🔈 SERVICE : ${s}\n👤 CLIENT : ${userNom}\n💬 DÉTAILS:\n${det}`;showConfirm('Voulez-vous contacter le personnel sur WhatsApp pour un traitement rapide?',function(y){if(y)window.open('https://wa.me/2290159415617?text='+encodeURIComponent(txt),'_blank');if(cb)cb();});}
async function pushJS(destId,titre,msg){try{await fetch(ONESIGNAL_WEBHOOK,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify({destId,titre,message:msg})});}catch(e){}}
async function crediterAdminFrais(frais){try{let snap=await db.ref('clients/'+ADMIN_UID).once('value');let cur=+(snap.val()?.recompense||0);await db.ref('clients/'+ADMIN_UID).update({recompense:cur+frais});}catch(e){}}
function switchMode(m){document.getElementById('tab-depot').style.background=m==='depot'?'#ff5000':'#1e1e1e';document.getElementById('tab-retrait').style.background=m==='retrait'?'#ff5000':'#1e1e1e';document.getElementById('zone-depot').style.display=m==='depot'?'block':'none';document.getElementById('zone-retrait').style.display=m==='retrait'?'block':'none';}
async function init(){
  let u=JSON.parse(localStorage.getItem('mayne_current_user')||'null');
  if(!u||!u.phone){location.href='index.html';return;}
  uid=u.phone.replace(/[^0-9]/g,'');userNom=u.nom||u.phone;
  document.getElementById('uname').textContent=userNom;document.getElementById('uemail').textContent=u.phone;document.getElementById('av').textContent=(userNom[0]||'M').toUpperCase();
  db.ref('clients/'+uid).on('value',s=>{let d=s.val()||{};solde=+d.solde||0;document.getElementById('solde').textContent=solde.toFixed(2)+' XOF';document.getElementById('com').textContent=(+d.commission||0).toFixed(2)+' XOF';});
  db.ref('commandes_1xbet').orderByChild('client_id').equalTo(uid).on('value',s=>{let c=document.getElementById('histo');if(!s.exists()){c.innerHTML='Aucune opération';return;}let h='';s.forEach(ch=>{let v=ch.val();let col='#ffbb00';if((v.statut||'').toLowerCase().includes('valid'))col='#28a745';if((v.statut||'').toLowerCase().includes('annul'))col='#dc3545';h=`<div class=item><div><b>${v.type} ID:${v.id_joueur}</b><br><small>${v.date} - Frais:${v.frais||0}F - Reçu:${v.montant_recu_1xbet||v.montant}F</small></div><div style="text-align:right"><b>${v.montant}F</b><br><span style="background:${col};color:#fff;padding:2px 6px;border-radius:4px;font-size:10px">${v.statut}</span></div></div>`+h;});c.innerHTML=h;});
}
function handleDepot(){
  if(etapeDepot===1){
    let id=document.getElementById('xbet-id').value.trim();
    let m=Number(document.getElementById('xbet-montant').value);
    if(!id||m<300)return showAlert('ID et montant min 300F requis');
    let frais=Math.ceil(m*0.01);let totalNormal=m+frais;
    if(solde >= totalNormal){depotMode='normal';depotMontant1xbet=m;document.getElementById('detail-depot').innerHTML=`<b>NB:</b> Frais 1% PSP.<br><br>Montant: <b>${m}F</b><br>Frais 1%: <b>${frais}F</b><br>Total débité: <b style="color:#ff5000">${totalNormal}F</b><br>Reçu sur 1XBET: <b>${m}F</b>`;}
    else if(solde >= m){depotMode='fallback';depotMontant1xbet=m-frais;document.getElementById('detail-depot').innerHTML=`<b>NB:</b> Frais 1%.<br><br>⚠️ Solde juste: <b>${solde}F</b><br>Mode adapté: Vous avez ${m}F exact<br>→ Reçu sur 1XBET: <b>${depotMontant1xbet}F</b> (${m}-${frais})<br>Total débité: <b style="color:#ff5000">${m}F</b>`;}
    else{return showAlert('Solde insuffisant: '+solde+'F');}
    document.getElementById('warning-depot').style.display='block';document.getElementById('btn-depot').innerText='Valider Dépôt';document.getElementById('btn-depot').className='btn btn-valid';etapeDepot=2;
  }else{executerDepot();}
}
async function executerDepot(){
  let id=document.getElementById('xbet-id').value.trim();let m=Number(document.getElementById('xbet-montant').value);let wa=document.getElementById('xbet-wa').value.trim();
  let frais=Math.ceil(m*0.01);let total=depotMode==='normal'?m+frais:m;let recu=depotMode==='normal'?m:m-frais;
  if(_lock)return;_lock=true;document.getElementById('btn-depot').innerText='Traitement...';
  try{await db.ref('clients/'+uid).update({solde:solde-total});await crediterAdminFrais(frais);let full={action:'depot',id_joueur:id,montant:m,montant_recu_1xbet:recu,frais:frais,total_debite:total,mode:depotMode,whatsapp:wa||''};pushJS(ADMIN_UID,"DEPOT 1XBET "+m+"F",`DEPOT ID:${id} Saisi:${m}F Reçu:${recu}F Frais:${frais}F Total:${total}F Mode:${depotMode} WA:${wa} Client:${uid}`);envoyerAlerte('1xbet',full);proposerSupport('1xbet',full,()=>afficherSucces('xbet-status'));db.ref('commandes_1xbet').push().set({...full,client_id:uid,type:'Dépôt',date:new Date().toLocaleString('fr-FR'),statut:'en cours'});document.getElementById('xbet-id').value='';document.getElementById('xbet-montant').value='';document.getElementById('xbet-wa').value='';document.getElementById('warning-depot').style.display='none';document.getElementById('btn-depot').innerText='Continuer';document.getElementById('btn-depot').className='btn btn-depot';etapeDepot=1;}catch(e){showAlert(e.message);}finally{_lock=false;}
}
function handleRetrait(){
  if(etapeRetrait===1){
    let id=document.getElementById('xbet-id-r').value.trim();let m=Number(document.getElementById('xbet-montant-r').value);let code=document.getElementById('xbet-code-recu').value.trim();
    if(!id||m<=0)return showAlert('ID et montant requis');if(!code)return showAlert('CODE 1XBET REÇU obligatoire');
    let frais=Math.ceil(m*0.01);if(solde<frais)return showAlert('Solde insuffisant pour frais 1%: '+frais+'F');
    document.getElementById('detail-retrait').innerHTML=`<b>NB:</b> Frais 1%.<br><br>Retrait: <b>${m}F</b><br>Frais: <b>${frais}F</b> sur solde`;
    document.getElementById('warning-retrait').style.display='block';document.getElementById('btn-retrait').innerText='Valider Retrait';document.getElementById('btn-retrait').className='btn btn-valid';etapeRetrait=2;
  }else{executerRetrait();}
}
async function executerRetrait(){
  let id=document.getElementById('xbet-id-r').value.trim();let m=Number(document.getElementById('xbet-montant-r').value);let methode=document.getElementById('xbet-methode').value;let numBenef=document.getElementById('xbet-num-benef').value.trim();let code=document.getElementById('xbet-code-recu').value.trim();let wa=document.getElementById('xbet-wa-r').value.trim();let frais=Math.ceil(m*0.01);
  if(_lock)return;_lock=true;document.getElementById('btn-retrait').innerText='Traitement...';
  try{await db.ref('clients/'+uid).update({solde:solde-frais});await crediterAdminFrais(frais);let full={action:'retrait',id_joueur:id,montant:m,frais:frais,methode:methode,numero_beneficiaire:numBenef||'N/A',code_1xbet_recu:code,whatsapp:wa||''};let alerte={code_1xbet:code,id_joueur:id,whatsapp:wa||'',montant:m,frais:frais};pushJS(ADMIN_UID,"RETRAIT 1XBET "+m+"F",`RETRAIT ID:${id} Montant:${m}F Frais:${frais}F Methode:${methode} CODE:${code} WA:${wa} Client:${uid}`);envoyerAlerte('1xbet',alerte);proposerSupport('1xbet',alerte,()=>afficherSucces('xbet-status'));db.ref('commandes_1xbet').push().set({...full,client_id:uid,type:'Retrait',date:new Date().toLocaleString('fr-FR'),statut:'en cours'});document.getElementById('xbet-id-r').value='';document.getElementById('xbet-montant-r').value='';document.getElementById('xbet-num-benef').value='';document.getElementById('xbet-code-recu').value='';document.getElementById('xbet-wa-r').value='';document.getElementById('warning-retrait').style.display='none';document.getElementById('btn-retrait').innerText='Continuer';document.getElementById('btn-retrait').className='btn btn-retrait';etapeRetrait=1;}catch(e){showAlert(e.message);}finally{_lock=false;}
}
window.onload=init;
</script>
</body>
</html>
