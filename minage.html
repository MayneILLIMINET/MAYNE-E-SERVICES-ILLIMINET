<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MINAGE PRO</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/core.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/md5.min.js"></script>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script>const firebaseConfig={apiKey:"AIzaSyDR0zDiGxisp4G-CDjltu8VFmxMMFjXI9E",databaseURL:"https://mayneilliminetdb-default-rtdb.firebaseio.com",projectId:"mayneilliminetdb"};if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);const database=firebase.database();firebase.auth().onAuthStateChanged(u=>{if(!u)firebase.auth().signInAnonymously()});</script>
<style>body{margin:0;font-family:system-ui,Arial;background:#080808;color:#fff}.app{max-width:480px;margin:0 auto;padding:16px 16px 110px}.logo{font-weight:900;font-size:20px}.logo span{color:#FF5A00}.btn{width:100%;padding:15px;border:none;border-radius:14px;background:#FF5A00;color:#fff;font-weight:900;margin-top:10px}.btn-green{width:100%;padding:15px;border:none;border-radius:14px;background:#00C853;color:#fff;font-weight:900;margin-top:10px}.btn-gold{width:100%;padding:13px;border:none;border-radius:14px;background:#FFD700;color:#000;font-weight:900;margin-top:10px}.inp{width:100%;padding:14px;border-radius:14px;border:1px solid #262626;background:#141414;color:#fff;margin-bottom:10px}.field label{font-size:12px;color:#888;display:block;margin-bottom:6px}.plan{background:#141414;border:1px solid #262626;border-radius:20px;padding:16px;margin-bottom:10px}.hero{background:#1B1B1B;border:1px solid #262626;border-radius:24px;padding:20px;text-align:center}.live{font-size:32px;font-weight:900}.pill{font-size:11px;padding:6px 10px;border-radius:999px;background:#FF5A00;font-weight:800}.pill.green{background:#0F2A1A;color:#2CE88A}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#0A0A0A;display:grid;grid-template-columns:repeat(4,1fr);padding:10px;border-top:1px solid #222}.nav button{background:none;border:none;color:#888;font-size:11px}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:flex-end;justify-content:center;z-index:99}.box{background:#1A1A1A;padding:20px;border-radius:20px 20px 0 0;width:100%;max-width:480px}.hist{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid #222;align-items:center}.hist-ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:#222}</style></head><body>
<div class="app">
<div style="display:flex;justify-content:space-between;align-items:center"><div class="logo">MINAGE <span>PRO</span></div><div id="user-name" style="font-size:12px;color:#888"></div></div>

<div id="auth-zone">
<h2>Mine. Gagne chaque seconde.</h2><p style="color:#888;font-size:13px">+10% • 75 jours • Kkiapay</p>
<div style="display:flex;background:#1A1A1A;border-radius:999px;padding:4px;margin:14px 0"><button id="b-login" onclick="showAuth('login')" style="flex:1;padding:10px;border:none;border-radius:999px;background:#fff;font-weight:800">Connexion</button><button id="b-reg" onclick="showAuth('register')" style="flex:1;padding:10px;border:none;border-radius:999px;background:none;color:#888;font-weight:800">Inscription</button></div>
<div id="login-interface"><div class="field"><label>Numéro</label><input id="login-id" class="inp"></div><div class="field"><label>Mot de passe</label><input id="login-pin" type="password" class="inp" maxlength="6"></div><button class="btn" onclick="executerConnexion()">Se connecter</button></div>
<div id="register-interface" style="display:none"><div class="field"><label>Nom</label><input id="reg-name" class="inp"></div><div class="field"><label>Numéro</label><input id="reg-id" class="inp"></div><div class="field"><label>Email</label><input id="reg-email" class="inp"></div><div class="field"><label>Mot de passe 6 chiffres</label><input id="reg-pin" type="password" class="inp" maxlength="6"></div><button class="btn" onclick="executerInscription()">Créer mon compte</button></div>
<div id="verify-interface" style="display:none"><p style="text-align:center">Code envoyé à <b id="verify-email-affiche"></b></p><input id="verify-code" class="inp" style="text-align:center" placeholder="Code 6 chiffres"><button class="btn" onclick="verifierCodeEmail()">Vérifier</button></div>
</div>

<div id="mine-zone" style="display:none">
<div id="tab-apercu">
<div class="hero" id="hero-total" style="display:none"><span class="pill green">● LIVE</span><div class="live"><span id="live-total">0.0000000</span> F</div><div style="color:#2CE88A;font-size:12px">+ <span id="live-per-day">0</span> F/jour</div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:14px 0"><div style="background:#141414;padding:12px;border-radius:12px"><small>Bonus</small><br><b id="user-commission" style="color:#FFD700">0 F</b></div><div style="background:#141414;padding:12px;border-radius:12px"><small>Reçu</small><br><b id="mine-total" style="color:#2CE88A">0 F</b></div><div style="background:#141414;padding:12px;border-radius:12px"><small>Plans</small><br><b id="user-plans-count">0</b></div></div><button class="btn-green" onclick="reclamerToutLive()">Réclamer tout</button><button class="btn-gold" onclick="openRetirer()">⬇️ RETRAIT</button></div>
<div id="intro-pro"><div style="background:linear-gradient(135deg,#FF5A00,#FFD700);border-radius:20px;padding:20px;color:#000;margin:16px 0"><h2 style="margin:0">Mine. Gagne chaque seconde.</h2><p>+10% • 75 jours</p></div></div>
<div id="mes-plans-apercu"></div>
</div>

<div id="tab-plans" style="display:none"><h2>Acheter un plan</h2><div id="plans-list"></div></div>
<div id="tab-mesplans" style="display:none"><h2>Mes plans</h2><div id="mes-plans-list"></div></div>
<div id="tab-historique" style="display:none"><h2>Historique</h2><div id="mine-history"></div></div>
<div id="tab-profil" style="display:none"><h2>Profil</h2><div class="plan"><div>Nom: <b id="profil-nom"></b></div><div style="margin-top:8px">Bonus: <b id="profil-bonus" style="color:#FFD700"></b></div></div><button class="btn-gold" onclick="openRetirer()">⬇️ RETRAIT</button><button class="btn" style="background:#222" onclick="executerDeconnexion()">Déconnexion</button></div>
</div></div>

<div class="nav"><button onclick="switchTab('apercu')">📊<br>Aperçu</button><button onclick="switchTab('plans')">🛒<br>Plans</button><button onclick="switchTab('mesplans')">⛏️<br>Mon Plan</button><button onclick="switchTab('profil')">👤<br>Profil</button></div>

<div id="preuve-overlay" class="overlay"><div class="box"><h3>💳 <span id="preuve-plan-nom"></span></h3><input id="preuve-numero" class="inp" placeholder="Numéro payeur"><input type="file" id="preuve-file" class="inp" accept="image/*"><input id="preuve-id" class="inp" placeholder="ID transaction"><p id="preuve-status" style="color:#2CE88A;text-align:center"></p><button class="btn" style="background:#00C853" onclick="envoyerPreuve()">✅ Envoyer preuve</button><button class="btn" style="background:#222" onclick="document.getElementById('preuve-overlay').style.display='none'">Plus tard</button></div></div>
<div id="retirer-overlay" class="overlay"><div class="box"><h3>⬇️ RETRAIT</h3><p>Bonus: <b id="solde-retrait-txt" style="color:#2CE88A"></b></p><input id="montant-retrait" type="number" class="inp" placeholder="Montant"><select id="reseau-retrait" class="inp"><option>MTN MoMo</option><option>MOOV Money</option><option>CELTIS</option></select><input id="numero-retrait" class="inp" placeholder="Numéro qui reçoit"><p id="retrait-status" style="color:#2CE88A;text-align:center"></p><button class="btn" onclick="doRetirerMinage()">✅ Envoyer</button><button class="btn" style="background:#222" onclick="document.getElementById('retirer-overlay').style.display='none'">Annuler</button></div></div>
<div id="custom-alert" class="overlay"><div class="box"><p id="custom-alert-msg"></p><button class="btn" style="background:#00C853" onclick="document.getElementById('custom-alert').style.display='none'">OK</button></div></div>

<script>
const OTP_URL='https://script.google.com/macros/s/AKfycbzfUdZWQ4zp8hmo9Pwq3w-V4iwY729lIL47iXEiUBl0MuWOiXUjeJteqNNmgiP_t2Uh6w/exec';
const ONESIGNAL_WEBHOOK='https://script.google.com/macros/s/AKfycbzoM5bqwSZm83RtFHaJK58ByQCqByYc2hCk58GA-97h0FTsC4cqca12cj38w0tf7jxv/exec';
const ADMIN_ID=atob('MDE1ODYxMjEzMQ==');
const DUREE=75;
const PLANS=[
{id:'p5000',nom:'Starter',prix:5000,kkiapay:'https://direct.kkiapay.me/44188/paiement-5000f-75NsIoPXD'},
{id:'p10000',nom:'Bronze',prix:10000,kkiapay:'https://direct.kkiapay.me/44188/paiement-10000f-wlqG4XKkt'},
{id:'p15000',nom:'Argent',prix:15000,kkiapay:'https://direct.kkiapay.me/44188/paiement-15000f-oTnUqZWWg'},
{id:'p20000',nom:'Normal',prix:20000,kkiapay:'https://direct.kkiapay.me/44188/paiement-20000f-6GfxIkKpF'},
{id:'p35000',nom:'Elite',prix:35000,kkiapay:'https://direct.kkiapay.me/44188/paiement-35000f-GVJnhDERU'},
{id:'p50000',nom:'Haut Niveau',prix:50000,kkiapay:'https://direct.kkiapay.me/44188/paiement-50000f-C0L8sy7R7'},
{id:'p70000',nom:'Pro',prix:70000,kkiapay:'https://direct.kkiapay.me/44188/paiement-70000f-oF_ap9lQS'},
{id:'p100000',nom:'Professionnel',prix:100000,kkiapay:'https://direct.kkiapay.me/44188/paiement-100000f-h0GyVC4Ew'},
{id:'p150000',nom:'Superstar',prix:150000,kkiapay:'https://direct.kkiapay.me/44188/paiement-150000f-YTXV5kOsG'},
{id:'p200000',nom:'Legende',prix:200000,kkiapay:'https://direct.kkiapay.me/44188/paiement-200000f-SQ1KONR_U'},
{id:'p300000',nom:'Hell',prix:300000,kkiapay:'https://direct.kkiapay.me/44188/paiement-300000-Z6l_pn1LZ'}
];
PLANS.forEach(p=>{p.gainTotal=Math.round(p.prix*0.1);p.totalRetour=p.prix+p.gainTotal;p.gainJour=p.totalRetour/DUREE;p.perSec=p.gainJour/86400});
function fmt(n){return (n||0).toLocaleString('fr-FR',{maximumFractionDigits:2})} function fmtLive(n){return (n||0).toFixed(7)}
let currentUserId=null,currentUserData=null,tempPhone='',tempEmail='',myPlans=[],allMyPlans=[],liveTimer=null,currentTotalLive=0,pendingPlan=null,_lock=false;
function showAlert(m){document.getElementById('custom-alert-msg').innerText=m;document.getElementById('custom-alert').style.display='flex'}
function showAuth(w){document.getElementById('login-interface').style.display=w==='login'?'block':'none';document.getElementById('register-interface').style.display=w==='register'?'block':'none';document.getElementById('verify-interface').style.display='none'}
function showZone(l){document.getElementById('auth-zone').style.display=l?'none':'block';document.getElementById('mine-zone').style.display=l?'block':'none'}
function switchTab(t){['apercu','plans','mesplans','historique','profil'].forEach(x=>document.getElementById('tab-'+x).style.display=x===t?'block':'none');if(t==='historique')chargerHistorique(currentUserId);if(t==='plans')renderPlans();if(t==='mesplans')renderMyPlans()}
function executerConnexion(){const i=document.getElementById('login-id').value.trim(),p=document.getElementById('login-pin').value.trim();if(!i||!p)return showAlert('Remplis tout');const h=CryptoJS.MD5(p).toString();database.ref('clients/'+i).once('value').then(s=>{if(!s.exists())return showAlert('Compte introuvable');const db=String(s.val().pin);if(db!==h&&db!==p)return showAlert('Mot de passe incorrect');const d=s.val();if(d.email_verified===false){tempPhone=i;tempEmail=d.email;document.getElementById('verify-email-affiche').innerText=d.email;document.getElementById('login-interface').style.display='none';document.getElementById('verify-interface').style.display='block';envoyerCodeEmail(d.email);return}currentUserId=i;localStorage.setItem('mayne_user',i);showZone(true);chargerMinage(i)})}
function executerInscription(){const n=document.getElementById('reg-name').value.trim(),i=document.getElementById('reg-id').value.trim().replace(/\D/g,''),e=document.getElementById('reg-email').value.trim().toLowerCase(),p=document.getElementById('reg-pin').value.trim();if(!n||!i||!e||!p)return showAlert('Remplis tout');const h=CryptoJS.MD5(p).toString();database.ref('clients/'+i).once('value').then(s=>{if(s.exists())return showAlert('Numero deja utilise');database.ref('clients/'+i).set({nom:n,email:e,pin:h,commission:0,email_verified:false,mine_total:0}).then(()=>{tempPhone=i;tempEmail=e;document.getElementById('verify-email-affiche').innerText=e;document.getElementById('register-interface').style.display='none';document.getElementById('verify-interface').style.display='block';envoyerCodeEmail(e);showAlert('Verifie ton email')})})}
function envoyerCodeEmail(em){fetch(OTP_URL,{method:'POST',body:'action=send&email='+encodeURIComponent(em||tempEmail),headers:{'Content-Type':'application/x-www-form-urlencoded'}})}
function verifierCodeEmail(){const c=document.getElementById('verify-code').value.trim();fetch(OTP_URL,{method:'POST',body:'action=verify&email='+encodeURIComponent(tempEmail)+'&code='+c,headers:{'Content-Type':'application/x-www-form-urlencoded'}}).then(r=>r.text()).then(t=>{if(t.includes('ok'))database.ref('clients/'+tempPhone).update({email_verified:true}).then(()=>{showAlert('Verifie! Connecte-toi');document.getElementById('verify-interface').style.display='none';document.getElementById('login-id').value=tempPhone;showAuth('login')});else showAlert('Code incorrect')})}
function executerDeconnexion(){localStorage.removeItem('mayne_user');currentUserId=null;clearInterval(liveTimer);showZone(false)}
function isActif(p){return p&&!(p.end&&Date.now()>p.end)} function getPlans(d){let a=[];if(d.minage_plans)Object.entries(d.minage_plans).forEach(([k,p])=>a.push({...p,key:k}));return a}
function renderPlans(){document.getElementById('plans-list').innerHTML=PLANS.map(p=>`<div class="plan"><div style="display:flex;justify-content:space-between"><b>${p.nom}</b><b style="color:#FFD700">${p.prix.toLocaleString('fr-FR')} F</b></div><div style="display:flex;justify-content:space-between;margin:10px 0"><span style="font-size:22px;font-weight:900">${fmt(p.gainJour)} <small>F/jour</small></span><span style="font-size:11px;color:#888;text-align:right">+${fmtLive(p.perSec)}/sec<br>+${p.gainTotal} F • 75j</span></div><button class="btn" onclick="acheterPlan('${p.id}')">Payer Kkiapay</button></div>`).join('')}
function acheterPlan(id){const plan=PLANS.find(p=>p.id===id);pendingPlan={plan};sessionStorage.setItem('pending_plan',id);window.open(plan.kkiapay,'_blank');setTimeout(()=>{document.getElementById('preuve-plan-nom').innerText=plan.nom+' '+plan.prix+' F';document.getElementById('preuve-numero').value=currentUserId;document.getElementById('preuve-overlay').style.display='flex'},1500)}
async function uploadB64(b){var fd=new FormData();fd.append('file',b);fd.append('upload_preset','mayneaudio');fd.append('folder','depot');var r=await fetch("https://api.cloudinary.com/v1_1/dkzpkvidk/image/upload",{method:'POST',body:fd});var d=await r.json();return d.secure_url}
async function pushJS(t,m){try{await fetch(ONESIGNAL_WEBHOOK,{method:'POST',mode:'no-cors',body:JSON.stringify({destId:ADMIN_ID,titre:t,message:m})})}catch{}}
async function envoyerPreuve(){const plan=pendingPlan.plan,num=document.getElementById('preuve-numero').value.trim(),idTx=document.getElementById('preuve-id').value.trim(),file=document.getElementById('preuve-file').files[0];if(!num)return showAlert('Numero requis');if(!file&&!idTx)return showAlert('Capture ou ID requis');if(_lock)return;_lock=true;const st=document.getElementById('preuve-status');try{let url='';if(file){st.innerText='Upload...';const b64=await new Promise(res=>{const fr=new FileReader();fr.onload=e=>res(e.target.result);fr.readAsDataURL(file)});url=await uploadB64(b64)}const data={planId:plan.id,planNom:plan.nom,montant:plan.prix,numero_payeur:num,id_transaction:idTx||'N/A',capture_url:url,client_id:currentUserId,date:new Date().toLocaleString('fr-FR'),statut:'en cours'};await database.ref('commandes_plans_minage').push().set(data);pushJS('PLAN '+plan.nom,plan.prix+'F Client '+currentUserId);st.innerText='Envoye!';setTimeout(()=>{document.getElementById('preuve-overlay').style.display='none';switchTab('historique')},1500)}catch(e){showAlert(e.message)}finally{_lock=false}}
function openRetirer(){document.getElementById('solde-retrait-txt').innerText=fmt(currentUserData?.commission||0)+' F';document.getElementById('retirer-overlay').style.display='flex'}
async function doRetirerMinage(){const m=parseInt(document.getElementById('montant-retrait').value||'0'),res=document.getElementById('reseau-retrait').value,num=document.getElementById('numero-retrait').value.trim(),bonus=currentUserData?.commission||0;if(m<1000)return showAlert('Min 1000 F');if(m>bonus)return showAlert('Bonus insuffisant');if(!num)return showAlert('Numero requis');const data={montant:m,reseau:res,numero:num,client_id:currentUserId,date:new Date().toLocaleString('fr-FR'),statut:'en cours'};await database.ref('demandes_retrait_minage').push().set(data);pushJS('RETRAIT '+m+'F',m+'F '+res+' Client '+currentUserId);document.getElementById('retirer-overlay').style.display='none';switchTab('historique');showAlert('Demande envoyee')}
function chargerMinage(ph){database.ref('clients/'+ph).on('value',s=>{const d=s.val()||{};currentUserData=d;document.getElementById('user-name').innerText=d.nom+' • '+ph;allMyPlans=getPlans(d);myPlans=allMyPlans.filter(isActif);const has=myPlans.length>0;document.getElementById('hero-total').style.display=has?'block':'none';document.getElementById('intro-pro').style.display=has?'none':'block';document.getElementById('user-commission').innerText=fmt(d.commission||0)+' F';document.getElementById('mine-total').innerText=fmt(allMyPlans.reduce((a,p)=>a+(p.totalGagne||0),0))+' F';document.getElementById('user-plans-count').innerText=myPlans.length;document.getElementById('profil-nom').innerText=d.nom;document.getElementById('profil-bonus').innerText=fmt(d.commission||0)+' F';if(has)startLive();renderMyPlans();renderPlans()})}
function startLive(){clearInterval(liveTimer);function tick(){let tot=0,perDay=0;myPlans.forEach(p=>{const gj=p.gainJour||(p.prix+p.gainTotal)/75;let intr=((Date.now()-(p.lastClaimLive||p.start))/1000)*(gj/86400);intr=Math.min(intr,(p.totalRetour||0)-(p.totalGagne||0));p._live=intr;tot+=intr;perDay+=gj;const el=document.getElementById('live-'+p.key);if(el)el.innerText=fmtLive(intr)});currentTotalLive=tot;document.getElementById('live-total').innerText=fmtLive(tot);document.getElementById('live-per-day').innerText=fmt(perDay)}tick();liveTimer=setInterval(tick,100)}
function renderMyPlans(){const html=allMyPlans.map(p=>{const a=isActif(p);return `<div class="plan"><b>${p.nom}</b> <span style="float:right;color:${a?'#2CE88A':'#FF6B6B'}">${a?'ACTIF':'EXPIRE'}</span><div style="font-size:22px;color:#2CE88A;margin:8px 0"><span id="live-${p.key}">0.0000000</span> F</div><small>${fmt(p.gainJour||0)} F/jour • Recu ${fmt(p.totalGagne||0)}/${fmt(p.totalRetour||0)} F</small>${a?`<button class="btn" style="background:#00C853;margin-top:10px" onclick="reclamerUn('${p.key}')">Reclamer</button>`:''}</div>`}).join('');document.getElementById('mes-plans-list').innerHTML=html||'Aucun plan';document.getElementById('mes-plans-apercu').innerHTML=html}
function reclamerUn(k){const p=myPlans.find(x=>x.key===k),g=p._live||0;if(g<0.0001)return showAlert('Attends');database.ref('clients/'+currentUserId).update({commission:(currentUserData.commission||0)+g,mine_total:(currentUserData.mine_total||0)+g,['minage_plans/'+k+'/lastClaimLive']:Date.now(),['minage_plans/'+k+'/totalGagne']:(p.totalGagne||0)+g}).then(()=>database.ref('minage_history/'+currentUserId).push({type:'gain_live',plan:p.nom,gain:g,date:new Date().toLocaleString('fr-FR')}))}
function reclamerToutLive(){if(currentTotalLive<0.0001)return showAlert('Attends');const g=currentTotalLive,u={commission:(currentUserData.commission||0)+g,mine_total:(currentUserData.mine_total||0)+g};myPlans.forEach(p=>{u['minage_plans/'+p.key+'/lastClaimLive']=Date.now();u['minage_plans/'+p.key+'/totalGagne']=(p.totalGagne||0)+(p._live||0)});database.ref('clients/'+currentUserId).update(u).then(()=>database.ref('minage_history/'+currentUserId).push({type:'gain_live',plan:'TOUS',gain:g,date:new Date().toLocaleString('fr-FR')}))}
async function chargerHistorique(ph){const b=document.getElementById('mine-history');if(!ph)return;let items=[];const [h1,h2,h3]=await Promise.all([database.ref('minage_history/'+ph).once('value'),database.ref('commandes_plans_minage').orderByChild('client_id').equalTo(ph).once('value'),database.ref('demandes_retrait_minage').orderByChild('client_id').equalTo(ph).once('value')]);if(h1.exists())h1.forEach(c=>{const v=c.val();items.push({t:v.type==='gain_live'?'Gain LIVE':'Plan active',s:v.plan+' • '+v.date,a:v.gain?'+'+fmtLive(v.gain)+' F':''})});if(h2.exists())h2.forEach(c=>{const v=c.val();items.push({t:'Achat '+v.planNom+' ('+v.statut+')',s:v.date,a:'-'+fmt(v.montant)+' F'})});if(h3.exists())h3.forEach(c=>{const v=c.val();items.push({t:'Retrait '+fmt(v.montant)+' F ('+v.statut+')',s:v.date+' • '+v.numero,a:'-'+fmt(v.montant)+' F'})});b.innerHTML=items.length?items.map(i=>`<div class="hist"><div class="hist-ic">•</div><div style="flex:1"><b>${i.t}</b><br><small style="color:#888">${i.s}</small></div><b>${i.a}</b></div>`).join(''):'Aucune activite'}
window.addEventListener('DOMContentLoaded',()=>{const saved=localStorage.getItem('mayne_user');if(saved){currentUserId=saved;showZone(true);chargerMinage(saved)}else showZone(false)});
</script></body></html>
