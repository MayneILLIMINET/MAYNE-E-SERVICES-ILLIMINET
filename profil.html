<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Profil - MAYNE</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyDR0zDiGxisp4G-CDjltu8VFmxMMFjXI9E",authDomain:"mayneilliminetdb.firebaseapp.com",databaseURL:"https://mayneilliminetdb-default-rtdb.firebaseio.com",projectId:"mayneilliminetdb"};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const database=firebase.database();
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}
body{background:#f2f2f2;display:flex;justify-content:center}
.app{max-width:430px;width:100%;min-height:100vh;background:#fff;padding-bottom:90px}
.top{background:linear-gradient(135deg,#ff5000,#ff7a00);color:#fff;padding:18px 16px 20px;border-radius:0 0 24px 24px;text-align:center}
.top a{color:#fff;text-decoration:none;font-size:13px;font-weight:800;float:left}
.avatar-wrap{width:96px;height:96px;margin:10px auto 0;position:relative;cursor:pointer}
.avatar{width:96px;height:96px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:38px;color:#ff5000;font-weight:900;border:4px solid #fff;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.avatar img{width:100%;height:100%;object-fit:cover}
.cam{position:absolute;bottom:2px;right:2px;width:30px;height:30px;background:#000;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;border:3px solid #fff;font-size:14px}
.loyalty{background:#fff;margin:12px 16px 0;border:1px solid #eee;border-radius:16px;padding:12px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.loyalty b{font-size:13px}
.stars{font-size:20px;letter-spacing:2px;margin:6px 0}
.stars span{color:#ddd}
.stars span.on{color:#ffb400}
.progress{height:8px;background:#eee;border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,#ff5000,#ffb400)}
.loyalty small{font-size:11px;color:#777;display:block;margin-top:6px;line-height:1.4}
.steps{display:flex;gap:6px;padding:14px 16px 0}
.step-dot{flex:1;height:6px;border-radius:999px;background:#eee}
.step-dot.on{background:#ff5000}
.step{padding:16px}
.step h1{font-size:24px;text-align:left}
.step p{font-size:13px;color:#666;margin:8px 0 16px;text-align:left;line-height:1.5}
.label{display:block;font-size:12px;font-weight:800;margin:12px 0 6px}
.label span{color:#ff5000}
.input{width:100%;padding:13px 14px;border:1px solid #ddd;border-radius:12px;font-size:14px;outline:none;background:#fafafa}
.input:focus{border-color:#ff5000;background:#fff}
.btn{width:100%;padding:15px;border:none;background:#ff5000;color:#fff;border-radius:12px;font-weight:900;font-size:14px;cursor:pointer;margin-top:18px}
.btn:disabled{opacity:.5}
.btn-sec{width:100%;padding:13px;border:1px solid #ddd;background:#fff;border-radius:12px;font-weight:800;margin-top:8px;cursor:pointer}
.verified{background:#e6f7e6;border:1px solid #b6e6b6;padding:12px;border-radius:12px;font-size:13px;margin-top:12px;display:none}
.verified b{color:#0a8a2a}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:430px;width:100%;background:#000;display:flex;justify-content:space-around;padding:10px 0;z-index:20}
.bnav{border:none;background:none;font-size:11px;color:#888;cursor:pointer}
.bnav.active{background:#0f3d2e;color:#d6f78c;border-radius:100px;padding:8px 16px;font-weight:700}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111;color:#fff;padding:11px 16px;border-radius:999px;font-size:12px;font-weight:800;display:none;z-index:999;max-width:90%;text-align:center}
</style>
</head>
<body>
<div class="app">
<div class="top">
<a href="compte.html">‹ Retour</a>
<h2 style="font-size:15px;font-weight:900;margin-top:4px">MON PROFIL</h2>
<div class="avatar-wrap" onclick="document.getElementById('fileAvatar').click()">
<div class="avatar" id="av">A</div><div class="cam">📷</div>
</div>
<div style="font-size:11px;background:rgba(0,0,0,.35);display:inline-block;padding:5px 10px;border-radius:999px;margin-top:8px;font-weight:700" onclick="document.getElementById('fileAvatar').click()">📷 Changer ma photo</div>
<input type="file" id="fileAvatar" accept="image/*" hidden onchange="changeAvatar(this)">
<b id="nameTop" style="display:block;margin-top:10px;font-size:18px">Chargement...</b>
<span id="phoneTop" style="font-size:12px;opacity:.9"></span>
</div>

<div class="loyalty">
<div style="display:flex;justify-content:space-between"><b>⭐ Fidélité MAYNE</b><span id="levelBadge" style="font-size:11px;font-weight:900;color:#ff5000;background:#fff1e6;padding:5px 9px;border-radius:999px">NIVEAU 1</span></div>
<div class="stars" id="stars"></div>
<div class="progress"><i id="progressBar" style="width:0%"></i></div>
<small id="loyaltyText">Calcul...</small>
</div>

<div class="steps"><div class="step-dot on"></div><div class="step-dot on" id="dot2"></div><div class="step-dot" id="dot3"></div></div>

<!-- ÉTAPE 2 : VÉRIFICATION D'IDENTITÉ -->
<div class="step" id="s2">
<h1>Vérification d'identité</h1>
<p>Vérifiez que vos informations d'identité correspondent à votre pièce d'identité. Ces infos servent pour tes retraits et transferts.</p>

<label class="label">Nom <span>*</span></label>
<input id="nom" class="input" placeholder="Ayizan">
<label class="label">Prénom <span>*</span></label>
<input id="prenom" class="input" placeholder="Marius">
<label class="label">Date de naissance <span>*</span></label>
<input id="dob" type="date" class="input" value="2000-01-18">
<label class="label">Genre <span>*</span></label>
<select id="genre" class="input"><option>Masculin</option><option>Féminin</option></select>
<label class="label">Pays <span>*</span></label>
<select id="pays" class="input"><option>Bénin</option><option>Togo</option><option>Nigeria</option><option>Côte d'Ivoire</option><option>Ghana</option><option>Niger</option><option>Burkina Faso</option></select>
<label class="label">Numéro pièce d'identité <span>*</span></label>
<input id="piece" class="input" placeholder="Ex: CNI / Passeport / RAVIP">

<div class="verified" id="verifiedBox">✅ <b>Profil vérifié !</b><br><span id="verifiedText"></span></div>

<button class="btn" id="btnUpdate" onclick="updateProfil()">METTRE À JOUR ✅</button>
<button class="btn-sec" onclick="location.href='compte.html'">Voir Mon Compte →</button>
</div>
</div>

<div class="bottom">
<button class="bnav" onclick="location.href='index.html'">ACCUEIL🏠</button>
<button class="bnav" onclick="location.href='epargne.html'">EPARGNE⭐</button>
<button class="bnav">↕</button>
<button class="bnav active">MES INFOS👤</button>
</div>
<div id="toast"></div>

<script>
let currentUser=null, totalRecharge=0;
function toast(m){ let t=document.getElementById('toast'); t.textContent=m; t.style.display='block'; setTimeout(()=>t.style.display='none',2800); }
function fmt(n){ return Math.round(n||0).toLocaleString('fr-FR')+' F'; }

// ===== AVATAR COMME MESSAGERIE + COMPTE =====
function showAvatar(photo){
  let av=document.getElementById('av');
  if(photo) av.innerHTML='<img src="'+photo+'">';
  else { let u=currentUser||{}; av.textContent=((u.nom||u.prenom||'A')[0]||'A').toUpperCase(); }
}
function changeAvatar(input){
  let f=input.files[0]; if(!f) return;
  if(f.size>1500000){ toast('❌ Photo trop lourde, choisis < 1.5 Mo'); return; }
  let r=new FileReader();
  r.onload=function(e){
    let photo=e.target.result; showAvatar(photo);
    try{ localStorage.setItem('mayne_avatar',photo); }catch(err){}
    let u=JSON.parse(localStorage.getItem('mayne_current_user')||'{}');
    u.photo=photo; localStorage.setItem('mayne_current_user',JSON.stringify(u));
    if(u.phone){ let k=u.phone.replace(/[^0-9]/g,''); database.ref('clients/'+k).update({photo:photo}).then(()=>toast('✅ Photo de profil changée')); }
  };
  r.readAsDataURL(f);
}

// ===== FIDELITE 6 NIVEAUX =====
function getLevel(t){
  if(t>=70001) return {level:6,min:70001,max:200000,bonus:5000,next:null};
  if(t>=30001) return {level:5,min:30001,max:70000,bonus:3500,next:70001};
  if(t>=15001) return {level:4,min:15001,max:30000,bonus:2500,next:30001};
  if(t>=5001) return {level:3,min:5001,max:15000,bonus:1500,next:15001};
  if(t>=500) return {level:2,min:500,max:5000,bonus:500,next:5001};
  return {level:1,min:0,max:499,bonus:0,next:500};
}
function renderLoyalty(){
  let L=getLevel(totalRecharge);
  document.getElementById('levelBadge').textContent='NIVEAU '+L.level+' / 6';
  let stars=document.getElementById('stars'); stars.innerHTML='';
  for(let i=1;i<=6;i++){ let s=document.createElement('span'); s.textContent='★'; if(i<=L.level) s.className='on'; stars.appendChild(s); }
  let pct=100; if(L.next) pct=Math.min(100,Math.round((totalRecharge-L.min)/(L.next-L.min)*100));
  document.getElementById('progressBar').style.width=pct+'%';
  document.getElementById('loyaltyText').innerHTML = L.next ? 'Total rechargé : <b>'+fmt(totalRecharge)+'</b> — Plus que <b>'+fmt(L.next-totalRecharge)+'</b> pour Niveau '+(L.level+1)+' • Bonus actuel '+fmt(L.bonus) : 'Total rechargé : <b>'+fmt(totalRecharge)+'</b> — Niveau max 6 👑 • Bonus '+fmt(L.bonus);
}

// ===== CHARGEMENT + SAUVEGARDE =====
function fillForm(u){
  if(!u) return;
  document.getElementById('nom').value=u.nom||'';
  document.getElementById('prenom').value=u.prenom||'';
  document.getElementById('dob').value=u.dob||u.date_naissance||'2000-01-18';
  document.getElementById('genre').value=u.genre||'Masculin';
  document.getElementById('pays').value=u.pays||'Bénin';
  document.getElementById('piece').value=u.piece||u.cni||'';
  document.getElementById('nameTop').textContent=((u.prenom||'')+' '+(u.nom||'')).trim()||'Mon Profil';
  document.getElementById('phoneTop').textContent=u.phone||'';
  showAvatar(u.photo||localStorage.getItem('mayne_avatar'));
  if(u.verified || u.profil_verifie){ showVerified(u); }
}
function showVerified(u){
  let b=document.getElementById('verifiedBox'); b.style.display='block';
  document.getElementById('verifiedText').textContent=(u.prenom||'')+' '+(u.nom||'')+' • '+ (u.pays||'')+' • Vérifié le '+(u.verified_date||'aujourd\'hui');
  document.getElementById('dot3').classList.add('on');
}

async function loadProfil(){
  let u=JSON.parse(localStorage.getItem('mayne_current_user')||'null');
  if(!u||!u.phone){ currentUser=u; fillForm(u); renderLoyalty(); return; }
  currentUser=u; fillForm(u);
  let key=u.phone.replace(/[^0-9]/g,'');
  try{
    let snap=await database.ref('clients/'+key).once('value');
    let data=snap.val()||{};
    let merged=Object.assign({},u,data);
    if(!merged.photo) merged.photo=localStorage.getItem('mayne_avatar')||'';
    localStorage.setItem('mayne_current_user',JSON.stringify(merged));
    currentUser=merged; fillForm(merged);
    let tot=Number(data.total_recharge||data.totalRecharge||0);
    try{
      let sDep=await database.ref('commandes_depots').once('value');
      sDep.forEach(ch=>{ let v=ch.val()||{}; let p=(v.client_id||v.phone||v.user||'').replace(/[^0-9]/g,''); let st=((v.statut||v.status||'').toLowerCase()); if(p===key && (st.includes('valid')||st.includes('succes')||st.includes('payé')||st.includes('paye'))) tot+=Number(v.montant||v.total||0); });
    }catch(e){}
    if(tot===0) tot=Number(merged.solde||0)+Number(merged.commission||0);
    totalRecharge=tot; renderLoyalty();
  }catch(e){ renderLoyalty(); }
}

async function updateProfil(){
  let nom=document.getElementById('nom').value.trim();
  let prenom=document.getElementById('prenom').value.trim();
  let dob=document.getElementById('dob').value;
  let genre=document.getElementById('genre').value;
  let pays=document.getElementById('pays').value;
  let piece=document.getElementById('piece').value.trim();
  if(!nom||!prenom){ toast('❌ Mets ton Nom et Prénom'); return; }
  if(!dob){ toast('❌ Mets ta date de naissance'); return; }
  // 18 ans mini
  let age=(new Date()-new Date(dob))/(1000*60*60*24*365);
  if(age<16){ toast('❌ Tu dois avoir au moins 16 ans'); return; }
  let btn=document.getElementById('btnUpdate'); btn.disabled=true; btn.textContent='⏳ Sauvegarde...';
  let u=JSON.parse(localStorage.getItem('mayne_current_user')||'{}');
  let data={nom,prenom,dob,date_naissance:dob,genre,pays,piece,cni:piece,profil_verifie:true,verified:true,verified_date:new Date().toLocaleDateString('fr-FR'),updated_at:new Date().toISOString()};
  let merged=Object.assign({},u,data);
  localStorage.setItem('mayne_current_user',JSON.stringify(merged));
  currentUser=merged;
  try{
    if(u.phone){ let key=u.phone.replace(/[^0-9]/g,''); await database.ref('clients/'+key).update(data); }
    toast('✅ Profil mis à jour !');
    document.getElementById('nameTop').textContent=prenom+' '+nom;
    showVerified(merged);
  }catch(e){ toast('❌ '+e.message); }
  btn.disabled=false; btn.textContent='METTRE À JOUR ✅';
}

window.onload=loadProfil;
firebase.auth().onAuthStateChanged(function(user){ if(!user) firebase.auth().signInAnonymously(); });
</script>
</body>
</html>
