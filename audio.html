<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AppDans - Lecteur Gratuit</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{background:#0a0a0a;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
.header{width:100%;max-width:480px;text-align:center;margin:20px 0}
.header h1{font-size:26px;font-weight:800}
.header h1 span{color:#1DB954}
.header p{opacity:.6;margin-top:8px;font-size:14px}
.card{width:100%;max-width:480px;background:#151515;border-radius:20px;padding:20px;border:1px solid #222}
.btn-pick{width:100%;padding:16px;background:#1DB954;color:#000;border:0;border-radius:14px;font-weight:800;font-size:16px;cursor:pointer}
.list{margin-top:18px;max-height:320px;overflow:auto}
.item{padding:12px 10px;border-radius:10px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;border:1px solid transparent;margin-bottom:4px}
.item.active{background:#1DB95422;border-color:#1DB954;color:#1DB954}
.player{margin-top:18px;background:#1e1e1e;border-radius:16px;padding:16px}
.title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progress{width:100%;margin:12px 0}
.progress input{width:100%;accent-color:#1DB954}
.controls{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.controls button{width:48px;height:48px;border-radius:50%;border:0;font-size:20px;cursor:pointer;background:#2a2a2a;color:#fff}
.controls button.play{width:62px;height:62px;background:#1DB954;color:#000;font-size:26px}
.time{display:flex;justify-content:space-between;font-size:12px;opacity:.6;margin-top:6px}
.hint{margin-top:14px;font-size:12px;opacity:.4;text-align:center}
</style>
</head>
<body>
<div class="header">
<h1>AppDans <span>Player</span></h1>
<p>100% gratuit, hors-ligne, sans pub, sans publication</p>
</div>
<div class="card">
<button class="btn-pick" id="pickBtn">🎵 Choisir mes musiques</button>
<input type="file" id="fileInput" accept=".mp3,.m4a,.wav,.ogg,.flac,audio/*" multiple hidden>
<div class="list" id="list"></div>
<div class="player" id="playerBox" style="display:none">
<div class="title" id="nowTitle">Aucune musique</div>
<div class="progress"><input type="range" id="seek" value="0" min="0" max="100"></div>
<div class="time"><span id="cur">0:00</span><span id="dur">0:00</span></div>
<div class="controls">
<button id="prevBtn">⏮</button>
<button class="play" id="playBtn">▶</button>
<button id="nextBtn">⏭</button>
</div>
</div>
<div class="hint">Tes fichiers restent sur ton téléphone. Rien n'est envoyé sur internet.</div>
</div>
<audio id="audio" preload="metadata"></audio>
<script>
const fileInput = document.getElementById('fileInput');
const pickBtn = document.getElementById('pickBtn');
const listEl = document.getElementById('list');
const audio = document.getElementById('audio');
const playBtn = document.getElementById('playBtn');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const seek = document.getElementById('seek');
const nowTitle = document.getElementById('nowTitle');
const playerBox = document.getElementById('playerBox');
const curEl = document.getElementById('cur');
const durEl = document.getElementById('dur');
let tracks = [];
let index = 0;
pickBtn.onclick = () => fileInput.click();
fileInput.onchange = e => {
  tracks = Array.from(e.target.files);
  if(!tracks.length) return;
  renderList();
  load(0, true);
};
function renderList(){
  listEl.innerHTML = '';
  tracks.forEach((f,i)=>{
    const div = document.createElement('div');
    div.className = 'item' + (i===index?' active':'');
    div.innerHTML = `<span>${f.name}</span>`;
    div.onclick = ()=>load(i,true);
    listEl.appendChild(div);
  });
}
function load(i, autoplay){
  index = i;
  const f = tracks[index];
  if(!f) return;
  audio.src = URL.createObjectURL(f);
  nowTitle.textContent = f.name;
  playerBox.style.display = 'block';
  renderList();
  if(autoplay){ audio.play(); playBtn.textContent='⏸'; }
}
function fmt(s){ if(isNaN(s))return '0:00'; const m=Math.floor(s/60); const sec=Math.floor(s%60).toString().padStart(2,'0'); return m+':'+sec; }
playBtn.onclick = ()=>{
  if(audio.paused){ audio.play(); playBtn.textContent='⏸'; }
  else { audio.pause(); playBtn.textContent='▶'; }
};
prevBtn.onclick = ()=>{ if(index>0) load(index-1,true); };
nextBtn.onclick = ()=>{ if(index<tracks.length-1) load(index+1,true); };
audio.ontimeupdate = ()=>{
  const p = audio.duration? (audio.currentTime/audio.duration*100) : 0;
  seek.value = p;
  curEl.textContent = fmt(audio.currentTime);
  durEl.textContent = fmt(audio.duration);
};
seek.oninput = ()=>{
  if(audio.duration) audio.currentTime = seek.value/100*audio.duration;
};
audio.onended = ()=>{
  if(index<tracks.length-1) load(index+1,true);
  else { playBtn.textContent='▶'; }
};
</script>
</body>
</html>
