<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AppDans V8 - FINAL</title>
<style>body{background:#0a0a0a;color:#fff;font-family:sans-serif;padding:14px;display:flex;flex-direction:column;align-items:center} .card{background:#151515;border:1px solid #222;border-radius:16px;padding:14px;width:100%;max-width:560px} input,button{width:100%;padding:14px;border-radius:12px;border:1px solid #333;margin:6px 0} button{background:#1DB954;color:#000;font-weight:900;border:0;cursor:pointer} button.dark{background:#2a2a2a;color:#fff} .log{background:#000;padding:10px;border-radius:10px;font-size:11px;white-space:pre-wrap;min-height:80px;margin-top:10px} </style>
</head>
<body>
<h2>AppDans <span style="color:#1DB954">V8 FINAL - ACTIF</span></h2>
<div class="card">
<div style="font-size:11px;color:#888;margin-bottom:6px">Serveur: https://mayne-e-services-illiminet-1.onrender.com</div>
<input id="ytUrl" placeholder="Colle lien YouTube ici ex: https://youtu.be/xxxx">
<button id="dlMp3">🎵 Télécharger MP3 dans Player</button>
<button id="dlMp4" class="dark">📹 Télécharger MP4 dans Player</button>
<div id="log" class="log">Prêt. Colle un lien YouTube.</div>
<audio id="audio" controls style="width:100%;margin-top:10px"></audio>
<video id="video" controls style="width:100%;margin-top:10px;display:none;border-radius:10px"></video>
</div>
<script>
const $=id=>document.getElementById(id);
const logEl=$('log'), audio=$('audio'), video=$('video');
const SERVER='https://mayne-e-services-illiminet-1.onrender.com';
function log(t){ logEl.textContent+='\n> '+t; logEl.scrollTop=9999; }
async function download(isAudio){
  const url=$('ytUrl').value.trim();
  if(!url) return alert('Colle un lien YouTube');
  logEl.textContent=''; log((isAudio?'MP3':'MP4')+' demandé pour '+url);
  try{
    log('Contact du serveur Render (peut prendre 30s au premier coup)...');
    const r=await fetch(SERVER+'/api/json',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url, isAudioOnly:isAudio, aFormat:'mp3', vQuality:'720'})});
    const j=await r.json();
    if(!j.url) throw new Error(JSON.stringify(j));
    log('✅ Lien direct obtenu ! Lecture...');
    if(isAudio){ video.style.display='none'; video.pause(); audio.style.display='block'; audio.src=j.url; audio.play(); }
    else{ audio.pause(); audio.style.display='none'; video.style.display='block'; video.src=j.url; video.play(); }
    log('Si ça ne joue pas, ton lien est: '+j.url);
  }catch(e){ log('❌ ERREUR: '+e.message); }
}
$('dlMp3').onclick=()=>download(true);
$('dlMp4').onclick=()=>download(false);
</script>
</body>
</html>
