<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Infos Compte - MAYNE</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {apiKey:"AIzaSyDR0zDiGxisp4G-CDjltu8VFmxMMFjXI9E",authDomain:"mayneilliminetdb.firebaseapp.com",databaseURL:"https://mayneilliminetdb-default-rtdb.firebaseio.com",projectId:"mayneilliminetdb",storageBucket:"mayneilliminetdb.appspot.com",messagingSenderId:"904857888891",appId:"1:904857888891:web:a89e339ea89de0340a5ade"};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const database = firebase.database();
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}
body{background:#f2f2f2;display:flex;justify-content:center}
.app{max-width:430px;width:100%;min-height:100vh;background:#f6f6f6;padding-bottom:90px}
.head{padding:16px;color:#fff;display:flex;align-items:center;gap:12px;position:sticky;top:0;background:linear-gradient(135deg,#ff5000,#ff7a00);z-index:2;border-radius:0 0 20px 20px}
.back{width:40px;height:40px;background:rgba(255,255,255,.25);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px}
.top-profile{text-align:center;padding:14px 16px 0}
.avatar-wrap{width:96px;height:96px;margin:0 auto;position:relative;cursor:pointer}
.avatar{width:96px;height:96px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:38px;color:#ff5000;font-weight:900;border:4px solid #fff;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.avatar img{width:100%;height:100%;object-fit:cover}
.cam{position:absolute;bottom:2px;right:2px;width:30px;height:30px;background:#000;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;border:3px solid #fff;font-size:14px}
.loyalty{background:#fff;margin:12px 16px 0;border-radius:16px;padding:12px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.loyalty b{font-size:13px}
.stars{font-size:20px;letter-spacing:2px;margin:6px 0}
.stars span{color:#ddd}
.stars span.on{color:#ffb400}
.progress{height:8px;background:#eee;border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,#ff5000,#ffb400)}
.loyalty small{font-size:11px;color:#777;display:block;margin-top:6px;line-height:1.4}
.card{margin:12px 16px;background:#fff;border-radius:20px;padding:18px;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.label{font-size:11px;font-weight:800;color:#888;margin-top:14px;display:block;text-transform:uppercase;letter-spacing:.5px}
.label:first-child{margin-top:0}
.input,.select{width:100%;color:#111;padding:13px 14px;border:1px solid #e5e5e5;border-radius:12px;margin-top:6px;font-size:14px;background:#fafafa;outline:none}
.input:focus,.select:focus{border-color:#ff5000;background:#fff}
.input:disabled{background:#eee;color:#666;font-weight:700}
.badge{display:inline-flex;padding:6px 12px;border-radius:100px;font-size:12px;font-weight:800;margin-top:6px}
.badge.ok{background:#e8f5e9;color:#2e7d32}
.badge.wait{background:#fff8e1;color:#f57f17}
.badge.no{background:#fdecea;color:#c0392b}
.btn{width:100%;background:#ff5000;color:#fff;border:none;border-radius:12px;padding:15px;font-weight:900;font-size:14px;margin-top:20px;cursor:pointer}
.btn:disabled{opacity:.5}
.btn-sec{width:100%;background:#fff;border:1px solid #ddd;border-radius:12px;padding:13px;font-weight:800;margin-top:8px;cursor:pointer}
.notif{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:12px 18px;border-radius:999px;display:none;z-index:999;font-size:13px;font-weight:800}
</style>
</head>
<body>
<div class="app">
<div class="head"><div class="back" onclick="location.href='compte.html'">‹</div><b>Information sur le compte</b></div>

<div class="top-profile">
<div class="avatar-wrap" onclick="document.getElementById('fileAvatar').click()">
<div class="avatar" id="av">A</div><div class="cam">📷</div>
</div>
<div style="font-size:11px;background:#111;color:#fff;display:inline-block;padding:5px 10px;border-radius:999px;margin-top:8px;font-weight:700" onclick="document.getElementById('fileAvatar').click()">📷 Changer ma photo</div>
<input type="file" id="fileAvatar" accept="image/*" hidden onchange="changeAvatar(this)">
<b id="nameTop" style="display:block;margin-top:8px;font-size:17px">Chargement...</b>
<span id="phoneTop" style="font-size:12px;color:#777"></span>
</div>

<div class="loyalty">
<div style="display:flex;justify-content:space-between"><b>⭐ Fidélité MAYNE</b><span id="levelBadge" style="font-size:11px;font-weight:900;color:#ff5000;background:#fff1e6;padding:5px 9px;border-radius:999px">NIVEAU 1</span></div>
<div class="stars" id="stars"></div>
<div class="progress"><i id="progressBar" style="width:0%"></i></div>
<small id="loyaltyText">Calcul...</small>
</div>

<div class="card">
<label class="label">Nom</label><input id="nom" class="input" placeholder="Ayizan">
<label class="label">Prénom</label><input id="prenom" class="input" placeholder="Marius">
<label class="label">Numéro WhatsApp</label><input id="phone" class="input" disabled>
<label class="label">Email</label><input id="email" class="input" placeholder="exemple@gmail.com" type="email">
<label class="label">Sexe</label>
<select id="sexe" class="select"><option value="">Choisir</option><option value="Homme">Homme</option><option value="Femme">Femme</option></select>
<label class="label">Date de naissance</label><input id="dob" type="date" class="input">
<label class="label">Pays</label>
<select id="pays" class="select"><option>Bénin</option><option>Togo</option><option>Nigeria</option><option>Côte d'Ivoire</option><option>Ghana</option><option>Niger</option><option>Burkina Faso</option></select>
<label class="label">Numéro Carte d'Identité / CIP</label><input id="cni" class="input" placeholder="Ex: CIP / CNI / RAVIP">
<label class="label">Statut du compte</label><div id="statut"></div>
<button class="btn" id="btnSave" onclick="saveInfos()">ENREGISTRER ✅</button>
<button class="btn-sec" onclick="location.href='profil.html'">Aller à Vérification d'identité →</button>
</div>
</div>
<div class="notif" id="notif"></div>
<script>
function showN(t){var e=document.getElementById('notif');e.textContent=t;e.style.display='block';setTimeout(function(){e.style.display='none'},3000);}
function fmt(n){ return Math.round(n||0).toLocaleString('fr-FR')+' F'; }
var currentUser = JSON.parse(localStorage.getItem('mayne_current_user')||'{}');
var phoneKey = (currentUser.phone||'').replace(/[^0-9]/g,'');
let totalRecharge=0;

// ===== AVATAR COMME MESSAGERIE / COMPTE / PROFIL =====
function showAvatar(photo){
  let av=document.getElementById('av');
  if(photo) av.innerHTML='<img src="'+photo+'">';
  else { let u=currentUser||{}; av.textContent=((u.nom||u.prenom||'A')[0]||'A').toUpperCase(); }
}
function changeAvatar(input){
  let f=input.files[0]; if(!f) return;
  if(f.size>1500000){ showN('❌ Photo trop lourde < 1.5 Mo'); return; }
  let r=new FileReader();
  r.onload=function(e){
    let photo=e.target.result; showAvatar(photo);
    try{ localStorage.setItem('mayne_avatar',photo); }catch(err){}
    currentUser.photo=photo; localStorage.setItem('mayne_current_user',JSON.stringify(currentUser));
    if(phoneKey) database.ref('clients/'+phoneKey).update({photo:photo}).then(()=>showN('✅ Photo de profil changée'));
  };
  r.readAsDataURL(f);
}

// ===== FIDELITE 6 NIVEAUX =====
function getLevel(t){
  if(t>=70001) return {level:6,min:70001,max:200000,bonus:5000,next:null};
  if(t>=30001) return {level:5,min:30001,max:70000,bonus:3500,next:70001};
  if(t>=15001) return {level:4,min:15001,max:30000,bonus:2500,next:30001};
  if(t>=5001) return {level:3,min:5001,max:15000,bonus:1500,next:15001};
  if(t>=500) return {level:2,min:500,max:5000,bonus:500,next:5001};
  return {level:1,min:0,max:499,bonus:0,next:500};
}
function renderLoyalty(){
  let L=getLevel(totalRecharge);
  document.getElementById('levelBadge').textContent='NIVEAU '+L.level+' / 6';
  let stars=document.getElementById('stars'); stars.innerHTML='';
  for(let i=1;i<=6;i++){ let s=document.createElement('span'); s.textContent='★'; if(i<=L.level) s.className='on'; stars.appendChild(s); }
  let pct=100; if(L.next) pct=Math.min(100,Math.round((totalRecharge-L.min)/(L.next-L.min)*100));
  document.getElementById('progressBar').style.width=pct+'%';
  document.getElementById('loyaltyText').innerHTML = L.next ? 'Total rechargé : <b>'+fmt(totalRecharge)+'</b> — Plus que <b>'+fmt(L.next-totalRecharge)+'</b> pour Niveau '+(L.level+1)+' • Bonus '+fmt(L.bonus) : 'Total rechargé : <b>'+fmt(totalRecharge)+'</b> — Niveau max 6 👑 • Bonus '+fmt(L.bonus);
}

async function load(){
  if(!phoneKey){
    document.getElementById('statut').innerHTML='<span class="badge no">Non connecté</span>';
    fill(); renderLoyalty(); return;
  }
  try{
    var snapClient = await database.ref('clients/'+phoneKey).once('value');
    var dataClient = snapClient.val()||{};
    var snapUser = await database.ref('users/'+phoneKey).once('value');
    var dataUser = snapUser.val()||{};
    currentUser = Object.assign({}, currentUser, dataClient, dataUser);
    if(!currentUser.phone) currentUser.phone = dataClient.phone || dataUser.phone;
    if(!currentUser.photo) currentUser.photo = localStorage.getItem('mayne_avatar')||'';
    localStorage.setItem('mayne_current_user', JSON.stringify(currentUser));
    fill();
    // Calcul fidélité
    let tot=Number(dataClient.total_recharge||dataClient.totalRecharge||0);
    try{
      let sDep=await database.ref('commandes_depots').once('value');
      sDep.forEach(ch=>{ let v=ch.val()||{}; let p=(v.client_id||v.phone||v.user||'').replace(/[^0-9]/g,''); let st=((v.statut||v.status||'').toLowerCase()); if(p===phoneKey && (st.includes('valid')||st.includes('succes')||st.includes('payé')||st.includes('paye'))) tot+=Number(v.montant||v.total||0); });
    }catch(e){}
    if(tot===0) tot=Number(currentUser.solde||0)+Number(currentUser.commission||0);
    totalRecharge=tot; renderLoyalty();
  }catch(e){ console.log(e); fill(); renderLoyalty(); }
}
function fill(){
  document.getElementById('nom').value = currentUser.nom || '';
  document.getElementById('prenom').value = currentUser.prenom || '';
  document.getElementById('phone').value = currentUser.phone || '';
  document.getElementById('email').value = currentUser.email || '';
  document.getElementById('sexe').value = currentUser.sexe || currentUser.genre || '';
  document.getElementById('cni').value = currentUser.cni || currentUser.piece || '';
  document.getElementById('dob').value = currentUser.dob || currentUser.date_naissance || '';
  document.getElementById('pays').value = currentUser.pays || 'Bénin';
  document.getElementById('nameTop').textContent = ((currentUser.prenom||'')+' '+(currentUser.nom||'')).trim() || 'Mon Profil';
  document.getElementById('phoneTop').textContent = currentUser.phone || '';
  showAvatar(currentUser.photo || localStorage.getItem('mayne_avatar'));
  var isVerif = currentUser.verifie === true || currentUser.verifie === 'true' || currentUser.verified===true || currentUser.profil_verifie===true;
  var hasCni = (currentUser.cni||'').length >= 5;
  var html = isVerif ? '<span class="badge ok">✅ Vérifié</span>' : hasCni ? '<span class="badge wait">⏳ En attente</span>' : '<span class="badge no">❌ Non vérifié</span>';
  document.getElementById('statut').innerHTML = html;
}
function saveInfos(){
  let btn=document.getElementById('btnSave'); btn.disabled=true; btn.textContent='⏳ Enregistrement...';
  currentUser.nom = document.getElementById('nom').value.trim();
  currentUser.prenom = document.getElementById('prenom').value.trim();
  currentUser.email = document.getElementById('email').value.trim();
  currentUser.sexe = document.getElementById('sexe').value;
  currentUser.genre = currentUser.sexe;
  currentUser.cni = document.getElementById('cni').value.trim();
  currentUser.piece = currentUser.cni;
  currentUser.dob = document.getElementById('dob').value;
  currentUser.date_naissance = currentUser.dob;
  currentUser.pays = document.getElementById('pays').value;
  if(!currentUser.nom || !currentUser.prenom){ showN('❌ Mets Nom et Prénom'); btn.disabled=false; btn.textContent='ENREGISTRER ✅'; return; }
  if(currentUser.email && !currentUser.email.includes('@')){ showN('❌ Email invalide'); btn.disabled=false; btn.textContent='ENREGISTRER ✅'; return; }
  if(currentUser.cni && currentUser.verifie !== true) currentUser.verifie = false;
  localStorage.setItem('mayne_current_user', JSON.stringify(currentUser));
  var key = (currentUser.phone||phoneKey).replace(/[^0-9]/g,'');
  Promise.all([
    database.ref('clients/'+key).update({nom: currentUser.nom, prenom: currentUser.prenom, email: currentUser.email, sexe: currentUser.sexe, genre: currentUser.genre, cni: currentUser.cni, piece: currentUser.piece, dob: currentUser.dob, date_naissance: currentUser.dob, pays: currentUser.pays, verifie: currentUser.verifie || false, photo: currentUser.photo||''}),
    database.ref('users/'+key).update({nom: currentUser.nom, prenom: currentUser.prenom, phone: currentUser.phone, email: currentUser.email, sexe: currentUser.sexe, genre: currentUser.genre, cni: currentUser.cni, piece: currentUser.piece, dob: currentUser.dob, pays: currentUser.pays, verifie: currentUser.verifie || false, date_update: new Date().toLocaleString('fr-FR')})
  ]).then(function(){ showN('✅ Enregistré'); fill(); btn.disabled=false; btn.textContent='ENREGISTRER ✅'; })
  .catch(function(e){ showN('❌ '+e.message); btn.disabled=false; btn.textContent='ENREGISTRER ✅'; });
}
firebase.auth().onAuthStateChanged(function(user){
  if(user){ load(); }
  else { firebase.auth().signInAnonymously(); }
});
window.onload = function(){ if(firebase.auth().currentUser) load(); };
</script>
</body>
</html>
