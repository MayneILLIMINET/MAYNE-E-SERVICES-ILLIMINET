<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADMIN - Gestion Soldes MAYNE</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#111;color:#fff;display:flex;justify-content:center}
.app{max-width:600px;width:100%;min-height:100vh;background:#1e1e1e;padding:16px;border:5px solid #ff5000}
.input{width:100%;background:#000;color:#fff;padding:12px;border:1px solid #fff;border-radius:8px;margin:6px 0}
.btn{border:none;border-radius:8px;padding:10px 14px;font-weight:800;cursor:pointer}
.btn-save{background:#2b8a3e;color:#fff}.btn-del{background:#c00;color:#fff}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px}
th,td{border:1px solid #333;padding:8px;text-align:left}
th{background:#ff5000}
tr:nth-child(even){background:#2a2a2a}
</style>
</head>
<body>
<div class="app">
<h2>👑 ADMIN - Tous les utilisateurs</h2>
<input id="search" class="input" placeholder="Rechercher nom / numéro..." oninput="filtrer()">
<div id="count" style="color:#ffeb3b;margin:8px 0">Chargement...</div>
<div style="overflow:auto;max-height:80vh">
<table id="table"><thead><tr><th>Nom</th><th>Numéro</th><th>Solde</th><th>Commission</th><th>Action</th></tr></thead><tbody id="tbody"></tbody></table>
</div>
</div>

<script>
var cfg={apiKey:"AIzaSyDR0zDiGxisp4G-CDjltu8VFmxMMFjXI9E",authDomain:"mayneilliminetdb.firebaseapp.com",databaseURL:"https://mayneilliminetdb-default-rtdb.firebaseio.com",projectId:"mayneilliminetdb"};
if(!firebase.apps.length)firebase.initializeApp(cfg);
var db=firebase.database();
var ADMIN_UID="0158612131";
var allUsers=[];

function init(){
  var u=JSON.parse(localStorage.getItem('mayne_current_user')||'null');
  var uid = u ? u.phone.replace(/\D/g,'') : '';
  if(uid !== ADMIN_UID){ document.body.innerHTML='<h2 style="padding:20px">Accès refusé. Admin seulement.</h2>'; return; }

  db.ref('clients').on('value', s=>{
    allUsers=[];
    s.forEach(ch=>{
      var v=ch.val();
      allUsers.push({key:ch.key, nom:v.nom||'', solde:v.solde||0, commission:v.commission||0, gain_parrainage:v.gain_parrainage||0});
    });
    render(allUsers);
  });
}

function render(list){
  document.getElementById('count').innerText = list.length + ' clients';
  var tbody=document.getElementById('tbody');
  tbody.innerHTML='';
  list.forEach(u=>{
    tbody.innerHTML+=`<tr>
      <td>${u.nom}</td>
      <td>${u.key}</td>
      <td><input id="solde-${u.key}" type="number" value="${u.solde}" style="width:80px;background:#000;color:#0f0;border:1px solid #fff;padding:4px"></td>
      <td><input id="com-${u.key}" type="number" value="${u.commission}" style="width:80px;background:#000;color:#ffeb3b;border:1px solid #fff;padding:4px"></td>
      <td><button class="btn btn-save" onclick="sauver('${u.key}')">💾</button></td>
    </tr>`;
  });
}

function sauver(phone){
  var ns = Number(document.getElementById('solde-'+phone).value);
  var nc = Number(document.getElementById('com-'+phone).value);
  db.ref('clients/'+phone).update({solde:ns, commission:nc}).then(()=>alert('✅ '+phone+' mis à jour: '+ns+'F'));
}

function filtrer(){
  var q=document.getElementById('search').value.toLowerCase();
  var f=allUsers.filter(u=> u.nom.toLowerCase().includes(q) || u.key.includes(q));
  render(f);
}

window.onload=init;
</script>
</body>
</html>
