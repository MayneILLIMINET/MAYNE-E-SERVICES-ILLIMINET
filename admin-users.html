<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADMIN USERS LITE</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>body{background:#111;color:#fff;font-family:system-ui;display:flex;justify-content:center} .app{max-width:800px;width:100%;background:#1e1e1e;border:5px solid #ff5000} .top{padding:10px;background:#000;display:flex;justify-content:space-between} .input{width:100%;background:#000;color:#fff;padding:10px;border:1px solid #555;border-radius:8px;margin:6px 0} table{width:100%;border-collapse:collapse;font-size:11px} th,td{border:1px solid #333;padding:5px} th{background:#ff5000} .btn{background:#2b8a3e;color:#fff;border:none;padding:5px 8px;border-radius:4px;font-weight:bold}</style>
</head>
<body>
<div class="app">
<div class="top"><b>👥 ADMIN USERS - SANS OneSignal</b><span id="cu"></span></div>
<input id="s-user" class="input" placeholder="🔍 nom / num..." oninput="filtrer()">
<table><thead><tr><th>Nom</th><th>Num</th><th>Solde</th><th>Com</th><th>Epargne</th><th>Gain</th><th>OK</th></tr></thead><tbody id="tbody"></tbody></table>
</div>
<script>
const firebaseConfig={apiKey:"AIzaSyDR0zDiGxisp4G-CDjltu8VFmxMMFjXI9E",authDomain:"mayneilliminetdb.firebaseapp.com",databaseURL:"https://mayneilliminetdb-default-rtdb.firebaseio.com",projectId:"mayneilliminetdb",storageBucket:"mayneilliminetdb.appspot.com",messagingSenderId:"904857888891",appId:"1:904857888891:web:a89e339ea89de0340a5ade"};
if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
var db=firebase.database(),all=[],ADMIN="0158612131";
function init(){var u=JSON.parse(localStorage.getItem('mayne_current_user')||'null');if(!u||u.phone.replace(/\D/g,'')!==ADMIN){document.body.innerHTML='⛔ Admin seulement';return;}
db.ref('clients').on('value',s=>{all=[];s.forEach(c=>{let v=c.val();all.push({key:c.key,nom:v.nom||'',solde:v.solde||0,commission:v.commission||0,recompense:v.recompense||0,gain_parrainage:v.gain_parrainage||0,parrain:v.parrain||''})});document.getElementById('cu').innerText=all.length;render(all);});}
function render(l){let tb=document.getElementById('tbody');tb.innerHTML='';l.slice(0,500).forEach(u=>{tb.innerHTML+=`<tr><td>${u.nom}<br><small style="color:#ffeb3b">${u.parrain}</small></td><td>${u.key}</td><td><input id="s-${u.key}" type="number" value="${u.solde}" style="width:60px;background:#000;color:#0f0"></td><td><input id="c-${u.key}" type="number" value="${u.commission}" style="width:55px;background:#000;color:#ffeb3b"></td><td><input id="r-${u.key}" type="number" value="${u.recompense}" style="width:55px;background:#000;color:#f0f"></td><td><input id="g-${u.key}" type="number" value="${u.gain_parrainage}" style="width:50px;background:#000;color:#0ff"></td><td><button class="btn" onclick="saveU('${u.key}')">💾</button></td></tr>`;});}
function saveU(p){db.ref('clients/'+p).update({solde:Number(document.getElementById('s-'+p).value),commission:Number(document.getElementById('c-'+p).value),recompense:Number(document.getElementById('r-'+p).value),gain_parrainage:Number(document.getElementById('g-'+p).value)}).then(()=>alert('✅ '+p));}
function filtrer(){let q=document.getElementById('s-user').value.toLowerCase();render(all.filter(u=>u.nom.toLowerCase().includes(q)||u.key.includes(q)));}window.onload=init;
</script>
</body>
</html>
