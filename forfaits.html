<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forfait & Crédit MAYNE</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#f5000;color:#fff;display:flex;justify-content:center}
.app{max-width:430px;width:100%;min-height:100vh;background:#1e1e1e;padding-bottom:90px;border:5px solid #fff;position:relative}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px}
.avatar{width:44px;height:44px;border-radius:50%;background:#feb3;display:flex;align-items:center;justify-content:center;font-weight:800}
.card{margin:12px 16px;background:#aaaa;border:10px solid #ff5000;border-radius:22px;padding:18px}
.montant{font-size:22px;font-weight:900;margin:8px 0}
.input{width:100%;background:#1e1e1e;color:#fff;padding:13px;border:1px solid #fff;border-radius:12px;margin:6px 0}
.select{width:100%;background:#1e1e1e;color:#fff;padding:13px;border:1px solid #fff;border-radius:12px;margin:6px 0}
.btn{width:100%;background:#2b8a3e;border:none;border-radius:100px;padding:14px;font-weight:800;color:#fff;cursor:pointer;margin-top:10px}
.list{padding:16px}
.item{background:#000;border-radius:12px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:430px;width:100%;background:#000;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #333}
.bnav{border:none;background:none;font-size:11px;color:#fff;cursor:pointer;padding:8px 12px}
.bnav.active{background:#0f3d2e;color:#d6f78c;border-radius:100px;font-weight:700}
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:9999;padding:15px}
.modal-box{background:#1e1e1e;color:#fff;padding:20px;border-radius:10px;max-width:320px;width:100%;text-align:center}
.modal-btn{flex:1;padding:12px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;font-size:13px}
.btn-yes{background:#2b8a3e;color:#fff}
.btn-no{background:#555;color:#fff}
.btn-retour{background:#fff;color:#111;width:100%;margin-top:8px}
.modal-btns{display:flex;gap:8px;margin-top:12px}
.daily-box{background:#000;border:2px solid #ff5000;border-radius:14px;padding:12px;margin:12px 16px;font-size:13px;line-height:1.6}
.daily-box b{color:#ffeb3b}
.daily-row{display:flex;justify-content:space-between}
</style>
</head>
<body>
<div class="app">
<div id="global-notif" style="display:none;position:fixed;top:15px;left:50%;transform:translateX(-50%);z-index:99999;background:#008000;color:#fff;padding:12px 18px;font-weight:bold;text-align:center;border-radius:8px;box-shadow:0 4px 15px rgba(0,0,0,.4);"></div>

<div class="top"><div style="display:flex;gap:10px;align-items:center"><div class="avatar" id="av">M</div><div><b id="uname">Chargement...</b><br><span id="uemail" style="font-size:11px;color:#aaa"></span></div></div><button class="bnav" id="btn-notif" onclick="location.href='notifications.html'">NOTIF🔔</button></div>

<div class="card">
<div style="font-size:12px;color:#a8c0b6">Solde Principal</div>
<div class="montant" id="solde">0.00 XOF</div>
<div style="font-size:12px;color:#aaa">BONUS: <b id="com">0 XOF</b></div>
</div>

<div class="daily-box" id="daily-box">
  <div style="text-align:center;font-weight:900;margin-bottom:4px">📊 <span id="daily-date">Aujourd'hui</span></div>
  <div class="daily-row"><span>📱 Forfait total :</span><b id="daily-forfait">0F + (0F en cours)</b></div>
  <div style="font-size:11px;color:#aaa;text-align:center;margin-top:4px" id="daily-hier">Hier : —</div>
</div>

<div class="card">
<h3>Forfait & Crédit</h3>
<label style="font-size:12px">Réseau</label>
<select id="forfait-reseau" class="select">
<option value="MTN">MTN</option>
<option value="MOOV">MOOV</option>
<option value="CELTIS">CELTIS</option>
</select>
<label style="font-size:12px;margin-top:8px;display:block">Motif</label>
<select id="forfait-motif" class="select">
<option value="CREDIT SIMPLE">CRÉDIT SIMPLE</option>
<option value="FORFAIT APPEL">FORFAIT APPEL</option>
<option value="INTERNET VOLUME">INTERNET VOLUME</option>
<option value="APPEL ET INTERNET">APPEL ET INTERNET</option>
<option value="ILLIMITE">ILLIMITÉ</option>
</select>
<input id="forfait-numero" class="input" placeholder="Numéro bénéficiaire">
<input id="forfait-montant" type="number" class="input" placeholder="Montant">
<input id="forfait-wa" class="input" placeholder="Numéro WhatsApp (facultatif)">
<button class="btn" id="btnValider" onclick="executerForfait()">Acheter maintenant</button>
<div id="forfait-status" style="margin-top:8px;font-size:12px;display:none;text-align:center"></div>
</div>

<div class="list" id="histo-block">
<h3>Mon historique Forfait</h3>
<div id="histo">Aucun achat</div>
</div>
</div>

<div class="bottom">
<button class="bnav" onclick="location.href='index.html'">🏠 ACCUEIL</button>
<button class="bnav" onclick="location.href='epargne.html'">EPARGNE⭐</button>
<button class="bnav" onclick="location.href='p2p.html'">P2P🚀</button>
<button class="bnav active">FORFAIT📱</button>
</div>

<div id="custom-alert" class="modal-overlay"><div class="modal-box"><div id="alert-msg"></div><button class="modal-btn btn-yes" style="margin-top:10px" onclick="hideAlert()">OK</button></div></div>

<div id="custom-confirm" class="modal-overlay" onclick="if(event.target===this) doRetour()">
  <div class="modal-box">
    <div id="confirm-msg" style="font-size:15px;line-height:1.6"></div>
    <div class="modal-btns">
      <button class="modal-btn btn-no" onclick="doConfirm(false)">☎️MESSAGERIE<br><small style="font-weight:400;font-size:11px">→ Dans Actifer</small></button>
      <button class="modal-btn btn-yes" onclick="doConfirm(true)">☎️WHATSAPP<br><small style="font-weight:400;font-size:11px">→ Sur WhatsApp</small></button>
    </div>
    <button class="modal-btn btn-retour" onclick="doRetour()">🔙 Retour - Voir mon statut dans l'historique</button>
    <div style="font-size:11px;color:#aaa;margin-top:8px">Ou clique dans le vide pour revenir</div>
  </div>
</div>

<script>
var cfg={apiKey:"AIzaSyDR0zDiGxisp4G-CDjltu8VFmxMMFjXI9E",authDomain:"mayneilliminetdb.firebaseapp.com",databaseURL:"https://mayneilliminetdb-default-rtdb.firebaseio.com",projectId:"mayneilliminetdb"};
if(!firebase.apps.length)firebase.initializeApp(cfg);
var db=firebase.database();
var uid,userNom='Client',solde=0,_lock=false,confirmCallback=null;
var ADMIN_UID="0158612131";
var ADMIN_NOM="AYIZAN";
var WHATSAPP_ADMIN="2290159415617";
var WEBHOOK_URL='https://script.google.com/macros/s/AKfycbwasVyjf7iuYpMoonjNy-byi-_DKBeg9VRUfrWsnXQSPJNDElCVgV67ZFiZjY-eckpH/exec';
var ONESIGNAL_WEBHOOK='https://script.google.com/macros/s/AKfycbzoM5bqwSZm83RtFHaJK58ByQCqByYc2hCk58GA-97h0FTsC4cqca12cj38w0tf7jxv/exec';
var lastCommandeTexte='';
var lastCommandeData=null;

function showAlert(m){document.getElementById('alert-msg').innerText=m;document.getElementById('custom-alert').style.display='flex';}
function hideAlert(){document.getElementById('custom-alert').style.display='none';}
function showConfirm(m,cb){confirmCallback=cb;document.getElementById('confirm-msg').innerHTML=m;document.getElementById('custom-confirm').style.display='flex';}
function doConfirm(y){document.getElementById('custom-confirm').style.display='none';if(confirmCallback)confirmCallback(y);}
function doRetour(){
  document.getElementById('custom-confirm').style.display='none';
  confirmCallback=null;
  afficherSucces('forfait-status');
  var h=document.getElementById('histo-block');
  if(h) h.scrollIntoView({behavior:'smooth'});
}
function envoyerAlerte(service,data){
  try{
    var p={service:service,id:Date.now(),data:Object.assign({},data,{client_nom:userNom,client_id:uid})};
    fetch(WEBHOOK_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});
  }catch(e){}
}
function afficherSucces(id){const m='commande envoyée avec succès!';const t=document.getElementById('global-notif');t.innerText='✅ '+m;t.style.display='block';setTimeout(()=>t.style.display='none',20000);const e=document.getElementById(id);if(e){e.innerText=m+' - Suis ton statut dans l\'historique ci-dessous';e.style.display='block';e.style.color='#006400';}}

/* === SUPPORT : PAS BESOIN = MESSAGERIE / OUI = WHATSAPP / RETOUR = HISTORIQUE === */
function proposerSupport(s,d,cb){
  var txt=`🔔 URGENT🧭\n🔈 SERVICE : ${s}\n👤 CLIENT : ${userNom} (${uid})\n💬 DÉTAILS:\n`;
  for(const[k,v]of Object.entries(d)){ txt+=`${k}: ${v}\n`; }
  lastCommandeTexte=txt;
  lastCommandeData=d;
  showConfirm('Contacter le personnel ?<br><span style="font-size:13px;color:#aaa">Pas besoin = <b style="color:#fff">Messagerie</b><br>Oui bien sûr = <b style="color:#25D366">WhatsApp</b></span>', function(yes){
    if(yes){
      var txtWA = txt + '\n💬 Réponse personnel : Oui bien sûr → WhatsApp';
      window.open('https://wa.me/'+WHATSAPP_ADMIN+'?text='+encodeURIComponent(txtWA),'_blank');
      if(cb)cb();
    }else{
      var convId=[uid,ADMIN_UID].sort().join('_');
      var texteMessagerie = lastCommandeTexte + '\n━━━━━━━━━━━━━━\n💬 Réponse personnel : Pas besoin → Messagerie';
      localStorage.setItem('mayne_pending_admin_msg', JSON.stringify({convId:convId, adminId:ADMIN_UID, adminNom:ADMIN_NOM, texte:texteMessagerie}));
      location.href='messagerie.html?conv='+convId+'&to='+ADMIN_UID;
    }
  });
}

async function pushJS(destId,titre,fullData){
  if(!destId)return;
  try{
    let msg = fullData? `📱 ${fullData.operateur} - ${fullData.type}\n📅 ${fullData.date}\n👤 ${fullData.client_id} (${fullData.client_nom})\n🔢 Num benef: ${fullData.numero_beneficiaire}\n💰 ${fullData.montant}F\n📞 WA: ${fullData.whatsapp_client}\n📌 ${fullData.statut}` : titre;
    await fetch(ONESIGNAL_WEBHOOK,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify({destId:destId,titre:titre,message:msg})});
  }catch(e){}
}

/* === NOTIF ADMIN COMPLÈTE - CLOCHE + ONESIGNAL === */
async function notifierAdminCommande(fullData, convId){
  var titreNotif = userNom + " vous a envoyé une nouvelle commande !";
  var texteNotif = "📱 FORFAIT " + fullData.montant + "F - " + fullData.operateur + " " + fullData.motif + " vers " + fullData.numero_beneficiaire + " - Clique pour répondre";
  try{
    // 1. Cloche dans l'app
    await db.ref('notifications/'+ADMIN_UID).push({titre:titreNotif, message:texteNotif, date:fullData.date, createdAt:Date.now(), type:'commande_forfait', from_id:uid, from_nom:userNom, convId:convId, lu:false});
  }catch(e){}
  try{
    // 2. Notif téléphone même si app fermée
    await pushJS(ADMIN_UID, titreNotif, fullData);
    await fetch(ONESIGNAL_WEBHOOK,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify({destId:ADMIN_UID, titre:titreNotif, message:texteNotif})});
  }catch(e){}
  try{ envoyerAlerte('forfait_credit', fullData); }catch(e){}
}

/* === CALCUL JOURNALIER FORFAIT + RESET 24H === */
function dayKeyFromTs(ts){ var d=new Date(ts); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function todayKey(){ return dayKeyFromTs(Date.now()); }
function isToday(v){
  if(v.createdAt) return dayKeyFromTs(v.createdAt)===todayKey();
  if(v.date){
    var m=String(v.date).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if(m){ var k=m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'); return k===todayKey(); }
  }
  return false;
}
function isEnCours(v){ return String(v.statut||'').toLowerCase().includes('cours'); }
function isValide(v){ var s=String(v.statut||'').toLowerCase(); return s.includes('valid')||s.includes('trait')||s.includes('termin')||s.includes('fait'); }
function checkDailyReset(total, enCours){
  var lastDay=localStorage.getItem('mayne_daily_forfait_last_day');
  var today=todayKey();
  if(lastDay && lastDay!==today){
    var hier=JSON.parse(localStorage.getItem('mayne_daily_forfait_'+lastDay)||'null');
    if(hier){
      localStorage.setItem('mayne_daily_forfait_hier', JSON.stringify({day:lastDay, total:hier.total, enCours:hier.enCours}));
      db.ref('daily_totals_forfait/'+lastDay).set({day:lastDay, total:hier.total, en_cours:hier.enCours, client_id:uid, client_nom:userNom, archive_le:Date.now()});
    }
  }
  localStorage.setItem('mayne_daily_forfait_last_day', today);
  localStorage.setItem('mayne_daily_forfait_'+today, JSON.stringify({total:total, enCours:enCours}));
  var hierData=JSON.parse(localStorage.getItem('mayne_daily_forfait_hier')||'null');
  var hierEl=document.getElementById('daily-hier');
  if(hierData && hierEl) hierEl.textContent='Hier ('+hierData.day+') : Forfait '+hierData.total+'F + ('+hierData.enCours+'F en cours)';
  var dateEl=document.getElementById('daily-date');
  if(dateEl) dateEl.textContent='Aujourd\'hui - '+new Date().toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'});
}
function updateDailyUI(total, enCours){
  document.getElementById('daily-forfait').textContent=total+'F + ('+enCours+'F en cours)';
  checkDailyReset(total, enCours);
}

async function init(){
  var u=JSON.parse(localStorage.getItem('mayne_current_user')||'null');
  if(!u||!u.phone){location.href='index.html';return;}
  uid=u.phone.replace(/[^0-9]/g,'');userNom=u.nom||u.phone;
  document.getElementById('uname').textContent=userNom;
  document.getElementById('uemail').textContent=u.phone;
  document.getElementById('av').textContent=(userNom[0]||'M').toUpperCase();
  db.ref('clients/'+uid).on('value',function(s){var d=s.val()||{};solde=+d.solde||0;document.getElementById('solde').textContent=solde.toFixed(2)+' XOF';document.getElementById('com').textContent=(+d.commission||0).toFixed(2)+' XOF';});
  if(uid===ADMIN_UID){
    db.ref('commandes_forfaits').on('value', s=>{
      var n=0;
      s.forEach(ch=>{ if(String(ch.val().statut||'').toLowerCase().includes('cours')) n++; });
      var btn=document.getElementById('btn-notif');
      if(btn) btn.innerText = n>0 ? 'NOTIF🔔 ('+n+')' : 'NOTIF🔔';
    });
    db.ref('commandes_forfaits').orderByChild('createdAt').limitToLast(1).on('child_added', snap=>{
      var v=snap.val()||{};
      if(!v.createdAt) return;
      if(Date.now() - v.createdAt > 60000) return;
      var t=document.getElementById('global-notif');
      t.innerText='🔔 NOUVEAU FORFAIT '+v.montant+'F - '+v.client_nom;
      t.style.display='block';
      setTimeout(()=>{ t.style.display='none'; }, 20000);
      document.title='🔔 NOUVEAU FORFAIT - MAYNE';
    });
  }
  db.ref('commandes_forfaits').orderByChild('client_id').equalTo(uid).on('value',function(s){
    var c=document.getElementById('histo');
    if(!s.exists()){c.innerHTML='Aucun achat';updateDailyUI(0,0);return;}
    var h='';var total=0,enCours=0;
    s.forEach(function(ch){var v=ch.val();
      if(isToday(v)){
        var montant=Number(v.montant||0);
        if(isEnCours(v)) enCours+=montant; else if(!String(v.statut||'').toLowerCase().includes('annul')) total+=montant;
      }
      var col='#ffbb00';if(isValide(v))col='#28a745';if((v.statut||'').toLowerCase().includes('annul'))col='#dc3545';
      h='<div class=item><div><b>'+v.operateur+' - '+v.motif+'</b><br><small>'+v.numero_beneficiaire+' - '+v.date+'</small></div><div style="text-align:right"><b>'+v.montant+'F</b><br><span style="background:'+col+';color:#fff;padding:2px 6px;border-radius:4px;font-size:10px">'+v.statut+'</span></div></div>'+h;
    });
    c.innerHTML=h;
    updateDailyUI(total,enCours);
  });
}

async function executerForfait(){
  var reseau=document.getElementById('forfait-reseau').value;
  var motif=document.getElementById('forfait-motif').value;
  var numero=document.getElementById('forfait-numero').value.trim();
  var montant=Number(document.getElementById('forfait-montant').value);
  var wa=document.getElementById('forfait-wa').value.trim();
  if(!numero)return showAlert('Numéro bénéficiaire requis');
  if(!montant||montant<100)return showAlert('Montant >=100F requis');
  if(solde<montant)return showAlert('Solde insuffisant: '+solde+'F');
  if(_lock)return;_lock=true;document.getElementById('btnValider').innerText='Traitement...';document.getElementById('btnValider').disabled=true;
  try{
    await db.ref('clients/'+uid).update({solde:solde-montant});
    let fullData={client_id:uid,client_nom:userNom,operateur:reseau,type:motif,motif:motif,numero_beneficiaire:numero,numero:numero,montant:montant,whatsapp_client:wa||'',date:new Date().toLocaleString('fr-FR'),createdAt:Date.now(),statut:'en cours'};
    await db.ref('commandes_forfaits').push().set(fullData);
    db.ref('notifications/'+uid).push({titre:"Forfait en cours",message:`${reseau} ${motif} ${montant}F vers ${numero}`,date:fullData.date});
    db.ref('notifications/'+ADMIN_UID).push({titre:"Nouveau Forfait",message:`${montant}F ${reseau} ${motif} Client:${uid} (${userNom})`,date:fullData.date});
    // Message en messagerie
    var convId=[uid,ADMIN_UID].sort().join('_');
    await db.ref('conversations/'+convId+'/messages').push().set({senderId:uid,senderNom:userNom,type:'text',texte:`📱 FORFAIT\nReseau:${reseau}\nMotif:${motif}\nNumero:${numero}\nMontant:${montant}\nClient:${userNom} (${uid})\nWA:${wa||'non fourni'}`,createdAt:Date.now()});
    // === NOTIF ADMIN QUI MANQUAIT AVANT ===
    await notifierAdminCommande(fullData, convId);
    proposerSupport('forfait_credit',fullData,()=>afficherSucces('forfait-status'));
    document.getElementById('forfait-numero').value='';document.getElementById('forfait-montant').value='';document.getElementById('forfait-wa').value='';
  }catch(e){showAlert('Erreur: '+e.message);}
  finally{_lock=false;document.getElementById('btnValider').innerText='Acheter maintenant';document.getElementById('btnValider').disabled=false;}
}
firebase.auth().onAuthStateChanged(function(user){
  if(user){ init(); } 
  else { firebase.auth().signInAnonymously(); }
});
</script>
</body>
</html>
