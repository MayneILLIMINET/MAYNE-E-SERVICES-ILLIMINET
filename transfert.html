<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Transfert - MAYNE</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#f5000;color:#fff;display:flex;justify-content:center}
.app{max-width:430px;width:100%;min-height:100vh;background:#1e1e1e;padding-bottom:90px;border:5px solid #fff;position:relative}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px}
.avatar{width:44px;height:44px;border-radius:50%;background:#feb3;display:flex;align-items:center;justify-content:center;font-weight:800}
.card{margin:12px 16px;background:#aaaa;border:10px solid #ff5000;border-radius:22px;padding:18px}
.montant{font-size:22px;font-weight:900;margin:8px 0}
.input{width:100%;background:#1e1e1e;color:#fff;padding:13px;border:1px solid #fff;border-radius:12px;margin:6px 0}
.select{width:100%;background:#1e1e1e;color:#fff;padding:13px;border:1px solid #fff;border-radius:12px;margin:6px 0}
.btn{width:100%;background:#2b8a3e;border:none;border-radius:100px;padding:14px;font-weight:800;color:#fff;cursor:pointer;margin-top:10px}
.list{padding:16px}
.item{background:#000;border-radius:12px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:430px;width:100%;background:#000;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #333}
.bnav{border:none;background:none;font-size:11px;color:#fff;cursor:pointer;padding:8px 12px}
.bnav.active{background:#ff5000;color:#fff;border-radius:100px;font-weight:700}
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:9999;padding:15px}
.modal-box{background:#1e1e1e;color:#fff;padding:20px;border-radius:10px;max-width:300px;width:100%;text-align:center}
.modal-btn{flex:1;padding:10px;border:none;border-radius:6px;font-weight:bold;cursor:pointer}
.btn-yes{background:#2b8a3e;color:#fff}
.btn-no{background:#ddd;color:#000}
.modal-btns{display:flex;gap:8px;margin-top:12px}
.prefix-box{display:flex;align-items:center;gap:0;margin:6px 0}
.prefix{padding:13px 10px;background:#1e1e1e;color:#ffeb3b;font-weight:bold;border:1px solid #fff;border-right:none;border-radius:12px 0 0 12px;min-width:70px;text-align:center}
.input-with-prefix{border-radius:0 12px 12px 0!important;flex:1}
</style>
</head>
<body>
<div class="app">
<div id="global-notif" style="display:none;position:fixed;top:15px;left:50%;transform:translateX(-50%);z-index:99999;background:#008000;color:#fff;padding:12px 18px;font-weight:bold;text-align:center;border-radius:8px;box-shadow:0 4px 15px rgba(0,0,0,.4);"></div>

<div class="top"><div style="display:flex;gap:10px;align-items:center"><div class="avatar" id="av">M</div><div><b id="uname">Chargement...</b><br><span id="uemail" style="font-size:11px;color:#aaa"></span></div></div><button class="bnav" onclick="location.href='notifications.html'">NOTIF🔔</button></div>

<div class="card">
<div style="font-size:12px;color:#aaa">Solde Principal</div>
<div class="montant" id="solde">0.00 XOF</div>
<div style="font-size:12px;color:#c00">BONUS: <b id="com">0 XOF</b></div>
</div>

<div class="card">
<h3 style="color:#fff">Transfert International</h3>

<label style="font-size:12px;color:#aaa">1. <b>PAYS *</label>
<select id="transfert-pays" class="select" onchange="updateIndicatif()">
<option value="229" data-pays="🇧🇯 BÉNIN">🇧🇯 BÉNIN - 229</option>
<option value="228" data-pays="🇹🇬 TOGO">🇹🇬 TOGO - 228</option>
<option value="234" data-pays="🇳🇬 NIGÉRIA">🇳🇬 NIGÉRIA - 234</option>
<option value="233" data-pays="🇬🇭 GHANA">🇬🇭 GHANA - 233</option>
<option value="225" data-pays="🇨🇮 CÔTE D'IVOIRE">🇨🇮 CÔTE D'IVOIRE - 225</option>
<option value="223" data-pays="🇲🇱 MALI">🇲🇱 MALI - 223</option>
<option value="227" data-pays="🇳🇪 NIGER">🇳🇪 NIGER - 227</option>
</select>

<label style="font-size:12px;color:#aaa;margin-top:6px;display:block">2. <b>RESEAU DU TRANSFERT *</label>
<select id="transfert-reseau" class="select">
<option value="MTN">MTN</option>
<option value="MOOV">MOOV</option>
<option value="CELTIS">CELTIS</option>
<option value="ORANGE MONEY">ORANGE MONEY</option>
<option value="WAVE">WAVE</option>
<option value="MTN TOGO">MTN TOGO</option>
</select>

<label style="font-size:12px;color:#aaa;margin-top:6px;display:block">3. <b>NUMERO BENEFICIAIRE *</label>
<div class="prefix-box"><span id="prefix-affiche" class="prefix">+229</span><input id="transfert-numero" class="input input-with-prefix" placeholder=""></div>

<label style="font-size:12px;color:#aaa">4. <b>MONTANT (XOF)  *</label>
<input id="transfert-montant" type="number" class="input" placeholder="">

<label style="font-size:12px;color:#aaa">5. <b>MOTIF  *</label>
<input id="transfert-motif" class="select" type="none" class="input" placeholder="Ex: Loyer">
</input>

<label style="font-size:12px;color:#aaa">6. WhatsApp (facultatif)</label>
<input id="transfert-wa" class="input" placeholder="Votre WhatsApp">

<button class="btn" id="btnValider" onclick="executerTransfert()">Valider Transfert</button>
<div id="transfert-status" style="margin-top:8px;font-size:12px;display:none;text-align:center"></div>
</div>

<div class="list">
<h3>Mon historique Transfert</h3>
<div id="histo">Aucun transfert</div>
</div>
</div>

<div class="bottom">
<button class="bnav" onclick="location.href='index.html'">🏠 ACCUEIL</button>
<button class="bnav" onclick="location.href='forfait.html'">FORFAIT📱</button>
<button class="bnav active">TRANSFERT💸</button>
<button class="bnav" onclick="location.href='echange.html'">ECHANGE🔄</button>
</div>

<div id="custom-alert" class="modal-overlay"><div class="modal-box"><div id="alert-msg"></div><button class="modal-btn btn-yes" style="margin-top:10px" onclick="hideAlert()">OK</button></div></div>
<div id="custom-confirm" class="modal-overlay"><div class="modal-box"><div id="confirm-msg"></div><div class="modal-btns"><button class="modal-btn btn-no" onclick="doConfirm(false)">Pas besoin</button><button class="modal-btn btn-yes" onclick="doConfirm(true)">Oui bien sûr</button></div></div></div>

<script>
var cfg={apiKey:"AIzaSyDR0zDiGxisp4G-CDjltu8VFmxMMFjXI9E",authDomain:"mayneilliminetdb.firebaseapp.com",databaseURL:"https://mayneilliminetdb-default-rtdb.firebaseio.com",projectId:"mayneilliminetdb"};
if(!firebase.apps.length)firebase.initializeApp(cfg);
var db=firebase.database();
var uid,userNom='Client',solde=0,_lock=false,confirmCallback=null;
var ADMIN_UID="0158612131";
var WEBHOOK_URL='https://script.google.com/macros/s/AKfycbwasVyjf7iuYpMoonjNy-byi-_DKBeg9VRUfrWsnXQSPJNDElCVgV67ZFiZjY-eckpH/exec';
var ONESIGNAL_WEBHOOK='https://script.google.com/macros/s/AKfycbzoM5bqwSZm83RtFHaJK58ByQCqByYc2hCk58GA-97h0FTsC4cqca12cj38w0tf7jxv/exec';

function showAlert(m){document.getElementById('alert-msg').innerText=m;document.getElementById('custom-alert').style.display='flex';}
function hideAlert(){document.getElementById('custom-alert').style.display='none';}
function showConfirm(m,cb){confirmCallback=cb;document.getElementById('confirm-msg').innerText=m;document.getElementById('custom-confirm').style.display='flex';}
function doConfirm(y){document.getElementById('custom-confirm').style.display='none';if(confirmCallback)confirmCallback(y);}
function envoyerAlerte(service,data){try{const p={service:service,id:Date.now(),data:Object.assign({},data,{client_id:uid||'',client_nom:userNom,telephone_compte:uid})};fetch(WEBHOOK_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p),keepalive:true});}catch(e){}}
function afficherSucces(id){const m='commande envoyée avec succès!';const t=document.getElementById('global-notif');t.innerText='✅ '+m;t.style.display='block';setTimeout(()=>t.style.display='none',20000);const e=document.getElementById(id);if(e){e.innerText=m;e.style.display='block';e.style.color='#006400';}}
function proposerSupport(s,d,cb){let details='';for(const[k,v]of Object.entries(d)){details+=`${k}: ${v}\n`;}const txt=`🔔 URGENT🧭\n🔈 SERVICE : ${s}\n👤 CLIENT : ${userNom}\n💬 DÉTAILS:\n${details}`;showConfirm('Voulez-vous contacter le personnel sur WhatsApp pour un traitement rapide?',function(yes){if(yes)window.open('https://wa.me/2290159415617?text='+encodeURIComponent(txt),'_blank');if(cb)cb();});}
async function pushJS(destId,titre,fullData){
  if(!destId)return;
  try{
    let msg = `🌍 ${fullData.pays}\n📡 ${fullData.reseau}\n🔢 Num: ${fullData.numero_complet}\n💰 ${fullData.montant}F\n📝 Motif: ${fullData.motif}\n📞 WA: ${fullData.whatsapp_client||'non fourni'}\n📌 ${fullData.statut}`;
    await fetch(ONESIGNAL_WEBHOOK,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify({destId:destId,titre:titre,message:msg})});
  }catch(e){}
}
function updateIndicatif(){document.getElementById('prefix-affiche').innerText='+'+document.getElementById('transfert-pays').value;}

async function init(){
  var u=JSON.parse(localStorage.getItem('mayne_current_user')||'null');
  if(!u||!u.phone){location.href='index.html';return;}
  uid=u.phone.replace(/[^0-9]/g,'');userNom=u.nom||u.phone;
  document.getElementById('uname').textContent=userNom;
  document.getElementById('uemail').textContent=u.phone;
  document.getElementById('av').textContent=(userNom[0]||'M').toUpperCase();
  updateIndicatif();
  db.ref('clients/'+uid).on('value',function(s){var d=s.val()||{};solde=+d.solde||0;document.getElementById('solde').textContent=solde.toFixed(2)+' XOF';document.getElementById('com').textContent=(+d.commission||0).toFixed(2)+' XOF';});
  db.ref('commandes_transferts').orderByChild('client_id').equalTo(uid).on('value',function(s){
    var c=document.getElementById('histo');
    if(!s.exists()){c.innerHTML='Aucun transfert';return;}
    var h='';s.forEach(function(ch){var v=ch.val();var col='#ffbb00';if((v.statut||'').toLowerCase().includes('valid'))col='#28a745';if((v.statut||'').toLowerCase().includes('annul'))col='#dc3545';h='<div class=item><div><b>'+v.pays+' - '+v.reseau+'</b><br><small>'+v.numero_complet+' - '+v.date+'</small></div><div style="text-align:right"><b>'+v.montant+'F</b><br><span style="background:'+col+';color:#fff;padding:2px 6px;border-radius:4px;font-size:10px">'+v.statut+'</span></div></div>'+h;});c.innerHTML=h;
  });
}

async function executerTransfert(){
  var selPays=document.getElementById('transfert-pays');
  var indicatif=selPays.value;
  var paysNom=selPays.options[selPays.selectedIndex].getAttribute('data-pays');
  var reseau=document.getElementById('transfert-reseau').value;
  var numeroSans=document.getElementById('transfert-numero').value.trim().replace(/\s/g,'');
  var montant=Number(document.getElementById('transfert-montant').value);
  var motif=document.getElementById('transfert-motif').value;
  var wa=document.getElementById('transfert-wa').value.trim();

  if(!numeroSans)return showAlert('Numéro bénéficiaire requis');
  if(!montant||montant<100)return showAlert('Montant >=100F requis');
  if(solde<montant)return showAlert('Solde insuffisant: '+solde+'F');
  if(_lock)return;_lock=true;document.getElementById('btnValider').innerText='Traitement...';document.getElementById('btnValider').disabled=true;

  try{
    await db.ref('clients/'+uid).update({solde:solde-montant});
    let numeroComplet='+'+indicatif+numeroSans;
    let fullData={client_id:uid,pays:paysNom,pays_code:indicatif,reseau:reseau,numero_beneficiaire:numeroSans,numero_complet:numeroComplet,montant:montant,motif:motif,whatsapp_client:wa||'',date:new Date().toLocaleString('fr-FR'),statut:'en cours'};
    await db.ref('commandes_transferts').push().set(fullData);
    let alerteData={pays:paysNom,reseau:reseau,numero_beneficiaire:numeroComplet,montant:montant,motif:motif,whatsapp:wa||'non fourni'};
    pushJS(ADMIN_UID,"NOUVEAU TRANSFERT "+montant+"F",fullData);
    envoyerAlerte('transfert',alerteData);
    db.ref('notifications/'+uid).push({titre:"Transfert en cours",message:`${montant}F vers ${numeroComplet} ${reseau}`,date:fullData.date});
    db.ref('notifications/'+ADMIN_UID).push({titre:"Nouveau Transfert",message:`${montant}F ${paysNom} ${reseau} Client:${uid}`,date:fullData.date});
    var convId=[uid,ADMIN_UID].sort().join('_');
    await db.ref('conversations/'+convId+'/messages').push().set({senderId:uid,senderNom:userNom,type:'text',texte:`💸 TRANSFERT\nPays:${paysNom}\nReseau:${reseau}\nNumero:${numeroComplet}\nMontant:${montant}\nMotif:${motif}\nWA:${wa||'non fourni'}`,createdAt:Date.now()});
    proposerSupport('transfert',alerteData,()=>afficherSucces('transfert-status'));
    document.getElementById('transfert-numero').value='';document.getElementById('transfert-montant').value='';document.getElementById('transfert-wa').value='';
  }catch(e){showAlert('Erreur: '+e.message);}
  finally{_lock=false;document.getElementById('btnValider').innerText='Valider Transfert';document.getElementById('btnValider').disabled=false;}
}
window.onload=init;
</script>
</body>
</html>
