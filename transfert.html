<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Transfert - MAYNE</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#f5000;color:#fff;display:flex;justify-content:center}
.app{max-width:430px;width:100%;min-height:100vh;background:#1e1e1e;padding-bottom:90px;border:5px solid #fff;position:relative}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px}
.avatar{width:44px;height:44px;border-radius:50%;background:#feb3;display:flex;align-items:center;justify-content:center;font-weight:800}
.card{margin:12px 16px;background:#aaaa;border:10px solid #ff5000;border-radius:22px;padding:18px}
.montant{font-size:22px;font-weight:900;margin:8px 0}
.input{width:100%;background:#1e1e1e;color:#fff;padding:13px;border:1px solid #fff;border-radius:12px;margin:6px 0}
.select{width:100%;background:#1e1e1e;color:#fff;padding:13px;border:1px solid #fff;border-radius:12px;margin:6px 0}
.btn{width:100%;border:none;border-radius:100px;padding:14px;font-weight:800;color:#fff;cursor:pointer;margin-top:10px}
.btn-envoi{background:#ff5000}.btn-retrait{background:#e67e22}.btn-valid{background:#2b8a3e}
.list{padding:16px}.item{background:#000;border-radius:12px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:430px;width:100%;background:#000;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #333}
.bnav{border:none;background:none;font-size:11px;color:#fff;cursor:pointer;padding:8px 12px}
.bnav.active{background:#ff5000;color:#fff;border-radius:100px;font-weight:700}
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:9999;padding:15px}
.modal-box{background:#1e1e1e;color:#fff;padding:20px;border-radius:10px;max-width:300px;width:100%;text-align:center}
.modal-btn{flex:1;padding:10px;border:none;border-radius:6px;font-weight:bold;cursor:pointer}
.btn-yes{background:#2b8a3e;color:#fff}.btn-no{background:#ddd;color:#000}.modal-btns{display:flex;gap:8px;margin-top:12px}
.prefix-box{display:flex;align-items:center;gap:0;margin:6px 0}
.prefix{padding:13px 10px;background:#1e1e1e;color:#ffeb3b;font-weight:bold;border:1px solid #fff;border-right:none;border-radius:12px 0 0 12px;min-width:70px;text-align:center}
.input-with-prefix{border-radius:0 12px 12px 0!important;flex:1}
.toggle{display:flex;gap:6px;margin-bottom:12px}.toggle button{flex:1}
.warning-box{background:#1e1e1e;border:2px dashed #ffeb3b;border-radius:12px;padding:12px;margin:10px 0;display:none;text-align:left}
</style>
</head>
<body>
<div class="app">
<div id="global-notif" style="display:none;position:fixed;top:15px;left:50%;transform:translateX(-50%);z-index:99999;background:#008000;color:#fff;padding:12px 18px;font-weight:bold;text-align:center;border-radius:8px;"></div>
<div class="top"><div style="display:flex;gap:10px;align-items:center"><div class="avatar" id="av">M</div><div><b id="uname">Chargement...</b><br><span id="uemail" style="font-size:11px;color:#aaa"></span></div></div><button class="bnav" onclick="location.href='notifications.html'">NOTIF🔔</button></div>
<div class="card"><div style="font-size:12px;color:#aaa">Solde Principal</div><div class="montant" id="solde">0.00 XOF</div><div style="font-size:12px;color:#c00">BONUS: <b id="com">0 XOF</b></div></div>

<div class="card">
<h3>Transfert /RETRAIT-INTERNE</h3>
<div class="toggle"><button id="tab-envoi" class="select" style="background:#ff5000" onclick="switchMode('envoi')">Envoi</button><button id="tab-retrait" class="select" style="background:#1e1e1e" onclick="switchMode('retrait')">Retrait</button></div>

<div id="zone-envoi">
<label style="font-size:12px;color:#aaa">PAYS *</label>
<select id="transfert-pays" class="select" onchange="updateIndicatif()">
<option value="229" data-pays="🇧🇯 BÉNIN">🇧🇯 BÉNIN - 229</option>
<option value="228" data-pays="🇹🇬 TOGO">🇹🇬 TOGO - 228</option>
<option value="234" data-pays="🇳🇬 NIGÉRIA">🇳🇬 NIGÉRIA - 234</option>
<option value="233" data-pays="🇬🇭 GHANA">🇬🇭 GHANA - 233</option>
<option value="225" data-pays="🇨🇮 CÔTE D'IVOIRE">🇨🇮 CÔTE D'IVOIRE - 225</option>
<option value="223" data-pays="🇲🇱 MALI">🇲🇱 MALI - 223</option>
<option value="227" data-pays="🇳🇪 NIGER">🇳🇪 NIGER - 227</option>
</select>
<label style="font-size:12px;color:#aaa">RESEAU *</label>
<select id="transfert-reseau" class="select"><option>MTN</option><option>MOOV</option><option>CELTIS</option><option>ORANGE MONEY</option><option>WAVE</option><option>MTN TOGO</option></select>
<label style="font-size:12px;color:#aaa">NUMERO BENEFICIAIRE *</label>
<div class="prefix-box"><span id="prefix-affiche" class="prefix">+229</span><input id="transfert-numero" class="input input-with-prefix"></div>
<label style="font-size:12px;color:#aaa">MONTANT (XOF) *</label><input id="transfert-montant" type="number" class="input">
<label style="font-size:12px;color:#aaa">MOTIF (facultatif)</label><input id="transfert-motif" class="input" placeholder="Ex: Loyer">
<label style="font-size:12px;color:#aaa">WhatsApp (facultatif)</label><input id="transfert-wa" class="input">
<div id="warning-envoi" class="warning-box"><div style="color:#ffeb3b;font-weight:bold">⚠️ CONFIRMER ENVOI</div><div id="detail-envoi" style="font-size:11px;margin-top:6px"></div></div>
<button id="btn-envoi" class="btn btn-envoi" onclick="handleEnvoi()">Continuer</button>
</div>

<div id="zone-retrait" style="display:none">
<label style="font-size:12px;color:#aaa">NUMERO DECAISSEMENT *</label><input id="retrait-numero" class="input" placeholder="Numero qui reçoit le décaissement">
<label style="font-size:12px;color:#aaa">MONTANT *</label><input id="retrait-montant" type="number" class="input" placeholder="Montant">
<label style="font-size:12px;color:#aaa">MOTIF (facultatif)</label><input id="retrait-motif" class="input" placeholder="Ex: Retrait famille">
<label style="font-size:12px;color:#aaa">WhatsApp (facultatif)</label><input id="retrait-wa" class="input">
<div id="warning-retrait" class="warning-box"><div style="color:#ffeb3b;font-weight:bold">✅ RETRAIT</div><div id="detail-retrait" style="font-size:11px;margin-top:6px"></div></div>
<button id="btn-retrait" class="btn btn-retrait" onclick="handleRetrait()">Continuer</button>
</div>

<div id="transfert-status" style="margin-top:8px;font-size:12px;display:none;text-align:center"></div>
</div>

<div class="list"><h3>Mon historique Transfert</h3><div id="histo">Aucun transfert</div></div>
</div>

<div class="bottom"><button class="bnav" onclick="location.href='index.html'">🏠 ACCUEIL</button><button class="bnav" onclick="location.href='forfait.html'">FORFAIT📱</button><button class="bnav active">TRANSFERT💸</button><button class="bnav" onclick="location.href='echange.html'">ECHANGE🔄</button></div>
<div id="custom-alert" class="modal-overlay"><div class="modal-box"><div id="alert-msg"></div><button class="modal-btn btn-yes" style="margin-top:10px" onclick="hideAlert()">OK</button></div></div>
<div id="custom-confirm" class="modal-overlay"><div class="modal-box"><div id="confirm-msg"></div><div class="modal-btns"><button class="modal-btn btn-no" onclick="doConfirm(false)">Pas besoin</button><button class="modal-btn btn-yes" onclick="doConfirm(true)">Oui</button></div></div></div>

<script>
var cfg={apiKey:"AIzaSyDR0zDiGxisp4G-CDjltu8VFmxMMFjXI9E",authDomain:"mayneilliminetdb.firebaseapp.com",databaseURL:"https://mayneilliminetdb-default-rtdb.firebaseio.com",projectId:"mayneilliminetdb"};
if(!firebase.apps.length)firebase.initializeApp(cfg);
var db=firebase.database();
var uid,userNom='Client',solde=0,_lock=false,confirmCallback=null,etapeEnvoi=1,etapeRetrait=1;
var ADMIN_UID="0158612131";
var ONESIGNAL_WEBHOOK='https://script.google.com/macros/s/AKfycbzoM5bqwSZm83RtFHaJK58ByQCqByYc2hCk58GA-97h0FTsC4cqca12cj38w0tf7jxv/exec';

function showAlert(m){document.getElementById('alert-msg').innerText=m;document.getElementById('custom-alert').style.display='flex';}
function hideAlert(){document.getElementById('custom-alert').style.display='none';}
function showConfirm(m,cb){confirmCallback=cb;document.getElementById('confirm-msg').innerText=m;document.getElementById('custom-confirm').style.display='flex';}
function doConfirm(y){document.getElementById('custom-confirm').style.display='none';if(confirmCallback)confirmCallback(y);}
function afficherSucces(id){const t=document.getElementById('global-notif');t.innerText='✅ commande envoyée avec succès!';t.style.display='block';setTimeout(()=>t.style.display='none',20000);const e=document.getElementById(id);if(e){e.innerText='✅ Envoyé';e.style.display='block';}}
function proposerSupport(s,d,cb){let det='';for(const[k,v]of Object.entries(d)){det+=`${k}: ${v}\n`; }const txt=`🔔 SERVICE : ${s}\n👤 ${userNom}\n${det}`;showConfirm('Contacter le personnel sur WhatsApp?',y=>{if(y)window.open('https://wa.me/2290159415617?text='+encodeURIComponent(txt),'_blank');if(cb)cb();});}
async function pushJS(destId,titre,msg){try{await fetch(ONESIGNAL_WEBHOOK,{method:'POST',mode:'no-cors',body:JSON.stringify({destId,titre,message:msg})});}catch(e){}}
function updateIndicatif(){document.getElementById('prefix-affiche').innerText='+'+document.getElementById('transfert-pays').value;}
function switchMode(m){document.getElementById('tab-envoi').style.background=m==='envoi'?'#ff5000':'#1e1e1e';document.getElementById('tab-retrait').style.background=m==='retrait'?'#ff5000':'#1e1e1e';document.getElementById('zone-envoi').style.display=m==='envoi'?'block':'none';document.getElementById('zone-retrait').style.display=m==='retrait'?'block':'none';}

async function init(){
  var u=JSON.parse(localStorage.getItem('mayne_current_user')||'null');
  if(!u||!u.phone){location.href='index.html';return;}
  uid=u.phone.replace(/[^0-9]/g,'');userNom=u.nom||u.phone;
  document.getElementById('uname').textContent=userNom;document.getElementById('uemail').textContent=u.phone;document.getElementById('av').textContent=(userNom[0]||'M').toUpperCase();
  updateIndicatif();
  db.ref('clients/'+uid).on('value',s=>{var d=s.val()||{};solde=+d.solde||0;document.getElementById('solde').textContent=solde.toFixed(2)+' XOF';document.getElementById('com').textContent=(+d.commission||0).toFixed(2)+' XOF';});
  db.ref('commandes_transferts').orderByChild('client_id').equalTo(uid).on('value',s=>{
    var c=document.getElementById('histo');if(!s.exists()){c.innerHTML='Aucun transfert';return;}
    var h='';s.forEach(ch=>{var v=ch.val();var col='#ffbb00';if((v.statut||'').toLowerCase().includes('valid'))col='#28a745';if((v.statut||'').toLowerCase().includes('annul'))col='#dc3545';h=`<div class=item><div><b>${v.type||'Transfert'} - ${v.pays||v.numero_decaissement||''}</b><br><small>${v.numero_complet||v.numero_decaissement} - ${v.date}</small></div><div style="text-align:right"><b>${v.montant}F</b><br><span style="background:${col};color:#fff;padding:2px 6px;border-radius:4px;font-size:10px">${v.statut}</span></div></div>`+h;});c.innerHTML=h;
  });
}

function handleEnvoi(){
  if(etapeEnvoi===1){
    var sel=document.getElementById('transfert-pays'); var pays=sel.options[sel.selectedIndex].getAttribute('data-pays');
    var num=document.getElementById('transfert-numero').value.trim(); var m=Number(document.getElementById('transfert-montant').value);
    if(!num) return showAlert('Numéro bénéficiaire requis'); if(!m||m<100) return showAlert('Montant >=100'); if(solde<m) return showAlert('Solde insuffisant');
    document.getElementById('detail-envoi').innerHTML=`Pays: <b>${pays}</b><br>Numero: <b>+${sel.value}${num}</b><br>Montant: <b>${m}F</b>`;
    document.getElementById('warning-envoi').style.display='block';document.getElementById('btn-envoi').innerText='Valider Envoi';document.getElementById('btn-envoi').className='btn btn-valid';etapeEnvoi=2;
  } else { executerEnvoi(); }
}
async function executerEnvoi(){
  var sel=document.getElementById('transfert-pays'); var indicatif=sel.value; var paysNom=sel.options[sel.selectedIndex].getAttribute('data-pays');
  var reseau=document.getElementById('transfert-reseau').value; var numeroSans=document.getElementById('transfert-numero').value.trim(); var montant=Number(document.getElementById('transfert-montant').value); var motif=document.getElementById('transfert-motif').value.trim(); var wa=document.getElementById('transfert-wa').value.trim();
  if(_lock) return; _lock=true; document.getElementById('btn-envoi').innerText='Traitement...';
  try{
    await db.ref('clients/'+uid).update({solde:solde-montant});
    let numeroComplet='+'+indicatif+numeroSans;
    let full={type:'Envoi',client_id:uid,client_nom:userNom,pays:paysNom,pays_code:indicatif,reseau:reseau,numero_complet:numeroComplet,montant:montant,motif:motif||'Non précisé',whatsapp_client:wa||'Non précisé',date:new Date().toLocaleString('fr-FR'),statut:'en cours'};
    await db.ref('commandes_transferts').push().set(full);
    let msgEnvoi = `TRANSFERT ENVOI\nCLIENT: ${uid} (${userNom})\nNUM BENEF: ${numeroComplet}\nMONTANT: ${montant}F\nMOTIF: ${motif||'Facultatif'}\nWHATSAPP: ${wa||'Facultatif'}`;
    pushJS(ADMIN_UID,"ENVOI "+montant+"F - "+uid,msgEnvoi);
    proposerSupport('transfert',full,()=>afficherSucces('transfert-status'));
    document.getElementById('transfert-numero').value='';document.getElementById('transfert-montant').value='';document.getElementById('transfert-motif').value='';document.getElementById('transfert-wa').value='';
    document.getElementById('warning-envoi').style.display='none';document.getElementById('btn-envoi').innerText='Continuer';document.getElementById('btn-envoi').className='btn btn-envoi';etapeEnvoi=1;
  }catch(e){showAlert(e.message);}finally{_lock=false;}
}

function handleRetrait(){
  if(etapeRetrait===1){
    var num=document.getElementById('retrait-numero').value.trim(); var m=Number(document.getElementById('retrait-montant').value);
    if(!num) return showAlert('Numéro décaissement requis'); if(!m||m<100) return showAlert('Montant >=100');
    document.getElementById('detail-retrait').innerHTML=`Numero décaissement: <b>${num}</b><br>Montant: <b>${m}F</b><br><span style="color:#0f0">Retrait gratuit</span>`;
    document.getElementById('warning-retrait').style.display='block';document.getElementById('btn-retrait').innerText='Valider Retrait';document.getElementById('btn-retrait').className='btn btn-valid';etapeRetrait=2;
  } else { executerRetrait(); }
}
async function executerRetrait(){
  var num=document.getElementById('retrait-numero').value.trim(); var montant=Number(document.getElementById('retrait-montant').value); var motif=document.getElementById('retrait-motif').value.trim(); var wa=document.getElementById('retrait-wa').value.trim();
  if(_lock) return; _lock=true; document.getElementById('btn-retrait').innerText='Traitement...';
  try{
    let full={type:'Retrait',client_id:uid,client_nom:userNom,numero_decaissement:num,montant:montant,motif:motif||'Non précisé',whatsapp_client:wa||'Non précisé',date:new Date().toLocaleString('fr-FR'),statut:'en cours'};
    await db.ref('commandes_transferts').push().set(full);
    let msgRetrait = `TRANSFERT RETRAIT\nCLIENT: ${uid} (${userNom})\nNUM DECAISSEMENT: ${num}\nMONTANT: ${montant}F\nMOTIF: ${motif||'Facultatif'}\nWHATSAPP: ${wa||'Facultatif'}`;
    pushJS(ADMIN_UID,"RETRAIT "+montant+"F - "+uid,msgRetrait);
    proposerSupport('transfert_retrait',full,()=>afficherSucces('transfert-status'));
    document.getElementById('retrait-numero').value='';document.getElementById('retrait-montant').value='';document.getElementById('retrait-motif').value='';document.getElementById('retrait-wa').value='';
    document.getElementById('warning-retrait').style.display='none';document.getElementById('btn-retrait').innerText='Continuer';document.getElementById('btn-retrait').className='btn btn-retrait';etapeRetrait=1;
  }catch(e){showAlert(e.message);}finally{_lock=false;}
}
window.onload=init;
</script>
</body>
</html>
